name: LineageOS 22.2 - BuildBuddy RBE Real Compile Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: los22-star2lte-rbe-real-test
  cancel-in-progress: true

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      BUILDBUDDY_API_KEY: "${{ secrets.BUILDBUDDY_API_KEY }}"

      # Android / Soong RBE
      USE_RBE: "1"
      RBE_DIR: "prebuilts/remoteexecution-client/live"
      RBE_CXX_EXEC_STRATEGY: "remote"

      # reclient expects host:port here, not a Bazel-style grpcs:// URL.
      RBE_service: "remote.buildbuddy.io:443"

      # BuildBuddy authenticates with the x-buildbuddy-api-key gRPC metadata
      # header. Disable Google ADC / per-RPC Google credentials.
      RBE_use_application_default_credentials: "false"
      RBE_use_rpc_credentials: "false"
      RBE_service_no_auth: "true"
      RBE_remote_headers: "x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}"

      # Keep all RBE diagnostics in one place.
      RBE_log_dir: "/tmp/rbe-test"
      RBE_proxy_log_dir: "/tmp/rbe-test"
      RBE_output_dir: "/tmp/rbe-test"
      RBE_reproxy_wait_seconds: "30"
      RBE_v: "1"

      # This workflow is a correctness / connectivity test, not a speed test.
      NINJA_REMOTE_NUM_JOBS: "1"
      NINJA_HIGHMEM_NUM_JOBS: "1"

    steps:
      - name: Reclaim root disk
        shell: bash
        run: |
          set -e
          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile || true
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true

          mkdir -p /home/runner/work/los /tmp/rbe-test

          echo "=== DISK ==="
          df -h /
          echo "=== MEMORY ==="
          free -h
          echo "=== CPU ==="
          nproc

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python-is-python3 \
            openjdk-21-jdk-headless \
            ninja-build

          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validate BuildBuddy secret
        shell: bash
        run: |
          set -e
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is missing."
            exit 1
          fi

      - name: Repo init and install local manifest
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e

          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false

          mkdir -p /home/runner/work/los
          cd /home/runner/work/los

          repo init \
            --depth=1 \
            -u https://github.com/LineageOS/android.git \
            -b lineage-22.2

          mkdir -p .repo/local_manifests

          MANIFEST_SRC="$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml"
          MANIFEST_DST=".repo/local_manifests/star2lte.xml"

          if [ ! -s "$MANIFEST_SRC" ]; then
            echo "::error::Local manifest not found or empty: $MANIFEST_SRC"
            exit 1
          fi

          cp "$MANIFEST_SRC" "$MANIFEST_DST"

          echo "=== LOCAL MANIFEST ==="
          sed -n '1,260p' "$MANIFEST_DST"

      - name: Repo sync
        working-directory: /home/runner/work/los
        timeout-minutes: 120
        shell: bash
        run: |
          set -eo pipefail

          (
            while true; do
              echo "=== RESOURCE SNAPSHOT ==="
              df -h / | tail -1
              free -h | head -2
              sleep 30
            done
          ) &
          MONPID=$!
          trap 'kill "$MONPID" 2>/dev/null || true' EXIT

          if ! repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j"$(nproc)"; then
            echo "::warning::Parallel repo sync failed; retrying with -j4."
            repo sync \
              -c \
              --no-clone-bundle \
              --no-tags \
              --prune \
              -j4
          fi

          # tools/asuite/atest is host-test tooling and depends on the removed
          # Tradefed/loganalysis/suite_harness stack. The v3 local manifest
          # removes it before sync; keep this fallback for runs that accidentally
          # use an older local manifest.
          if [ -d tools/asuite ]; then
            echo "::warning::tools/asuite is present; removing it from the ephemeral CI tree."
            rm -rf tools/asuite
          fi

          # development/ only contains SDK packaging, samples and developer tooling
          # for this build. Its build-tools target depends on the intentionally
          # removed prebuilts/module_sdk/art tree.
          if [ -d development ]; then
            echo "::warning::development tree is present; removing it from the ephemeral CI tree."
            rm -rf development
          fi

          # crosvm is part of the virtual-device/AVF stack. With Virtualization
          # and hardware/google/gfxstream removed, rutabaga_gfx otherwise keeps
          # a dangling libgfxstream_backend dependency.
          if [ -d external/crosvm ]; then
            echo "::warning::external/crosvm is present; removing virtual-device VMM tree."
            rm -rf external/crosvm
          fi

          # Keep system/authgraph runtime source, but remove its tests. The test
          # module depends on libdiced_open_dice from a provider chain that is
          # intentionally absent from this disk-diet CI tree.
          if [ -d system/authgraph/tests ]; then
            echo "::warning::Removing system/authgraph/tests from CI diet tree."
            rm -rf system/authgraph/tests
          fi

          # DeviceDiagnostics TradeInModeTests depend on VTS helper libraries
          # that are intentionally absent. Keep the app, prune only its tests.
          if [ -d packages/apps/DeviceDiagnostics/TradeInModeTests ]; then
            echo "::warning::Pruning DeviceDiagnostics TradeInModeTests."
            rm -rf packages/apps/DeviceDiagnostics/TradeInModeTests
          fi

          # Mesa's gfxstream guest platform is for virtual GPU guests and pulls
          # virtgpu_kumquat_* from crosvm. Physical star2lte does not use it.
          if [ -d external/mesa3d/src/gfxstream ]; then
            echo "::warning::Pruning Mesa gfxstream guest subtree."
            rm -rf external/mesa3d/src/gfxstream
          fi

          # The complete hardware/interfaces/automotive subtree is irrelevant
          # for star2lte and otherwise depends on packages/services/Car.
          if [ -d hardware/interfaces/automotive ]; then
            echo "::warning::Pruning hardware/interfaces/automotive."
            rm -rf hardware/interfaces/automotive
          fi

          # These two build/make utilities are telemetry/editor monitoring tools.
          # Their only missing provider here is asuite_cc_client from the dieted
          # Asuite tree; they are not required to produce the ROM.
          if [ -d build/make/tools/edit_monitor ]; then
            echo "::warning::Pruning build edit_monitor telemetry tool."
            rm -rf build/make/tools/edit_monitor
          fi
          if [ -d build/make/tools/tool_event_logger ]; then
            echo "::warning::Pruning build tool_event_logger telemetry tool."
            rm -rf build/make/tools/tool_event_logger
          fi

          # Eigen is a real dependency of TensorFlow Lite and NeuralNetworks.
          # It must be present from the local manifest; do not replace it with a
          # graph shim.
          if [ ! -f external/eigen/Android.bp ]; then
            echo "::error::external/eigen is missing. Use the v6 CI-diet manifest that keeps platform/external/eigen."
            exit 1
          fi

          echo "=== POST-SYNC DISK ==="
          df -h / /home/runner/work/los


      - name: Install CI diet Soong compatibility stubs
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail

          # platform/cts is intentionally removed from the disk-diet source tree.
          # Several runtime repositories still carry CTS/MTS test Android.bp
          # stanzas. Soong parses those stanzas even though the test modules are
          # not selected for a normal star2lte ROM build.
          #
          # Provide only the tiny defaults needed for graph resolution. These
          # modules do not build or package CTS/MTS.
          mkdir -p ci-diet

          # ProtoLogTool is a real framework build tool and needs actual org.json
          # classes at compile/runtime. Do NOT satisfy json/jsonlib with empty
          # graph shims.
          #
          # The synced libcore tree already contains the Android org.json
          # implementation for this exact LineageOS revision. Stage those local
          # sources instead of downloading a CTS archive from Gitiles.
          CTS_JSON_DIR="ci-diet/cts-json"
          LIBCORE_JSON_DIR="libcore/json/src/main/java/org/json"

          rm -rf "$CTS_JSON_DIR"
          mkdir -p "$CTS_JSON_DIR/src/org"

          if [ ! -f "$LIBCORE_JSON_DIR/JSONObject.java" ]; then
            echo "::error::Missing local libcore org.json sources: $LIBCORE_JSON_DIR"
            find libcore/json -maxdepth 6 -type f 2>/dev/null | head -100 || true
            exit 1
          fi

          cp -a "$LIBCORE_JSON_DIR" "$CTS_JSON_DIR/src/org/"

          if [ ! -f "$CTS_JSON_DIR/src/org/json/JSONObject.java" ]; then
            echo "::error::Failed to stage local org.json sources."
            exit 1
          fi

          echo "Using org.json sources from current libcore revision."
          echo "JSON source count: $(find "$CTS_JSON_DIR/src/org/json" -type f -name '*.java' | wc -l)"
          find "$CTS_JSON_DIR/src/org/json" -maxdepth 1 -type f -name '*.java' -printf '%f\n' | sort

          # libassemblevintf / assemble_vintf are real host build tools and
          # depend on libvts_vintf_test_common. Restoring the whole VTS HAL repo
          # would bring back a large test graph, so stage only the exact provider
          # subtree from the AOSP tag used by LineageOS 22.2.
          VTS_AOSP_TAG="android-15.0.0_r32"
          VTS_STAGE_DIR="ci-diet/vts-vintf-common"
          VTS_TMP_DIR="$(mktemp -d)"

          rm -rf "$VTS_STAGE_DIR"
          mkdir -p "$VTS_STAGE_DIR"

          echo "Fetching minimal libvts_vintf_test_common from ${VTS_AOSP_TAG}..."
          git clone             --depth=1             --filter=blob:none             --sparse             --branch "$VTS_AOSP_TAG"             https://android.googlesource.com/platform/test/vts-testcase/hal             "$VTS_TMP_DIR/hal"

          git -C "$VTS_TMP_DIR/hal" sparse-checkout set             treble/vintf/libvts_vintf_test_common

          cp -a             "$VTS_TMP_DIR/hal/treble/vintf/libvts_vintf_test_common/."             "$VTS_STAGE_DIR/"

          rm -rf "$VTS_TMP_DIR"

          if [ ! -f "$VTS_STAGE_DIR/Android.bp" ] ||              [ ! -f "$VTS_STAGE_DIR/common.cpp" ]; then
            echo "::error::Failed to stage real libvts_vintf_test_common sources."
            exit 1
          fi

          if ! grep -q 'name: "libvts_vintf_test_common"' "$VTS_STAGE_DIR/Android.bp"; then
            echo "::error::Staged VTS VINTF provider does not define libvts_vintf_test_common."
            cat "$VTS_STAGE_DIR/Android.bp"
            exit 1
          fi

          # system/authgraph/tests is intentionally pruned. The remaining
          # boringssl/core test modules still reference libauthgraph_core_test.
          # Provide only a tiny Rust test-helper graph shim; it is not selected
          # for the star2lte ROM.
          mkdir -p ci-diet/authgraph-core-test
          cat > ci-diet/authgraph-core-test/lib.rs <<'EOF_RUST'
          #![allow(dead_code)]
          pub fn ci_diet_placeholder() {}
          EOF_RUST

          # ===== Minimal REAL providers from platform/development =====
          #
          # The manifest intentionally removes the full development project
          # because development/build pulls SDK-packaging prebuilts that are not
          # needed for a ROM. However ADB/Fastboot/recovery need three providers:
          #   platform_tools_version  (development/sdk)
          #   python-symbol           (development/scripts)
          #   adb_py                  (development/python-packages)
          #
          # Stage only their real source files from the exact AOSP release that
          # matches BUILD_ID=BP1A.250505.005.
          DEV_AOSP_TAG="android-15.0.0_r32"
          DEV_STAGE_DIR="ci-diet/development-provider"
          DEV_TMP_DIR="$(mktemp -d)"

          rm -rf "$DEV_STAGE_DIR"
          mkdir -p             "$DEV_STAGE_DIR/sdk"             "$DEV_STAGE_DIR/scripts"             "$DEV_STAGE_DIR/python-packages"

          echo "Fetching minimal platform/development providers from ${DEV_AOSP_TAG}..."
          git clone             --depth=1             --filter=blob:none             --sparse             --branch "$DEV_AOSP_TAG"             https://android.googlesource.com/platform/development             "$DEV_TMP_DIR/development"

          git -C "$DEV_TMP_DIR/development" sparse-checkout set             sdk             scripts             python-packages

          cp             "$DEV_TMP_DIR/development/sdk/plat_tools_source.prop_template"             "$DEV_STAGE_DIR/sdk/"

          cp             "$DEV_TMP_DIR/development/scripts/symbol.py"             "$DEV_STAGE_DIR/scripts/"

          mkdir -p "$DEV_STAGE_DIR/python-packages/adb"
          cp -a             "$DEV_TMP_DIR/development/python-packages/adb/."             "$DEV_STAGE_DIR/python-packages/adb/"

          rm -rf "$DEV_TMP_DIR"

          if [ ! -f "$DEV_STAGE_DIR/sdk/plat_tools_source.prop_template" ]; then
            echo "::error::Missing staged platform_tools_version input."
            exit 1
          fi
          if [ ! -f "$DEV_STAGE_DIR/scripts/symbol.py" ]; then
            echo "::error::Missing staged python-symbol source."
            exit 1
          fi
          if ! find "$DEV_STAGE_DIR/python-packages/adb" -type f -name '*.py' -print -quit | grep -q .; then
            echo "::error::Missing staged adb_py sources."
            exit 1
          fi

          echo "Minimal development providers staged successfully."

          cat > ci-diet/Android.bp <<'EOF'
          // CI-only compatibility stubs for the disk-diet star2lte source tree.
          //
          // platform/cts is intentionally not synced on the GitHub runner.
          // Some runtime source repositories still contain CTS/MTS test modules
          // in Android.bp files. Soong parses them even when they are never
          // selected for the ROM.
          //
          // Keep these definitions minimal: they only satisfy graph resolution.

          package {
              default_visibility: ["//visibility:public"],
          }

          java_defaults {
              name: "cts_error_prone_rules",
          }

          java_defaults {
              name: "cts_error_prone_rules_tests",
          }

          java_defaults {
              name: "cts_support_defaults",
              defaults: ["cts_error_prone_rules_tests"],
              dex_preopt: {
                  enabled: false,
              },
              optimize: {
                  enabled: false,
              },
          }

          java_defaults {
              name: "cts_defaults",
              defaults: ["cts_support_defaults"],
          }

          java_defaults {
              name: "mts-target-sdk-version-current",
              target_sdk_version: "10000",
          }

          // ===== Removed Automotive / Car providers =====

          cc_defaults {
              name: "vhalclient_defaults",
          }

          cc_defaults {
              name: "android-automotive-large-parcelable-defaults",
          }

          cc_defaults {
              name: "powerpolicyclient_defaults",
          }

          // ===== Removed AVF / Virtualization provider =====
          //
          // Only Microdroid/AVF variants currently reference this in the
          // disk-diet graph. star2lte does not select those variants.

          cc_defaults {
              name: "avf_build_flags_cc",
          }

          // ===== Removed Tradefed provider =====

          java_defaults {
              name: "tradefed_errorprone_defaults",
          }

          // ===== Removed platform_testing providers =====

          rust_defaults {
              name: "rdroidtest.defaults",
          }

          // MotionTestDefaults is consumed only by SystemUI motion-test modules
          // in this tree. A plain java_defaults shim is sufficient for Soong
          // graph resolution because the tests are not selected for the ROM.
          java_defaults {
              name: "MotionTestDefaults",
          }

          // ===== Removed Tradefed / CTS / suite_harness host libraries =====
          //
          // These modules are referenced only by host-test/tooling stanzas that
          // Soong still parses inside runtime repositories. They are deliberately
          // empty because those tests/tools are not selected for the star2lte ROM.

          java_library_host {
              name: "tradefed",
          }

          java_library_host {
              name: "compatibility-host-util",
          }

          java_library_host {
              name: "cts-tradefed",
          }

          java_library_host {
              name: "cts-install-lib-host",
          }

          java_library_host {
              name: "loganalysis",
          }

          // ===== Optional AWS KMS dependencies removed from the diet tree =====
          //
          // tools/apksig keeps optional AWS KMS provider modules in its Android.bp.
          // Normal Android ROM signing does not require these libraries.

          java_library_host {
              name: "awssdk-kms",
          }

          java_library_host {
              name: "awssdk-url-connection-client",
          }

          // ===== Removed suite_harness host library =====
          java_library_host {
              name: "compatibility-tradefed",
          }

          // ===== CTS json / vogar host providers removed with platform/cts =====
          // libcore/tools/non-cts-json-generator is host-side non-CTS tooling.
          // Match the upstream provider module kinds so Soong can resolve graph.

          // ===== Real CTS JSON provider needed by framework ProtoLogTool =====
          //
          // Unlike most entries in this file, json/jsonlib are NOT empty graph
          // shims. frameworks/base/tools/protologtool is a real host build tool
          // and must compile/run against actual org.json classes.

          java_library {
              name: "json",
              host_supported: true,
              srcs: ["cts-json/src/**/*.java"],
              sdk_version: "current",
              java_version: "11",
          }

          java_library_host {
              name: "jsonlib",
              static_libs: ["json"],
          }

          java_library_host {
              name: "vogarexpectlib",
          }

          // ===== Remaining CTS / platform_testing graph providers =====

          // Upstream platform/cts/tools/cts-tradefed.
          java_library_host {
              name: "cts-tradefed-harness",
          }

          // Upstream platform_testing/libraries/annotations.
          // This dependency is currently reached by test/input modules such as
          // lockedregioncodeinjection_input; those are not selected for the ROM.
          java_library_static {
              name: "platform-test-annotations",
              host_supported: true,
          }

          // ===== Remaining CTS / platform_testing host-test providers =====
          //
          // These are referenced only by host-test modules that Soong parses.
          // They are not selected for the star2lte ROM, so empty host providers
          // are sufficient for graph resolution.

          java_library_host {
              name: "cts-shim-host-lib",
          }

          java_library_host {
              name: "flag-junit-host",
          }

          java_library_host {
              name: "cts-statsd-atom-host-test-utils",
          }

          java_library_host {
              name: "cts-host-utils",
          }

          java_library_host {
              name: "compatibility-host-util-axt",
          }

          // ===== REAL platform/development providers =====
          //
          // These use upstream source files staged from android-15.0.0_r32.
          // They are not empty graph shims.

          genrule {
              name: "platform_tools_version",
              cmd: "sed 's/$${PLATFORM_SDK_VERSION}/0/ ; s/^Pkg.Revision=\\(.*\\)/#define PLATFORM_TOOLS_VERSION \"\\1\"/p ; d' $(in) > $(out)",
              srcs: ["development-provider/sdk/plat_tools_source.prop_template"],
              out: ["platform_tools_version.h"],
          }

          python_library_host {
              name: "python-symbol",
              srcs: ["development-provider/scripts/symbol.py"],
          }

          // adb_py is NOT declared here: the staged upstream file
          // development-provider/python-packages/adb/Android.bp already
          // declares it. Keep that original module to avoid duplicate names.

          // ===== AuthGraph test helper removed with system/authgraph/tests =====
          //
          // This is test-only. The real AuthGraph runtime libraries remain in
          // system/authgraph. Both Android and host variants are provided so
          // unselected rust_test modules can resolve their graph.

          rust_library {
              name: "libauthgraph_core_test",
              crate_name: "authgraph_core_test",
              srcs: ["authgraph-core-test/lib.rs"],
              host_supported: true,
          }
          EOF

          echo "=== CI DIET SOONG STUBS ==="
          sed -n '1,220p' ci-diet/Android.bp

          test -s ci-diet/Android.bp

          # adb_py is defined in the upstream Android.bp staged in v14.
          # Do not declare it again in the top-level CI-diet Android.bp.
          ADB_BP="ci-diet/development-provider/python-packages/adb/Android.bp"
          if [ ! -f "$ADB_BP" ] || ! grep -Eq 'name:[[:space:]]*"adb_py"' "$ADB_BP"; then
            echo "::error::Missing original adb_py provider in $ADB_BP"
            exit 1
          fi
          if grep -Eq 'name:[[:space:]]*"adb_py"' ci-diet/Android.bp; then
            echo "::error::Duplicate adb_py declaration in ci-diet/Android.bp"
            exit 1
          fi
          echo "Using upstream adb_py provider: $ADB_BP"

          for module in \
            cts_error_prone_rules \
            cts_error_prone_rules_tests \
            cts_support_defaults \
            cts_defaults \
            mts-target-sdk-version-current \
            vhalclient_defaults \
            android-automotive-large-parcelable-defaults \
            powerpolicyclient_defaults \
            avf_build_flags_cc \
            tradefed_errorprone_defaults \
            rdroidtest.defaults \
            MotionTestDefaults \
            tradefed \
            compatibility-host-util \
            cts-tradefed \
            cts-install-lib-host \
            loganalysis \
            awssdk-kms \
            awssdk-url-connection-client \
            compatibility-tradefed \
            json \
            vogarexpectlib \
            jsonlib \
            cts-tradefed-harness \
            platform-test-annotations \
            cts-shim-host-lib \
            flag-junit-host \
            cts-statsd-atom-host-test-utils \
            cts-host-utils \
            compatibility-host-util-axt \
            platform_tools_version \
            python-symbol \
            libauthgraph_core_test
          do
            if ! grep -q "name: \"${module}\"" ci-diet/Android.bp; then
              echo "::error::Missing CI diet Soong stub: ${module}"
              exit 1
            fi
          done

          # The real CTS project must stay absent; otherwise these names would
          # collide with the genuine platform/cts definitions.
          if [ -d cts ]; then
            echo "::error::platform/cts is present while CI stubs are enabled."
            exit 1
          fi

          if [ -d tools/asuite ]; then
            echo "::error::tools/asuite is still present in the CI diet tree."
            exit 1
          fi

          if [ -d development ]; then
            echo "::error::development is still present in the CI diet tree."
            exit 1
          fi

          if [ -d external/crosvm ]; then
            echo "::error::external/crosvm is still present in the CI diet tree."
            exit 1
          fi

          if [ -d system/authgraph/tests ]; then
            echo "::error::system/authgraph/tests is still present in the CI diet tree."
            exit 1
          fi

          for removed_path in             packages/apps/DeviceDiagnostics/TradeInModeTests             external/mesa3d/src/gfxstream             hardware/interfaces/automotive             build/make/tools/edit_monitor             build/make/tools/tool_event_logger
          do
            if [ -e "$removed_path" ]; then
              echo "::error::CI diet path still exists: $removed_path"
              exit 1
            fi
          done

          if ! grep -q 'srcs: \["cts-json/src/\*\*/\*.java"\]' ci-diet/Android.bp; then
            echo "::error::json provider is not backed by staged local org.json sources."
            exit 1
          fi

          if ! grep -q 'name: "jsonlib"' ci-diet/Android.bp; then
            echo "::error::jsonlib provider is missing."
            exit 1
          fi

          echo "CI diet Soong compatibility stubs installed successfully."


      - name: Patch CI diet virtualization fuzzer binding
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail

          # packages/modules/Virtualization is intentionally removed from this
          # disk-diet source tree. system/sepolicy still references
          # virtualizationmanager_fuzzer for android.system.virtualizationservice.
          #
          # The Go map aligns values using variable whitespace, so use a
          # whitespace-tolerant regex instead of an exact formatted line.
          if [ -d packages/modules/Virtualization ]; then
            echo "Virtualization tree is present; keeping upstream fuzzer binding."
            exit 0
          fi

          BINDINGS="system/sepolicy/build/soong/service_fuzzer_bindings.go"

          if [ ! -f "$BINDINGS" ]; then
            echo "::error::Missing expected sepolicy binding file: $BINDINGS"
            exit 1
          fi

          echo "=== BEFORE PATCH ==="
          grep -n -E 'android\.system\.virtualizationservice|virtualizationmanager_fuzzer' "$BINDINGS" || true

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("system/sepolicy/build/soong/service_fuzzer_bindings.go")
          s = p.read_text(encoding="utf-8")

          already = re.search(
              r'(?m)^\s*"android\.system\.virtualizationservice"\s*:\s*EXCEPTION_NO_FUZZER\s*,\s*$',
              s,
          )
          if already:
              print("virtualizationservice is already EXCEPTION_NO_FUZZER.")
              raise SystemExit(0)

          pattern = re.compile(
              r'(?m)^(\s*"android\.system\.virtualizationservice"\s*:\s*)'
              r'\[\]string\s*\{\s*"virtualizationmanager_fuzzer"\s*\}\s*,\s*$'
          )

          patched, count = pattern.subn(r'\1EXCEPTION_NO_FUZZER,', s, count=1)

          if count != 1:
              print("Could not match the virtualizationservice fuzzer binding.")
              print("Relevant source lines:")
              for i, line in enumerate(s.splitlines(), 1):
                  if "android.system.virtualizationservice" in line or "virtualizationmanager_fuzzer" in line:
                      print(f"{i}: {line}")
              raise SystemExit(1)

          p.write_text(patched, encoding="utf-8")
          print("Patched virtualizationservice fuzzer binding for CI diet.")
          PY

          echo "=== AFTER PATCH ==="
          grep -n -E 'android\.system\.virtualizationservice|virtualizationmanager_fuzzer' "$BINDINGS" || true

          if ! grep -Eq '"android\.system\.virtualizationservice"[[:space:]]*:[[:space:]]*EXCEPTION_NO_FUZZER' "$BINDINGS"; then
            echo "::error::CI diet virtualization fuzzer patch verification failed."
            exit 1
          fi

          echo "Virtualization fuzzer binding patch verified."
      - name: Verify star2lte product registration
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -eo pipefail

          echo "=== PRODUCT REGISTRATION ==="

          MATCHES="$(
            grep -R -l \
              --include='AndroidProducts.mk' \
              'lineage_star2lte' \
              device vendor 2>/dev/null | head -20 || true
          )"

          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find lineage_star2lte in any AndroidProducts.mk."
            echo "The local manifest did not sync/register the star2lte product correctly."
            find device vendor -maxdepth 4 -name AndroidProducts.mk -print 2>/dev/null | head -100 || true
            exit 1
          fi

          printf '%s\n' "$MATCHES"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "--- $file"
            sed -n '1,180p' "$file"
          done <<< "$MATCHES"

      - name: Inspect Android reclient
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== RECLIENT DIRECTORY ==="
          ls -lah "$RBE_DIR"

          test -x "$RBE_DIR/reproxy"
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/bootstrap"

          echo "=== REPROXY VERSION ==="
          "$RBE_DIR/reproxy" --version || true

          echo "=== REWRAPPER VERSION ==="
          "$RBE_DIR/rewrapper" --version || true

          echo "=== BOOTSTRAP VERSION ==="
          "$RBE_DIR/bootstrap" --version || true

      - name: Check BuildBuddy network connectivity
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== DNS ==="
          getent hosts remote.buildbuddy.io

          echo "=== TCP 443 ==="
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/remote.buildbuddy.io/443'

          echo "BuildBuddy TCP endpoint is reachable."
          echo "Authentication will be validated by the real reclient compile below."

      - name: Configure Lineage and run real RBE C++ compile
        working-directory: /home/runner/work/los
        timeout-minutes: 45
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p /tmp/rbe-test

          # Lineage's breakfast helper reads the correct target release from
          # vendor/lineage/vars/aosp_target_release and expands star2lte to
          # lineage_star2lte-<release>-userdebug.
          source build/envsetup.sh
          source vendor/lineage/vars/aosp_target_release

          EXPECTED_RELEASE="${aosp_target_release}"
          breakfast star2lte userdebug

          echo "=== LINEAGE BUILD SELECTION ==="
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-unset}"
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-unset}"
          echo "TARGET_RELEASE=${TARGET_RELEASE:-unset}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-unset}"
          echo "TARGET_BUILD_TYPE=${TARGET_BUILD_TYPE:-unset}"
          echo "EXPECTED_RELEASE=${EXPECTED_RELEASE}"

          test -n "${ANDROID_BUILD_TOP:-}"
          test "${TARGET_PRODUCT}" = "lineage_star2lte"
          test "${TARGET_RELEASE}" = "${EXPECTED_RELEASE}"
          test "${TARGET_BUILD_VARIANT}" = "userdebug"

          if [ "$(cd "$ANDROID_BUILD_TOP" && pwd -P)" != "$(pwd -P)" ]; then
            echo "::error::ANDROID_BUILD_TOP does not point at the current source tree."
            exit 1
          fi

          echo "=== EFFECTIVE RBE CONFIG ==="
          {
            echo "USE_RBE=${USE_RBE}"
            echo "RBE_service=${RBE_service}"
            echo "RBE_DIR=${RBE_DIR}"
            echo "RBE_CXX_EXEC_STRATEGY=${RBE_CXX_EXEC_STRATEGY}"
            echo "RBE_use_application_default_credentials=${RBE_use_application_default_credentials}"
            echo "RBE_use_rpc_credentials=${RBE_use_rpc_credentials}"
            echo "RBE_service_no_auth=${RBE_service_no_auth}"
            echo "RBE_remote_headers=x-buildbuddy-api-key=<redacted>"
            echo "RBE_log_dir=${RBE_log_dir}"
            echo "RBE_proxy_log_dir=${RBE_proxy_log_dir}"
            echo "RBE_output_dir=${RBE_output_dir}"
            echo "NINJA_REMOTE_NUM_JOBS=${NINJA_REMOTE_NUM_JOBS}"
          } | tee /tmp/rbe-test/rbe-env.txt

          echo "=== VERIFY CI DIET PATCHES BEFORE SOONG ==="
          BINDINGS="$ANDROID_BUILD_TOP/system/sepolicy/build/soong/service_fuzzer_bindings.go"

          if [ ! -d "$ANDROID_BUILD_TOP/packages/modules/Virtualization" ]; then
            if grep -q 'virtualizationmanager_fuzzer' "$BINDINGS"; then
              echo "::error::virtualizationmanager_fuzzer binding is still active while Virtualization is absent."
              grep -n -E 'android\.system\.virtualizationservice|virtualizationmanager_fuzzer' "$BINDINGS" || true
              exit 1
            fi

            if grep -q 'android.system.virtualizationservice' "$BINDINGS"; then
              echo "Virtualization service binding after CI diet patch:"
              grep -n 'android.system.virtualizationservice' "$BINDINGS" || true
            else
              echo "::warning::virtualizationservice binding not found; continuing because the forbidden fuzzer reference is absent."
            fi
          else
            echo "Virtualization tree is present; no CI diet sepolicy verification required."
          fi

          echo "=== VERIFY REAL RESTORED/STAGED PROVIDERS ==="
          test -f "$ANDROID_BUILD_TOP/ci-diet/development-provider/sdk/plat_tools_source.prop_template"
          test -f "$ANDROID_BUILD_TOP/ci-diet/development-provider/scripts/symbol.py"
          test -n "$(find "$ANDROID_BUILD_TOP/ci-diet/development-provider/python-packages/adb" -type f -name '*.py' -print -quit)"

          grep -n 'name: "platform_tools_version"' "$ANDROID_BUILD_TOP/ci-diet/Android.bp"
          grep -n 'name: "python-symbol"' "$ANDROID_BUILD_TOP/ci-diet/Android.bp"
          grep -n 'name: "adb_py"' "$ANDROID_BUILD_TOP/ci-diet/development-provider/python-packages/adb/Android.bp"
          test -f "$ANDROID_BUILD_TOP/external/eigen/Android.bp"
          grep -n 'name: "libeigen"' "$ANDROID_BUILD_TOP/external/eigen/Android.bp" | head -1

          test -f "$ANDROID_BUILD_TOP/ci-diet/vts-vintf-common/Android.bp"
          grep -n 'name: "libvts_vintf_test_common"'             "$ANDROID_BUILD_TOP/ci-diet/vts-vintf-common/Android.bp"

          echo "=== VERIFY CI DIET STUBS BEFORE SOONG ==="
          test -s "$ANDROID_BUILD_TOP/ci-diet/Android.bp"
          grep -n -E 'name: "(cts_defaults|cts_support_defaults|cts_error_prone_rules|cts_error_prone_rules_tests|mts-target-sdk-version-current|platform_tools_version|python-symbol)"'             "$ANDROID_BUILD_TOP/ci-diet/Android.bp"

          echo "=== GENERATE BUILD GRAPH ==="
          m nothing 2>&1 | tee /tmp/rbe-test/m-nothing.log

          BUILD_NINJA="$ANDROID_BUILD_TOP/out/combined-${TARGET_PRODUCT}.ninja"

          if [ ! -s "$BUILD_NINJA" ]; then
            echo "::warning::Expected combined ninja was not found at: $BUILD_NINJA"
            BUILD_NINJA="$(
              find "$ANDROID_BUILD_TOP/out" \
                -maxdepth 1 \
                -type f \
                -name 'combined*.ninja' \
                -print | head -1
            )"
          fi

          if [ -z "${BUILD_NINJA:-}" ] || [ ! -s "$BUILD_NINJA" ]; then
            echo "::error::Could not locate the generated combined Ninja graph."
            find "$ANDROID_BUILD_TOP/out" -maxdepth 2 -type f -name '*.ninja' -print | head -100 || true
            exit 1
          fi

          echo "BUILD_NINJA=$BUILD_NINJA" | tee /tmp/rbe-test/build-ninja.txt

          echo "=== VERIFY REWRAPPER IS PRESENT IN GENERATED GRAPH ==="
          : > /tmp/rbe-test/rewrapper-ninja-matches.txt
          FOUND_REWRAPPER=0

          for ninja_file in \
            "$ANDROID_BUILD_TOP/out/soong/build.ninja" \
            "$BUILD_NINJA"; do
            if [ -s "$ninja_file" ]; then
              if grep -n -m 20 -E 'remoteexecution-client/.*/rewrapper|(^|[ /])rewrapper([ "]|$)' \
                "$ninja_file" \
                | tee -a /tmp/rbe-test/rewrapper-ninja-matches.txt; then
                FOUND_REWRAPPER=1
              fi
            fi
          done

          if [ "$FOUND_REWRAPPER" -ne 1 ]; then
            echo "::error::RBE is enabled, but no rewrapper command was found in the generated Ninja graph."
            echo "This means the C/C++ actions are not actually being routed through reclient."
            exit 1
          fi

          echo "=== REAL C++ BUILD: libbase ==="
          echo "This is intentionally a clean source-output build without restored ccache."
          echo "RBE_CXX_EXEC_STRATEGY=remote makes a remote failure fatal instead of silently falling back locally."

          m -j1 libbase 2>&1 | tee /tmp/rbe-test/real-cxx-compile.log

          echo "=== RBE OUTPUT FILES ==="
          find /tmp/rbe-test \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | tee /tmp/rbe-test/rbe-files.txt

          echo "=== RBE METRICS ==="
          if [ -s /tmp/rbe-test/rbe_metrics.txt ]; then
            cat /tmp/rbe-test/rbe_metrics.txt
          else
            echo "::warning::rbe_metrics.txt was not produced by this reclient version."
          fi

          echo "=== RBE ERROR SCAN ==="
          grep -R -n -E \
            'Unauthenticated|PermissionDenied|PERMISSION_DENIED|UNAUTHENTICATED|credential|authentication|FAILED|FATAL|ERROR' \
            /tmp/rbe-test \
            --exclude='real-cxx-compile.log' \
            --exclude='m-nothing.log' \
            2>/dev/null | head -200 || true

          echo "=== RBE TEST PASSED ==="
          echo "Lineage product: ${TARGET_PRODUCT}-${TARGET_RELEASE}-${TARGET_BUILD_VARIANT}"
          echo "Real C++ module build completed with RBE_CXX_EXEC_STRATEGY=remote."

      - name: RBE diagnostics
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e

          mkdir -p /tmp/rbe-test

          echo "=== SAFE RBE ENV ==="
          cat /tmp/rbe-test/rbe-env.txt 2>/dev/null || true

          echo "=== RBE LOG DIRECTORY ==="
          find /tmp/rbe-test \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort || true

          echo "=== REPROXY PROCESSES ==="
          ps aux | grep -E '[r]eproxy|[r]ewrapper|[s]candeps' || true

          echo "=== DISK ==="
          df -h / /home/runner/work/los || true

          echo "=== REPROXY LOG TAIL ==="
          tail -n 220 /tmp/rbe-test/reproxy_log.txt 2>/dev/null || true

          echo "=== RBE METRICS ==="
          cat /tmp/rbe-test/rbe_metrics.txt 2>/dev/null || true

          echo "=== BUILD GRAPH LOG TAIL ==="
          tail -n 160 /tmp/rbe-test/m-nothing.log 2>/dev/null || true

          echo "=== REAL C++ BUILD LOG TAIL ==="
          tail -n 220 /tmp/rbe-test/real-cxx-compile.log 2>/dev/null || true

      - name: Upload RBE test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbe-test-logs-${{ github.run_id }}
          path: |
            /tmp/rbe-test
            /home/runner/work/los/.repo/repo.log
          if-no-files-found: warn
          retention-days: 7
