name: LineageOS 22.2 star2lte - v24 Clean Baseline

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Stage to execute: audit first, then graph, rbe-smoke, full-rom"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - graph
          - rbe-smoke
          - full-rom
      runner:
        description: "GitHub hosted or your configured Linux self-hosted runner"
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - self-hosted
      sync_jobs:
        description: "repo sync jobs (keep low to limit disk/memory pressure)"
        required: true
        default: '2'
        type: string
      build_jobs:
        description: "Ninja build concurrency"
        required: true
        default: '2'
        type: string
      enable_rbe:
        description: "Use BuildBuddy for full-rom (rbe-smoke always uses it)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: los22-star2lte-v24-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      # Work inside GITHUB_WORKSPACE on either hosted or self-hosted Linux.
      ANDROID_BUILD_TOP: ${{ github.workspace }}/android
      REPORT_DIR: ${{ github.workspace }}/ci-reports
      SYNC_JOBS: ${{ inputs.sync_jobs }}
      BUILD_JOBS: ${{ inputs.build_jobs }}
      GIT_TERMINAL_PROMPT: '0'
      NINJA_HIGHMEM_NUM_JOBS: '1'
      NINJA_REMOTE_NUM_JOBS: '2'
      RBE_DIR: prebuilts/remoteexecution-client/live
      RBE_service: remote.buildbuddy.io:443
      RBE_use_application_default_credentials: 'false'
      RBE_use_rpc_credentials: 'false'
      RBE_service_no_auth: 'true'
      RBE_CXX_EXEC_STRATEGY: remote
      RBE_log_dir: ${{ github.workspace }}/ci-reports/rbe
      RBE_proxy_log_dir: ${{ github.workspace }}/ci-reports/rbe
      RBE_output_dir: ${{ github.workspace }}/ci-reports/rbe
      RBE_reproxy_wait_seconds: '30'

    steps:
      - name: Checkout workflow configuration
        uses: actions/checkout@v4
        with:
          path: config-repo
          persist-credentials: false

      - name: Preflight - runner and disk
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" != Linux ]; then
            echo '::error::v24-clean requires Linux (x86_64).'
            exit 1
          fi
          mkdir -p "$REPORT_DIR" "$REPORT_DIR/rbe" "$ANDROID_BUILD_TOP"
          {
            echo "date=$(date -u --iso-8601=seconds)"
            echo "runner=$RUNNER_NAME"
            echo "mode=${{ inputs.run_mode }}"
            echo "arch=$(uname -m)"
            echo "source_root=$ANDROID_BUILD_TOP"
            echo '=== df -h ==='
            df -h "$GITHUB_WORKSPACE" "$ANDROID_BUILD_TOP"
            echo '=== df -i ==='
            df -i "$GITHUB_WORKSPACE"
            echo '=== free ==='
            free -h
            echo '=== CPU ==='
            nproc
          } | tee "$REPORT_DIR/00-preflight.txt"

          case "$SYNC_JOBS:$BUILD_JOBS" in
            *[!0-9:]*|:*|*:) echo '::error::sync_jobs/build_jobs must be positive integers'; exit 1 ;;
          esac
          if [ "$SYNC_JOBS" -lt 1 ] || [ "$BUILD_JOBS" -lt 1 ]; then
            echo '::error::sync_jobs/build_jobs must be >= 1'
            exit 1
          fi

      - name: Reclaim disposable tools - GitHub hosted runner only
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          # Only disposable preinstalled SDK/toolchain bundles are removed.
          # This step is deliberately skipped on persistent self-hosted runners.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h "$GITHUB_WORKSPACE" | tee "$REPORT_DIR/01-disk-after-reclaim.txt"

      - name: Install repo (lightweight)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version | tee "$REPORT_DIR/repo-tool-version.txt" || true

      - name: Initialize clean manifest - NO repo dieting
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          cd "$ANDROID_BUILD_TOP"
          git config --global user.email 'ci@local.invalid'
          git config --global user.name 'ROM CI'

          # Partial clone minimizes Git history/object downloads; source files
          # remain complete. Avoid --depth=1: revisions and tags may need history.
          extra=()
          if git lfs version >/dev/null 2>&1; then
            extra+=(--git-lfs)
          fi
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-22.2 \
            --partial-clone --clone-filter=blob:none \
            --no-use-superproject --no-clone-bundle \
            "${extra[@]}" 2>&1 | tee "$REPORT_DIR/repo-init.log"

          source_manifest="$GITHUB_WORKSPACE/config-repo/.repo-local-manifests/star2lte-v24-clean.xml"
          if [ ! -s "$source_manifest" ]; then
            echo "::error::Commit the clean manifest at .repo-local-manifests/star2lte-v24-clean.xml: $source_manifest"
            exit 1
          fi

          # Reject any leftover v1..v23 remove-project instructions early.
          python3 - "$source_manifest" <<'PY_CHECK_MANIFEST'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          removed = root.findall('remove-project')
          projects = root.findall('project')
          if removed:
              raise SystemExit(f'Clean baseline rejects {len(removed)} remove-project entries')
          if len(projects) != 12:
              raise SystemExit(f'Expected 13 device/vendor/kernel/HAL projects, got {len(projects)}')
          print(f'Clean local manifest: {len(projects)} additional projects, zero removals')
          PY_CHECK_MANIFEST

          mkdir -p .repo/local_manifests
          # Prevent hidden local manifests on a persistent self-hosted checkout
          # from silently reintroducing source dieting or duplicate projects.
          stale=$(find .repo/local_manifests -maxdepth 1 -type f ! -name star2lte.xml -print -quit)
          if [ -n "$stale" ]; then
            echo "::error::Unexpected extra local manifest: $stale. Remove it from the self-hosted checkout before retrying."
            exit 1
          fi
          cp "$source_manifest" .repo/local_manifests/star2lte.xml
          if [ -e ci-diet/Android.bp ]; then
            echo '::error::Found legacy ci-diet/Android.bp in persistent source checkout. Use a clean source directory.'
            exit 1
          fi
          repo manifest -o "$REPORT_DIR/manifest-before-sync.xml"
          python3 - "$REPORT_DIR/manifest-before-sync.xml" <<'PY_COUNT'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print('Resolved manifest project count:', len(root.findall('project')))
          PY_COUNT

      - name: Sync full source graph (partial Git clone)
        shell: bash
        timeout-minutes: 210
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          cd "$ANDROID_BUILD_TOP"
          # Do not rm -rf source projects, strip Android.bp, or add dummy modules.
          repo sync -c -j"$SYNC_JOBS" --no-clone-bundle --fail-fast \
            2>&1 | tee "$REPORT_DIR/repo-sync.log"

      - name: Measure fully synced source and lock revisions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          cd "$ANDROID_BUILD_TOP"
          repo manifest -r -o "$REPORT_DIR/manifest-resolved-locked.xml"
          {
            echo '=== SOURCE / GIT DISK USE ==='
            df -h .
            for p in .repo/project-objects .repo/projects \
              prebuilts external frameworks packages hardware system \
              vendor device kernel build out; do
              if [ -e "$p" ]; then du -sh "$p" || true; fi
            done
            echo '=== FREE BYTES ==='
            df -B1 --output=avail . | tail -n 1
          } | tee "$REPORT_DIR/02-synced-disk.txt"

          echo '### v24 Clean Source Audit' >> "$GITHUB_STEP_SUMMARY"
          echo '- Zero AOSP/Lineage repository removals' >> "$GITHUB_STEP_SUMMARY"
          echo '- Revision lock: manifest-resolved-locked.xml in diagnostics artifact' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source root: $ANDROID_BUILD_TOP" >> "$GITHUB_STEP_SUMMARY"
          df -h . >> "$GITHUB_STEP_SUMMARY"

      - name: Disk capacity gate (before Soong)
        if: ${{ inputs.run_mode != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          # Conservative safety thresholds, not device-specific hard requirements.
          # If they fail, investigate disk/report or select a larger runner;
          # never hide the failure by deleting required Soong provider repos.
          if [ '${{ inputs.run_mode }}' = full-rom ]; then
            required_gib=60
          else
            required_gib=15
          fi
          available_bytes=$(df -B1 --output=avail "$ANDROID_BUILD_TOP" | tail -n 1 | tr -d ' ')
          available_gib=$((available_bytes / 1024 / 1024 / 1024))
          echo "Available: ${available_gib} GiB; gate: ${required_gib} GiB" \
            | tee "$REPORT_DIR/03-capacity-gate.txt"
          if [ "$available_gib" -lt "$required_gib" ]; then
            echo "::error::Only ${available_gib} GiB free after clean sync. Need at least ${required_gib} GiB for this mode. Use a larger runner, not fake Soong stubs."
            exit 1
          fi

      - name: Install Android build prerequisites
        if: ${{ inputs.run_mode != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          # Target environment: Ubuntu 24.04 Linux. Do not reinstall on
          # self-hosted runners with their own provisioned toolchain.
          if [ '${{ inputs.runner }}' = self-hosted ]; then
            echo 'Using preinstalled build dependencies on self-hosted runner.'
            for tool in python3 gcc g++ javac zip; do
              command -v "$tool" >/dev/null || {
                echo "::error::Missing self-hosted prerequisite: $tool"
                exit 1
              }
            done
            exit 0
          fi
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential flex gperf imagemagick \
            lib32z1-dev libc6-dev-i386 libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2-utils lzop \
            pngcrush python3 python-is-python3 rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev \
            openjdk-21-jdk-headless
          java -version

      - name: Generate native Soong graph (RBE OFF)
        if: ${{ inputs.run_mode == 'graph' || inputs.run_mode == 'rbe-smoke' || inputs.run_mode == 'full-rom' }}
        shell: bash
        timeout-minutes: 75
        env:
          USE_RBE: '0'
        run: |
          set -euo pipefail
          cd "$ANDROID_BUILD_TOP"
          source build/envsetup.sh
          breakfast star2lte userdebug
          echo "TARGET_PRODUCT=$TARGET_PRODUCT" | tee "$REPORT_DIR/product-selection.txt"
          echo "TARGET_RELEASE=$TARGET_RELEASE" | tee -a "$REPORT_DIR/product-selection.txt"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT" | tee -a "$REPORT_DIR/product-selection.txt"
          test "$TARGET_PRODUCT" = lineage_star2lte
          test "$TARGET_RELEASE" = bp1a
          echo '=== CLEAN M NOTHING (NO RBE) ==='
          m nothing 2>&1 | tee "$REPORT_DIR/m-nothing.log"
          test -s out/soong/build.lineage_star2lte.ninja
          echo 'CLEAN_GRAPH_PASS=1' | tee "$REPORT_DIR/graph-result.txt"

      - name: Check BuildBuddy secret (only for remote mode)
        if: ${{ inputs.run_mode == 'rbe-smoke' || (inputs.run_mode == 'full-rom' && inputs.enable_rbe) }}
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BUILDBUDDY_API_KEY" ]; then
            echo '::error::Missing BUILDBUDDY_API_KEY secret.'
            exit 1
          fi
          echo 'BuildBuddy API key is configured (value never printed).'

      - name: BuildBuddy RBE smoke compile (after graph passes)
        if: ${{ inputs.run_mode == 'rbe-smoke' }}
        shell: bash
        timeout-minutes: 90
        env:
          USE_RBE: '1'
          RBE_remote_headers: x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd "$ANDROID_BUILD_TOP"
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/reproxy"
          source build/envsetup.sh
          breakfast star2lte userdebug
          echo '=== RBE C++ SMOKE: libbase ==='
          m -j"$BUILD_JOBS" libbase 2>&1 | tee "$REPORT_DIR/rbe-libbase.log"
          echo 'Compile finished; remote execution confirmation requires RBE metrics.'
          ls -lah "$REPORT_DIR/rbe" || true
          for f in "$REPORT_DIR/rbe"/rbe_metrics.txt; do
            if [ -s "$f" ]; then
              grep -Ei 'remote|local|cache|action' "$f" | tail -n 80 || true
            fi
          done

      - name: Build complete ROM
        if: ${{ inputs.run_mode == 'full-rom' }}
        shell: bash
        timeout-minutes: 180
        env:
          USE_RBE: ${{ inputs.enable_rbe && '1' || '0' }}
          RBE_remote_headers: x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd "$ANDROID_BUILD_TOP"
          source build/envsetup.sh
          breakfast star2lte userdebug
          if [ "$USE_RBE" = 1 ]; then
            test -x "$RBE_DIR/rewrapper"
            test -x "$RBE_DIR/reproxy"
          fi
          echo '=== FULL ROM BUILD: bacon ==='
          m -j"$BUILD_JOBS" bacon 2>&1 | tee "$REPORT_DIR/full-rom.log"
          ls -lh out/target/product/star2lte/lineage-*.zip
          sha256sum out/target/product/star2lte/lineage-*.zip \
            | tee "$REPORT_DIR/rom-sha256.txt"

      - name: Collect diagnostics even on failure
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p "$REPORT_DIR"
          {
            date -u
            df -h "$GITHUB_WORKSPACE" "$ANDROID_BUILD_TOP"
            free -h
            echo '=== top-level source sizes ==='
            for p in prebuilts external frameworks packages hardware \
              system build device vendor out .repo; do
              if [ -e "$ANDROID_BUILD_TOP/$p" ]; then
                du -sh "$ANDROID_BUILD_TOP/$p" 2>/dev/null
              fi
            done
          } > "$REPORT_DIR/99-final-diagnostics.txt" 2>&1
          if [ -d "$ANDROID_BUILD_TOP/out" ]; then
            find "$ANDROID_BUILD_TOP/out" -maxdepth 4 -type f \
              \( -name '*error*' -o -name 'soong.log' \) \
              -print > "$REPORT_DIR/soong-log-locations.txt" 2>/dev/null
          fi
          # Copy small textual Soong logs if available; skip huge intermediates.
          for f in "$ANDROID_BUILD_TOP/out/soong.log" \
                   "$ANDROID_BUILD_TOP/out/verbose.log.gz"; do
            if [ -f "$f" ]; then cp "$f" "$REPORT_DIR/"; fi
          done

      - name: Upload diagnostic artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: star2lte-v24-clean-${{ inputs.run_mode }}-${{ github.run_number }}
          path: ci-reports/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Upload ROM zip (only on successful full build)
        if: ${{ success() && inputs.run_mode == 'full-rom' }}
        uses: actions/upload-artifact@v4
        with:
          name: lineage-22.2-star2lte-${{ github.run_number }}
          path: android/out/target/product/star2lte/lineage-*.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
