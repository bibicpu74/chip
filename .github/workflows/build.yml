      - name: P9 analyze JAR intermediates, duplicate candidates and local Java cost
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/rbe-test
          cat > /tmp/rbe-test/p9-jar-analysis.py <<'P9JAR'
          #!/usr/bin/env python3
          from pathlib import Path
          from collections import defaultdict, Counter
          import os,time,hashlib,zipfile,sys,csv
          root=Path('/home/runner/work/los/out/soong/.intermediates')
          output=Path('/tmp/rbe-test'); start=time.monotonic()
          limit=int(os.getenv('P9_JAR_SCAN_TIMEOUT_SECONDS','95'))
          status='complete'; jar_files=[]; seen=0
          if not root.exists():
              (output/'p9-jar-status.txt').write_text('status=skipped\nreason=no-intermediates\n');sys.exit(0)
          def classify(path):
              path=str(path).lower()
              if 'turbine-combined' in path:return 'turbine-combined'
              if 'repackaged-jarjar' in path:return 'repackaged-jarjar'
              if 'jarjar' in path:return 'jarjar-other'
              if 'withres' in path:return 'withres'
              if '/combined/' in path or 'combined.jar' in path:return 'combined'
              if 'turbine' in path:return 'turbine-other'
              if 'classes' in path:return 'classes'
              return 'other'
          for folder,dirs,files in os.walk(root):
              if time.monotonic()-start>limit-18:
                  status='partial-time-budget';break
              dirs[:]=[d for d in dirs if d not in ('.git','.repo')]
              for name in files:
                  if not name.endswith('.jar'):continue
                  p=Path(folder)/name
                  try:sz=p.stat().st_size
                  except OSError:continue
                  seen+=1;jar_files.append((sz,p,classify(p)))
          jar_files.sort(key=lambda x:x[0],reverse=True)
          groups=defaultdict(lambda:[0,0]);by_owner=defaultdict(lambda:[0,0]);by_size=defaultdict(list)
          for sz,p,group in jar_files:
              groups[group][0]+=1;groups[group][1]+=sz
              rel=p.relative_to(root)
              # Ownership by source subtree, not guessed Java module identity.
              owner='/'.join(rel.parts[:3]);by_owner[owner][0]+=1;by_owner[owner][1]+=sz
              if sz>=128*1024:by_size[sz].append(p)
          def table(filename,rows):
              with (output/filename).open('w',newline='') as f:
                  writer=csv.writer(f,delimiter='\t');writer.writerows(rows)
          table('p9-jar-by-stage.tsv',[['stage','count','logical_bytes']]+[[k,*v] for k,v in sorted(groups.items(),key=lambda a:a[1][1],reverse=True)])
          table('p9-jar-by-subtree.tsv',[['subtree','count','logical_bytes']]+[[k,*v] for k,v in sorted(by_owner.items(),key=lambda a:a[1][1],reverse=True)[:80]])
          table('p9-largest-jars.tsv',[['size_bytes','path']]+[[sz,str(p)] for sz,p,_ in jar_files[:80]])
          # Exact duplicate sample: same-sized files ONLY, cap bytes and time.
          hashed=0;hashed_bytes=0;matches=defaultdict(list)
          for sz,paths in sorted(by_size.items(),key=lambda x:-x[0]):
              if len(paths)<2 or sz>64*1024*1024:continue
              if hashed>=300 or hashed_bytes+sz*2>384*1024*1024:break
              for p in paths:
                  if hashed>=300 or hashed_bytes+sz>384*1024*1024 or time.monotonic()-start>limit-4:break
                  try:
                      h=hashlib.sha256()
                      with p.open('rb') as f:
                          for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
                      matches[(sz,h.hexdigest())].append(p)
                      hashed+=1;hashed_bytes+=sz
                  except OSError:continue
          dupes=[(sz,sha,paths) for (sz,sha),paths in matches.items() if len(paths)>=2]
          table('p9-jar-exact-duplicates-sample.tsv', [['size_bytes','sha256','file_count','logical_duplicate_bytes','example_paths']]+[[sz,sha,len(paths),sz*(len(paths)-1),' | '.join(str(p) for p in paths[:5])] for sz,sha,paths in sorted(dupes,reverse=True)[:100]])
          # ZIP entry stored/deflated ratio, strictly bounded sample.
          zipped=[];zip_total=0
          for sz,p,_ in jar_files[:96]:
              if len(zipped)>=32 or zip_total+sz>384*1024*1024:continue
              try:
                  with zipfile.ZipFile(p) as archive:
                      entries=archive.infolist()
                      uncompressed=sum(i.file_size for i in entries)
                      compressed=sum(i.compress_size for i in entries)
                      stored=sum(i.file_size for i in entries if i.compress_type==zipfile.ZIP_STORED)
                      zipped.append((str(p),sz,uncompressed,compressed,stored,len(entries)))
                      zip_total+=sz
              except (OSError,zipfile.BadZipFile):continue
          table('p9-jar-zip-sample.tsv',[['path','jar_bytes','uncompressed_entries','compressed_entries','stored_entry_uncompressed_bytes','entry_count']]+zipped)
          text=(f'status={status}\ncount_jar={seen}\nlogical_jar_bytes={sum(x[0] for x in jar_files)}\n'
                f'sha256_sample_files={hashed}\nsha256_sample_bytes={hashed_bytes}\n'
                f'exact_duplicate_groups_in_sample={len(dupes)}\n'
                f'potential_duplicate_logical_bytes_in_sample={sum(sz*(len(paths)-1) for sz,_,paths in dupes)}\n'
                f'zip_sample_files={len(zipped)}\n'
                f'elapsed_seconds={time.monotonic()-start:.1f}\n')
          (output/'p9-jar-status.txt').write_text(text);print(text)
          P9JAR
          # A 110s cap ensures diagnostics cannot block GitHub artifact upload.
          timeout --signal=TERM --kill-after=5s 110s python3 /tmp/rbe-test/p9-jar-analysis.py \
            > /tmp/rbe-test/p9-jar-analysis.log 2>&1 || true
          if [ ! -s /tmp/rbe-test/p9-jar-status.txt ]; then
            printf 'status=timeout-or-error\n' > /tmp/rbe-test/p9-jar-status.txt
          fi
          echo '=== P9 CLANG DEBUG CONFIG ==='
          cat /tmp/rbe-test/p9-debug-soong.txt /tmp/rbe-test/p9-clang-flags-graph.txt 2>/dev/null || true
          echo '=== P9 JAVA/JAR INVENTORY ==='
          cat /tmp/rbe-test/p9-jar-status.txt
          cat /tmp/rbe-test/p9-jar-by-stage.tsv 2>/dev/null | head -20 || true
          echo '=== P9 BENCHMARK ==='
          cat /tmp/rbe-test/p9-benchmark-status.txt /tmp/rbe-test/p9-compression-benchmark.tsv 2>/dev/null || true
          echo '=== P9 RBE JAVA CONFIG ==='
          for v in RBE_JAVAC RBE_D8 RBE_R8; do
            printf '%s=%s\n' "$v" "${!v:-unset}"
          done | tee /tmp/rbe-test/p9-java-rbe-settings.txt
          {
            echo '### P9 native debug + Java/JAR diagnostics'
            echo '```text'
            cat /tmp/rbe-test/p9-debug-soong.txt /tmp/rbe-test/p9-clang-flags-graph.txt \
              /tmp/rbe-test/p9-jar-status.txt /tmp/rbe-test/p9-benchmark-status.txt 2>/dev/null
            echo '```'
            echo 'JAR report is READ-ONLY; SHA-256 duplicate bytes are logical candidates, not Btrfs physical savings.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release hybrid swap at job end (best effort)
        if: always()
        shell: bash
        run: |
          set +e
          # On a canceled/low-memory runner, swapoff can allocate several GiB
          # and trigger another OOM. Do not swapoff non-empty swap devices.
          # Runner is ephemeral; leave in-use devices until VM teardown.
          for SWAPFILE in /mnt/soong-swap-graph /mnt/soong-swap-base; do
            if [ ! -f "$SWAPFILE" ]; then continue; fi
            USED="$(swapon --bytes --noheadings --show=NAME,USED | awk -v path="$SWAPFILE" '$1==path {print $2; found=1; exit} END {if (!found) print "na"}')"
            if [ "$USED" = 0 ] && sudo swapoff "$SWAPFILE"; then
              sudo rm -f "$SWAPFILE"
              echo "Released unused swap $SWAPFILE"
            else
              echo "Retained swap $SWAPFILE used_bytes=$USED (na = unknown; not unlinking)"
            fi
          done
          if [ -s /tmp/rbe-test/zram-device.txt ]; then
            ZRAM_DEV="$(cat /tmp/rbe-test/zram-device.txt)"
            USED="$(swapon --bytes --noheadings --show=NAME,USED | awk -v path="$ZRAM_DEV" '$1==path {print $2; found=1; exit} END {if (!found) print "na"}')"
            if [ "$USED" = 0 ] && sudo swapoff "$ZRAM_DEV"; then
              sudo zramctl --reset "$ZRAM_DEV" || true
              echo "Released unused zram $ZRAM_DEV"
            else
              echo "Retained zram $ZRAM_DEV used_bytes=$USED"
            fi
          fi
          echo '=== SWAP AFTER SAFE CLEANUP ==='
          swapon --show || true
          df -h /

      - name: Stop BuildBuddy gRPC bridge and remove credentials
        if: always()
        shell: bash
        run: |
          set +e
          CFG="/tmp/buildbuddy-rbe-bridge/nginx.conf"
          if [ -f "$CFG" ]; then
            nginx -s quit -c "$CFG" >/dev/null 2>&1 || true
          fi
          rm -rf /tmp/buildbuddy-rbe-bridge
          echo "BuildBuddy bridge configuration removed."

      - name: Redact BuildBuddy API key from RBE artifacts
        if: always()
        shell: bash
        run: |
          set -e
          python3 - <<'PYREDACT'
          import os
          from pathlib import Path

          key = os.environ.get("BUILDBUDDY_API_KEY", "").encode()
          root = Path("/tmp/rbe-test")
          if key and root.is_dir():
              for file in root.rglob("*"):
                  if not file.is_file() or file.is_symlink():
                      continue
                  data = file.read_bytes()
                  if key in data:
                      # Preserve file length for binary diagnostic formats.
                      file.write_bytes(data.replace(key, b"*" * len(key)))
                      print(f"Redacted secret from: {file.relative_to(root)}")
          PYREDACT

      - name: Upload full ROM trial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbe-test-logs-${{ github.run_id }}
          path: |
            /tmp/rbe-test
            /home/runner/work/los/.repo/repo.log
          if-no-files-found: warn
          retention-days: 7

      # Always run AFTER ROM and diagnostic uploads; keep mount live for upload.
      - name: Unmount compressed workspace (best effort)
        if: ${{ always() && inputs.workspace_storage == 'btrfs_zstd' }}
        shell: bash
        run: |
          set +e
          WORKSPACE=/home/runner/work/los
          BACKING=/tmp/los20-workspace-btrfs.img
          echo '=== BTRFS FINAL PHYSICAL USAGE ==='
          df -hT / "$WORKSPACE"
          du -h "$BACKING" 2>/dev/null || true
          sync
          if mountpoint -q "$WORKSPACE"; then
            sudo umount "$WORKSPACE"
          fi
          if ! mountpoint -q "$WORKSPACE"; then
            rm -f -- "$BACKING"
            echo 'Btrfs workspace detached; backing image removed.'
          else
            echo '::warning::Btrfs mount busy; leaving image to runner teardown.'
          fi
