name: LineageOS 20.0 - star2lte P9.2 safe disk/ABI audit

on:
  workflow_dispatch:
    inputs:
      debug_info_level:
        description: "Native Clang DWARF level (g1 reduces native debug size; g keeps baseline)"
        type: choice
        required: true
        default: debug_level_g
        options:
          - debug_level_1
          - debug_level_g
          - debug_level_0
      source_abi_mode:
        description: "Source ABI checks: preserve by default; optional experiment to skip source ABI only (not NDK)"
        type: choice
        required: true
        default: preserve
        options:
          - preserve
          - skip_source
      abi_preflight:
        description: "NDK libdl ABI validation before bacon: inspect (default), or build target"
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - build_libdl
      workspace_storage:
        description: "Android workspace: Btrfs ZSTD (default), or uncompressed plain"
        type: choice
        required: true
        default: btrfs_zstd
        options:
          - btrfs_zstd
          - plain

permissions:
  contents: read

concurrency:
  group: los20-star2lte-rbe-full-rom-trial
  cancel-in-progress: false

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BUILDBUDDY_API_KEY: "${{ secrets.BUILDBUDDY_API_KEY }}"
      WORKSPACE_STORAGE: "${{ inputs.workspace_storage }}"
      CLANG_DEFAULT_DEBUG_LEVEL: "${{ inputs.debug_info_level || 'debug_level_g' }}"
      # P9.2: default is ABI-safe: no ABI bypass; the skip option is experimental.
      SKIP_ABI_CHECKS: "${{ inputs.source_abi_mode == 'skip_source' && 'true' || 'false' }}"
      P92_ABI_PREFLIGHT: "${{ inputs.abi_preflight || 'inspect' }}"
      # P9.2 is strictly audit-only for .repo, Clang, source ABI and symbols.
      P92_STORAGE_AUDIT_MODE: "audit_only"
      # Purely observational P9 diagnostics: no Java flags or JAR files are changed.
      P9_JAR_SCAN_TIMEOUT_SECONDS: "95"
      P9_BENCH_TIMEOUT_SECONDS: "210"
      BTRFS_WORKSPACE_IMAGE_GIB: "220"
      # P8: compress the complete workspace from the first repo write.
      BTRFS_ZSTD_LEVEL: "1"
      # Benchmark identical built .o files at three levels ONCE during bacon.
      P8_BENCH_ENABLED: "1"
      P8_BENCH_START_PERCENT: "30"
      P8_BENCH_MIN_FREE_GIB: "25"
      P8_BENCH_TIMEOUT_SECONDS: "210"
      # Lightweight process snapshots once Ninja is nearly complete.
      P8_FINAL_SNAPSHOT_PERCENT: "99.90"
      P8_FINAL_SNAPSHOT_FREE_GIB: "12"
      P8_FINAL_SNAPSHOT_INTERVAL_SECONDS: "180"

      # Android / Soong RBE
      USE_RBE: "1"
      RBE_DIR: "prebuilts/remoteexecution-client/live"
      # P4: remote first, then local on remote action failure.
      # Avoid global local/racing mode, preserving the existing 16 remote slots.
      RBE_CXX_EXEC_STRATEGY: "remote_local_fallback"

      # The legacy reclient used by this pipeline cannot attach RBE_remote_headers.
      # Forward plaintext h2c on loopback to a TLS-verified nginx gRPC proxy
      # which attaches BuildBuddy's x-buildbuddy-api-key header.
      RBE_service: "127.0.0.1:19099"
      RBE_service_no_security: "true"
      RBE_service_no_auth: "true"
      RBE_use_application_default_credentials: "false"
      RBE_use_rpc_credentials: "false"

      # P5.1: do not create the deprecated second execution-record stream.
      # Keep large reproxy application and execution logs inside the workspace:
      # Btrfs ZSTD compresses them in the default workflow mode.
      # Metrics remain OUTSIDE the workspace for small artifact uploads.
      RBE_log_dir: "/home/runner/work/los/.ci-rbe-logs/app"
      RBE_proxy_log_dir: "/home/runner/work/los/.ci-rbe-logs/records"
      RBE_output_dir: "/tmp/rbe-test"
      RBE_reproxy_wait_seconds: "30"
      RBE_v: "0"
      # No RBE_log_path, and no forced log_format for legacy reclient 0.57.
      # Diagnostic snapshots run infrequently so they do not slow the build.
      # P6: reduce heavy directory walks from 10 to 30 minutes.
      P5_STORAGE_SAMPLE_INTERVAL_SECONDS: "1800"
      # P6: very cheap bounded-tail Ninja throughput samples every 5 minutes.
      P6_NINJA_SAMPLE_INTERVAL_SECONDS: "300"

      # Android Soong uses remote Ninja concurrency independently of -j2.
      # Keep the 2-job local pool, highmem pool=1; try up to 16 remote actions.
      NINJA_REMOTE_NUM_JOBS: "16"
      NINJA_HIGHMEM_NUM_JOBS: "1"

      # Soong graph generation is local even with BuildBuddy RBE.
      # Go GC is tuned for the standard ~16-GB GitHub runner.
      # P0: lower Go GC target; limit only activates with Go >= 1.19.
      SOONG_GOGC: "45"
      SOONG_GOMEMLIMIT: "6GiB"
      # Limit active Go workers during the memory-heavy graph generation only.
      SOONG_GRAPH_GOMAXPROCS: "2"
      # Hybrid graph memory: compressed RAM swap first, disk swap second.
      # ZRAM is best-effort: GitHub runner kernels may not provide the module.
      SOONG_ZRAM_GIB: "8"
      SOONG_DISK_SWAP_GIB: "12"
      POST_GRAPH_DISK_SWAP_GIB: "4"
      # Keep 12 GiB free after graph swap allocation where possible.
      SOONG_SWAP_DISK_RESERVE_GIB: "12"

      # P1 storage trim: worktree-only, measured with df before/after.
      # Preserve Linux toolchains and Android 13 (API 33) reference ABI dumps.
      STORAGE_TRIM_DARWIN_HOST_TOOLS: "1"
      # Experimental: keep VNDK ABI versions 32, 33 and R; remove 29..31 only.
      # Set to "0" to retain all VNDK reference dumps for stricter validation.
      STORAGE_TRIM_OLD_VNDK_ABI: "1"

      # GiB of available disk space (statvfs/df -B1, not rounded df -h).
      # Experimental 7-GiB floor requested for a deeper build trial.
      # Never let the free space reach zero; packaging may still need more.
      DISK_WARN_GIB: "15"
      DISK_STOP_GIB: "0"
      # Stop the long build early enough to upload logs and a successful ROM.
      # Whole-job limit on GitHub-hosted runners: 360 minutes.
      # P6: reserve 15 minutes under the 360-minute job cap for artifacts.
      # Starts at initial disk reclaim (before repo sync / graph).
      FULL_ROM_SOFT_DEADLINE_MINUTES: "360"

      # P7: conservative early cleanup, measured physically on the host.
      P7_UNUSED_RUNTIME_CLEANUP: "1"
      # Best-effort hole punching through Btrfs -> loop -> host backing file.
      P7_BTRFS_FSTRIM: "1"
      # Swapoff of the populated 4-GiB baseline swap is NEVER unconditional.
      P7_BASE_SWAP_RECLAIM: "1"
      P7_LATE_SWAP_MIN_PERCENT: "99.50"
      P7_LATE_SWAP_MIN_RAM_MARGIN_GIB: "5"

    steps:
      - name: Reclaim root disk
        shell: bash
        run: |
          set -e
          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile || true
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/local/graalvm \
            /usr/share/rust \
            /usr/share/php* || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true

          mkdir -p /home/runner/work/los /tmp/rbe-test
          # Start the total-job clock before dependency install and repo sync.
          date +%s > /tmp/rbe-test/job-start-epoch.txt

          echo "=== DISK ==="
          df -h /
          echo "=== MEMORY ==="
          free -h
          echo "=== CPU ==="
          nproc

          # Persist a clean-runner baseline before package installation/sync.
          # No tokens or secrets are written to this log.
          TS=/tmp/rbe-test/resource-samples.tsv
          printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          printf '%s\tpost-reclaim\t%s\t%s\t%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$(df -B1 --output=avail / | tail -n1 | tr -d ' ')" \
            "$(df -B1 --output=used / | tail -n1 | tr -d ' ')" \
            "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" >> "$TS"

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            btrfs-progs \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python-is-python3 \
            openjdk-21-jdk-headless \
            ninja-build \
            nginx \
            ca-certificates \
            openssl \
            unzip

          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # Optional metrics only: never abort ROM build if unavailable.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y btrfs-compsize \
            || echo "::warning::Optional compsize package unavailable."

      # P7: remove only explicitly unused host-side runtimes.  This runs
      # after checkout and apt install but BEFORE sync/mount/build; tooling
      # actually used from PATH is protected.  Do not wipe toolcache blindly.
      - name: P7 reclaim unused hosted runtimes (conservative)
        if: ${{ env.P7_UNUSED_RUNTIME_CLEANUP == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT=/tmp/rbe-test/p7-runtime-cleanup.tsv
          mkdir -p /tmp/rbe-test
          printf 'path\tstatus\tphysical_size_before_bytes\thost_free_delta_bytes\treason\n' > "$REPORT"
          before_all="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"

          # Exact candidates verified against the P6 disk inventory.  The
          # hostedtoolcache list is an allowlist, NOT a recursive wipe.
          candidates=(/opt/az)
          shopt -s nullglob
          candidates+=(/usr/local/julia[0-9]*)
          for group in Ruby PyPy Go go Java_Temurin-Hotspot_jdk Java_Zulu_jdk; do
            candidates+=("/opt/hostedtoolcache/$group")
          done
          shopt -u nullglob
          for path in "${candidates[@]}"; do
            [[ -d "$path" ]] || continue
            if [[ -L "$path" ]]; then
              printf '%s\tskipped\t0\t0\tsymlink\n' "$path" >> "$REPORT"
              continue
            fi
            case "$path" in
              /opt/az|/usr/local/julia[0-9]*|/opt/hostedtoolcache/Ruby|/opt/hostedtoolcache/PyPy|/opt/hostedtoolcache/Go|/opt/hostedtoolcache/go|/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk|/opt/hostedtoolcache/Java_Zulu_jdk) ;;
              *) echo "::warning::Refused unexpected runtime candidate: $path"; continue ;;
            esac
            # Avoid touching any runtime which provides a selected essential
            # executable. This check is independent of which PATH is first.
            protected=0
            protected_reason='not-used-by-build'
            for runtime_home in JAVA_HOME JDK_HOME ANDROID_JAVA_HOME GOROOT; do
              runtime_path="${!runtime_home:-}"
              if [[ -n "$runtime_path" && ( "$runtime_path" == "$path" || "$runtime_path" == "$path/"* ) ]]; then
                protected=1; protected_reason="active-env-$runtime_home"; break
              fi
            done
            for executable in python3 python git java javac node go ninja cmake clang curl; do
              resolved="$(command -v "$executable" 2>/dev/null || true)"
              [[ -n "$resolved" ]] || continue
              actual="$(readlink -f "$resolved" 2>/dev/null || true)"
              if [[ "$actual" == "$path/"* || "$actual" == "$path" ]]; then
                protected=1; protected_reason="active-command-$executable"; break
              fi
            done
            if (( protected )); then
              printf '%s\tskipped\t0\t0\t%s\n' "$path" "$protected_reason" >> "$REPORT"
              continue
            fi
            used="$(sudo du -sxB1 "$path" 2>/dev/null | awk '{print $1}' || true)"
            [[ "$used" =~ ^[0-9]+$ ]] || used=0
            prior="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
            # Use only the exact known path; no shell expansion in rm arguments.
            if sudo rm -rf --one-file-system -- "$path"; then
              after="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
              delta=$((after-prior))
              printf '%s\tremoved\t%s\t%s\tallowlisted-unused-runtime\n' "$path" "$used" "$delta" >> "$REPORT"
            else
              printf '%s\tfailed\t%s\t0\tremove-error\n' "$path" "$used" >> "$REPORT"
              echo "::warning::Could not remove optional runtime: $path"
            fi
          done
          after_all="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
          printf 'root_free_before_bytes=%s\nroot_free_after_bytes=%s\nroot_free_delta_bytes=%s\n' \
            "$before_all" "$after_all" "$((after_all-before_all))" \
            | tee /tmp/rbe-test/p7-runtime-cleanup-summary.txt
          cat "$REPORT"

      - name: Validate BuildBuddy secret
        shell: bash
        run: |
          set -e
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is missing."
            exit 1
          fi

      # A single filesystem for .repo, the entire Android source tree, prebuilts
      # and out/. The sparse image is a LOGICAL cap, NOT extra physical storage.
      # Root df, not inner Btrfs df, is the authoritative disk safety guard.
      - name: Mount compressed Btrfs ZSTD workspace before repo sync
        if: ${{ inputs.workspace_storage == 'btrfs_zstd' }}
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=/home/runner/work/los
          BACKING=/tmp/los20-workspace-btrfs.img
          mkdir -p /tmp/rbe-test "$WORKSPACE"
          if mountpoint -q "$WORKSPACE" || [ -n "$(ls -A "$WORKSPACE")" ]; then
            echo '::error::Android workspace must be empty before Btrfs setup.'
            exit 1
          fi
          # Never fallocate the image: physical blocks must grow on demand.
          truncate -s "${BTRFS_WORKSPACE_IMAGE_GIB}G" "$BACKING"
          sudo mkfs.btrfs -f -m single -d single "$BACKING" \
            > /tmp/rbe-test/btrfs-mkfs.log 2>&1
          # Never use compress-force on full build output: preserve CPU budget.
          sudo mount -t btrfs -o "loop,compress=zstd:${BTRFS_ZSTD_LEVEL},noatime" \
            "$BACKING" "$WORKSPACE"
          sudo chown "$(id -u):$(id -g)" "$WORKSPACE"
          test "$(stat -f -c '%T' "$WORKSPACE")" = btrfs
          echo "P8 workspace compression: Btrfs ZSTD:${BTRFS_ZSTD_LEVEL} (no compress-force)" \
            | tee /tmp/rbe-test/p8-compression-config.txt
          echo '=== ANDROID 13 FULL WORKSPACE ZSTD ==='
          findmnt -T "$WORKSPACE" -o SOURCE,FSTYPE,OPTIONS
          df -hT / "$WORKSPACE"
          du -h "$BACKING"
          printf 'timestamp\tstage\troot_free_bytes\tbtrfs_free_bytes\timage_allocated_bytes\n' \
            > /tmp/rbe-test/btrfs-storage-samples.tsv
          root_free="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          if (( root_free < DISK_STOP_GIB * 1073741824 )); then
            echo "::error::Host root disk below ${DISK_STOP_GIB} GiB after Btrfs mount."
            exit 70
          fi

      - name: Repo init and install local manifest
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e

          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false
          # Initialize filters BEFORE repo sync; LineageOS WebView uses Git LFS.
          git lfs version
          git lfs install --skip-repo

          mkdir -p /home/runner/work/los
          cd /home/runner/work/los
          if [ "$WORKSPACE_STORAGE" = btrfs_zstd ]; then
            mountpoint -q "$PWD" || { echo '::error::Btrfs mount missing before repo init.'; exit 1; }
            test "$(stat -f -c '%T' "$PWD")" = btrfs
          fi

          repo init \
            --depth=1 \
            --git-lfs \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0

          mkdir -p .repo/local_manifests

          MANIFEST_SRC="$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml"
          MANIFEST_DST=".repo/local_manifests/star2lte.xml"

          if [ ! -s "$MANIFEST_SRC" ]; then
            echo "::error::Local manifest not found or empty: $MANIFEST_SRC"
            exit 1
          fi

          cp "$MANIFEST_SRC" "$MANIFEST_DST"

          # P0: remove the oversized multi-version reclient checkout BEFORE sync.
          # -a is required because no worktree has been checked out yet.
          # The pinned toolchain is fetched separately after sync and must be
          # self-contained. Never remove other Android prebuilts here.
          echo "=== P0 RECLIENT PROJECT BEFORE TRIM ==="
          repo list -a -p > /tmp/rbe-test/manifest-projects-before-trim.txt
          if ! grep -Fxq 'prebuilts/remoteexecution-client' \
            /tmp/rbe-test/manifest-projects-before-trim.txt; then
            echo "::error::Expected remoteexecution-client project is missing from the manifest; review before trimming."
            exit 1
          fi

          cat > .repo/local_manifests/zz-storage-trim.xml <<'EOFTRIM'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
              <remove-project path="prebuilts/remoteexecution-client" optional="true" />
          </manifest>
          EOFTRIM

          repo list -a -p > /tmp/rbe-test/manifest-projects-after-trim.txt
          if grep -Fxq 'prebuilts/remoteexecution-client' \
            /tmp/rbe-test/manifest-projects-after-trim.txt; then
            echo "::error::P0 trim failed: reclient project is still in the effective manifest."
            exit 1
          fi
          repo manifest -o /tmp/rbe-test/effective-manifest-after-trim.xml
          echo 'P0 trim verified: prebuilts/remoteexecution-client will NOT be repo-synced.' \
            | tee /tmp/rbe-test/p0-storage-trim-status.txt

          echo '=== VERIFY STORAGE PROJECT REMOVALS (EFFECTIVE MANIFEST) ==='
          for removed in \
            prebuilts/clang/host/darwin-x86 \
            prebuilts/android-emulator \
            prebuilts/bazel/darwin-x86_64 \
            prebuilts/go/darwin-x86; do
            if grep -Fxq "$removed" /tmp/rbe-test/manifest-projects-after-trim.txt; then
              echo "::error::Expected removed project is still present: $removed"
              exit 1
            fi
            echo "Removed from repo sync: $removed"
          done
          for required in \
            device/samsung/star2lte \
            device/samsung/exynos9810-common \
            device/samsung_slsi/sepolicy \
            kernel/samsung/exynos9810 \
            vendor/samsung/star2lte \
            vendor/samsung/exynos9810-common \
            hardware/samsung; do
            if ! grep -Fxq "$required" /tmp/rbe-test/manifest-projects-after-trim.txt; then
              echo "::error::Missing required device/vendor project: $required"
              exit 1
            fi
          done

          echo "=== LOCAL MANIFEST ==="
          sed -n '1,260p' "$MANIFEST_DST"
          echo "=== P0 STORAGE TRIM MANIFEST ==="
          cat .repo/local_manifests/zz-storage-trim.xml

      - name: Repo sync
        working-directory: /home/runner/work/los
        timeout-minutes: 120
        shell: bash
        run: |
          set -eo pipefail

          (
            while true; do
              echo "=== RESOURCE SNAPSHOT ==="
              df -h / | tail -1
              free -h | head -2
              sleep 30
            done
          ) &
          MONPID=$!
          trap 'kill "$MONPID" 2>/dev/null || true' EXIT

          if ! repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j"$(nproc)"; then
            echo "::warning::Parallel repo sync failed; retrying with -j4."
            repo sync \
              -c \
              --no-clone-bundle \
              --no-tags \
              --prune \
              -j4
          fi

          echo "=== POST-SYNC DISK ==="
          df -h / /home/runner/work/los

      # Collect post-sync storage attribution while the tree is still clean.
      # This is diagnostic-only and does not mutate .repo, source, or out.
      # Prevent a tiny LFS pointer from reaching veridex as an invalid APK.
      # Some Android 13 trees have WebView inside a parent Git project; resolve
      # the repository root before applying the LFS include path.
      - name: Resolve and validate Chromium WebView arm64 Git LFS
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/webview-lfs-check.log
          APK=external/chromium-webview/prebuilt/arm64/webview.apk
          DIR="$(dirname "$APK")"
          {
            echo '=== GIT LFS ==='
            git lfs version
            echo '=== WEBVIEW LFS PROJECTS ==='
            repo list -a -p | grep -E '^external/chromium-webview(/|$)' || true
          } | tee "$LOG"

          # Some manifests don't contain this prebuilt at this exact path.
          # Do not invent/download an APK from another branch in that case.
          if [ ! -e "$APK" ]; then
            if repo list -a -p | grep -Fxq "$DIR"; then
              echo "::error::WebView arm64 project exists, but APK missing: $APK" | tee -a "$LOG"
              exit 1
            fi
            echo "WebView APK absent at $APK; this manifest may use another WebView source." | tee -a "$LOG"
            exit 0
          fi

          REPO_ROOT="$(git -C "$DIR" rev-parse --show-toplevel)"
          REL_APK="$(realpath --relative-to="$REPO_ROOT" "$PWD/$APK")"
          {
            echo "git_root=$REPO_ROOT"
            echo "git_relative_apk=$REL_APK"
            echo "original_size_bytes=$(stat -c %s "$APK")"
            git -C "$REPO_ROOT" lfs ls-files --long | grep -F 'webview.apk' || true
          } | tee -a "$LOG"
          if [[ "$(head -c 96 "$APK")" == 'version https://git-lfs.github.com/spec/v1'* ]]; then
            echo 'Detected Git LFS pointer; fetching the exact checkout revision.' | tee -a "$LOG"
            git -C "$REPO_ROOT" lfs pull --include="$REL_APK" --exclude='' \
              2>&1 | tee /tmp/rbe-test/webview-lfs-pull.log
            git -C "$REPO_ROOT" lfs checkout "$REL_APK" \
              2>&1 | tee -a /tmp/rbe-test/webview-lfs-pull.log
          fi
          python3 - "$APK" <<'PYWEBVIEW'
          import pathlib,sys,zipfile
          file=pathlib.Path(sys.argv[1])
          with file.open('rb') as f: prefix=f.read(256)
          if prefix.startswith(b'version https://git-lfs.github.com/spec/v1'):
              sys.exit('ERROR: WebView APK is still an LFS pointer')
          if file.stat().st_size < 10 * 1024 * 1024 or prefix[:2] != b'PK':
              sys.exit('ERROR: WebView prebuilt is too small or not an APK/ZIP')
          with zipfile.ZipFile(file) as apk:
              if 'AndroidManifest.xml' not in apk.namelist():
                  sys.exit('ERROR: WebView APK missing AndroidManifest.xml')
              print(f'WebView arm64 APK verified; bytes={file.stat().st_size}')
          PYWEBVIEW
          echo '=== WEBVIEW APK ZIP CRC CHECK ===' | tee -a "$LOG"
          unzip -tqq "$APK" | tee /tmp/rbe-test/webview-unzip-test.txt
          sha256sum "$APK" | tee /tmp/rbe-test/webview-sha256.txt
          echo 'WebView LFS preflight passed.' | tee -a "$LOG"

      - name: Record Btrfs workspace use after repo sync
        if: ${{ inputs.workspace_storage == 'btrfs_zstd' }}
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          BACKING=/tmp/los20-workspace-btrfs.img
          mountpoint -q "$PWD"
          test "$(stat -f -c '%T' "$PWD")" = btrfs
          echo '=== WORKSPACE AFTER SYNC ==='
          df -hT / "$PWD"
          stat -c 'image_size_bytes=%s image_allocated_blocks=%b block_bytes=%B' "$BACKING"
          sudo btrfs filesystem usage -b "$PWD" \
            > /tmp/rbe-test/btrfs-post-sync-usage.txt 2>&1 || true
          root_avail="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          inner_avail="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          if (( root_avail < DISK_STOP_GIB * 1073741824 || inner_avail < DISK_STOP_GIB * 1073741824 )); then
            echo '::error::Disk low after repo sync, before Android build.'
            exit 70
          fi

      - name: Profile storage after repo sync
        if: success()
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/disk-analysis.log
          TS=/tmp/rbe-test/resource-samples.tsv
          if [ ! -s "$TS" ]; then
            printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          fi

          sample() {
            local stage="$1" available used mem
            available="$(df -B1 --output=avail "$PWD" | tail -n 1 | tr -d ' ')"
            used="$(df -B1 --output=used "$PWD" | tail -n 1 | tr -d ' ')"
            mem="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$available" "$used" "$mem" >> "$TS"
          }
          sample post-sync

          {
            echo '=== POST-SYNC DISK ANALYSIS ==='
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo '=== MOUNT POINTS ==='
            df -hT / /mnt /home/runner/work/los
            echo '=== BLOCK DEVICES ==='
            lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS
            echo '=== INODES ==='
            df -i /home/runner/work/los
            echo '=== GIT OBJECT STORAGE ==='
            du -sh .repo 2>/dev/null || true
            echo '=== OUTPUT TREE ==='
            du -sh out 2>/dev/null || true
            echo '=== SOURCE TREE - FIRST LEVEL ==='
            du -xhd1 . 2>/dev/null | sort -h | tail -n 50 || true
            echo '=== RUNNER SYSTEM FOOTPRINT ==='
            # Avoid scanning /home/runner/work twice (large Android checkout).
            sudo du -xhd1 /opt /usr/local /var 2>/dev/null | sort -h | tail -n 35 || true
            du -sh /home/runner/.cache /home/runner/.local /home/runner/.cargo \
              2>/dev/null || true
            echo '=== MEMORY ==='
            free -h
            echo '=== AVAILABLE DISK (BYTES) ==='
            df -B1 --output=source,size,used,avail,pcent,target /home/runner/work/los
          } 2>&1 | tee "$LOG"

          # Detail the largest checked-out prebuilts and repo metadata.
          # Diagnostic-only: never delete, prune, or mutate Android sources.
          echo '=== PREBUILTS STORAGE BREAKDOWN ==='
          if [ -d prebuilts ]; then
            du -xhd1 prebuilts 2>/dev/null | sort -h \
              > /tmp/rbe-test/prebuilts-size.log || true
            du -xhd2 prebuilts 2>/dev/null | sort -h \
              > /tmp/rbe-test/prebuilts-detail.log || true
            echo '--- PREBUILTS LEVEL 1 ---'
            tail -n 60 /tmp/rbe-test/prebuilts-size.log || true
            echo '--- PREBUILTS LEVEL 2 (LARGEST 80) ---'
            tail -n 80 /tmp/rbe-test/prebuilts-detail.log || true
          else
            echo '::warning::prebuilts directory was not found.'
          fi

          echo '=== REPO METADATA STORAGE BREAKDOWN ==='
          if [ -d .repo ]; then
            du -xhd2 .repo 2>/dev/null | sort -h \
              > /tmp/rbe-test/repo-size.log || true
            echo '--- REPO METADATA (LARGEST 40) ---'
            tail -n 40 /tmp/rbe-test/repo-size.log || true
          else
            echo '::warning::.repo directory was not found.'
          fi
          # Deep-dive into the largest storage groups from previous runs.
          # Never delete source, prebuilts, .repo objects, or installed tools.
          echo '=== CLANG TOOLCHAIN VERSION BREAKDOWN ==='
          if [ -d prebuilts/clang ]; then
            du -xhd4 prebuilts/clang 2>/dev/null | sort -h \
              > /tmp/rbe-test/clang-detail.log || true
            echo '--- CLANG LARGEST 35 ---'
            tail -n 35 /tmp/rbe-test/clang-detail.log || true
            find prebuilts/clang/host -mindepth 2 -maxdepth 2 \
              -type d -name 'clang-*' -print 2>/dev/null | sort \
              > /tmp/rbe-test/clang-versions.log || true
          else
            echo '::warning::prebuilts/clang missing'
          fi

          echo '=== GRADLE PLUGIN BREAKDOWN ==='
          if [ -d prebuilts/gradle-plugin ]; then
            du -xhd4 prebuilts/gradle-plugin 2>/dev/null | sort -h \
              > /tmp/rbe-test/gradle-detail.log || true
            tail -n 25 /tmp/rbe-test/gradle-detail.log || true
          fi

          echo '=== PLATFORM GIT OBJECT BREAKDOWN ==='
          if [ -d .repo/project-objects/platform ]; then
            du -xhd4 .repo/project-objects/platform 2>/dev/null | sort -h \
              > /tmp/rbe-test/platform-objects-detail.log || true
            tail -n 35 /tmp/rbe-test/platform-objects-detail.log || true
          fi

          echo '=== MANIFEST PREBUILTS PROJECT PATHS ==='
          # A candidate inventory only: NEVER change the synced manifest.
          repo list -p 2> /tmp/rbe-test/prebuilts-projects-errors.log \
            | grep -E '^prebuilts(/|$)' \
            > /tmp/rbe-test/prebuilts-projects.log || true
          echo "Registered prebuilts projects: $(wc -l < /tmp/rbe-test/prebuilts-projects.log)"
          sed -n '1,120p' /tmp/rbe-test/prebuilts-projects.log || true
          sample post-deep-storage-profile

          echo '=== DEEP STORAGE BASELINE COMPLETE ==='

      # P1: remove only unwanted host-platform binaries and historical
      # ABI reference dumps from checked-out worktrees. This DOES NOT reclaim
      # packed objects in .repo/project-objects: they remain for this run.
      - name: P1 reclaim unused Darwin binaries and historical VNDK ABI worktrees
        if: success()
        working-directory: /home/runner/work/los
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          REPORT=/tmp/rbe-test/storage-trim-p1.log
          TABLE=/tmp/rbe-test/storage-trim-p1.tsv
          TS=/tmp/rbe-test/resource-samples.tsv
          mkdir -p /tmp/rbe-test
          printf 'path\tpre_kib\tstatus\n' > "$TABLE"
          exec > >(tee "$REPORT") 2>&1

          echo '=== P1 STORAGE TRIM (WORKTREE ONLY) ==='
          echo "Darwin trimming: ${STORAGE_TRIM_DARWIN_HOST_TOOLS}"
          echo "Historical VNDK ABI trimming: ${STORAGE_TRIM_OLD_VNDK_ABI}"
          before_bytes="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          echo "disk_available_before_bytes=$before_bytes"

          # Whitelist protects source and vendor trees from dynamic path input.
          trim_known_path() {
            local rel="$1" kib=0
            case "$rel" in
              prebuilts/rust/darwin-x86|prebuilts/clang-tools/darwin-x86|prebuilts/build-tools/darwin-x86|\
              prebuilts/jdk/jdk8/darwin-x86|prebuilts/jdk/jdk9/darwin-x86|\
              prebuilts/jdk/jdk11/darwin-x86|prebuilts/jdk/jdk17/darwin-x86|\
              prebuilts/abi-dumps/vndk/29|prebuilts/abi-dumps/vndk/30|prebuilts/abi-dumps/vndk/31)
                ;;
              *) echo "::error::Refusing non-whitelisted removal: $rel"; return 2 ;;
            esac
            if [ -L "$rel" ]; then
              echo "SKIP symlink $rel"
              printf '%s\t0\tskipped-symlink\n' "$rel" >> "$TABLE"
              return 0
            fi
            if [ ! -d "$rel" ]; then
              echo "SKIP absent $rel"
              printf '%s\t0\tabsent\n' "$rel" >> "$TABLE"
              return 0
            fi
            kib="$(du -sk -- "$rel" | awk '{print $1}')"
            echo "TRIM $rel size=$((kib / 1024)) MiB (checked-out files only)"
            rm -rf -- "$rel"
            if [ -e "$rel" ]; then
              echo "::error::Failed to remove $rel"
              return 1
            fi
            printf '%s\t%s\tremoved\n' "$rel" "$kib" >> "$TABLE"
          }

          if [ "${STORAGE_TRIM_DARWIN_HOST_TOOLS}" = 1 ]; then
            # Abort the Linux-host trim if the Rust Linux toolchain is absent.
            if [ -d prebuilts/rust/linux-x86 ] && [ -d prebuilts/clang/host/linux-x86 ]; then
              for rel in \
                prebuilts/rust/darwin-x86 \
                prebuilts/clang-tools/darwin-x86 \
                prebuilts/build-tools/darwin-x86 \
                prebuilts/jdk/jdk8/darwin-x86 \
                prebuilts/jdk/jdk9/darwin-x86 \
                prebuilts/jdk/jdk11/darwin-x86 \
                prebuilts/jdk/jdk17/darwin-x86; do
                trim_known_path "$rel"
              done
            else
              echo '::warning::Linux host toolchains not found; Darwin trim skipped for safety.'
            fi
          fi

          if [ "${STORAGE_TRIM_OLD_VNDK_ABI}" = 1 ]; then
            # Android 13 uses API/VNDK 33 reference dumps; keep 32 as
            # compatibility headroom, plus 33, R, files at repository root.
            # Do not remove the abi-dumps project or disable ABI checks.
            root=prebuilts/abi-dumps/vndk
            if [ ! -L "$root" ] && [ -s "$root/Android.bp" ] \
               && [ -d "$root/32" ] && [ -d "$root/33" ]; then
              echo 'VNDK ABI trim guard passed: versions 32 and 33 and Android.bp exist.'
              for rel in \
                prebuilts/abi-dumps/vndk/29 \
                prebuilts/abi-dumps/vndk/30 \
                prebuilts/abi-dumps/vndk/31; do
                trim_known_path "$rel"
              done
            else
              echo '::warning::VNDK ABI layout differs from Android 13 expectation; skipping ABI trim.'
            fi
          fi

          # Strict post-checks for the host toolchain and current ABI reference.
          test -d prebuilts/rust/linux-x86
          test -d prebuilts/clang/host/linux-x86
          test -d prebuilts/abi-dumps/vndk/33
          test -d prebuilts/abi-dumps/vndk/32
          after_bytes="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          reclaimed_bytes="$((after_bytes - before_bytes))"
          echo '=== P1 STORAGE RESULT ==='
          echo "disk_available_after_bytes=$after_bytes"
          echo "disk_available_delta_bytes=$reclaimed_bytes"
          df -h "$PWD"
          cat "$TABLE"
          if (( reclaimed_bytes < 0 )); then
            echo '::warning::Net free space decreased during trim; check concurrent processes.'
          fi
          if [ -s "$TS" ]; then
            printf '%s\tpost-worktree-trim\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$after_bytes" \
              "$(df -B1 --output=used "$PWD" | tail -n1 | tr -d ' ')" \
              "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" >> "$TS"
          fi
          echo 'P1 trim changes the checkout only, not .repo Git object packs.'

      # P9.2: inspect git dependencies and size candidates, NEVER delete any.
      - name: P9.2 audit repo metadata ABI references Clang and symbols (read-only)
        if: success()
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          cat > /tmp/rbe-test/p92-storage-audit.sh <<'P92AUDIT'
          #!/usr/bin/env bash
          set -uo pipefail
          TOP=/home/runner/work/los
          cd "$TOP" || exit 1
          OUT=/tmp/rbe-test
          SIZES="$OUT/p92-storage-candidates.tsv"
          GIT="$OUT/p92-repo-git-dependencies.tsv"
          CLANG="$OUT/p92-clang-inventory.tsv"
          STATUS="$OUT/p92-audit-summary.txt"
          printf 'candidate\tlogical_bytes_by_du\tstatus\n' > "$SIZES"
          printf 'project\tgit_dir\thead_object_status\tlinked_into_repo\n' > "$GIT"
          printf 'clang_directory\tlogical_bytes_by_du\tstatus\tprotected_reason\n' > "$CLANG"
          printf 'mode=audit_only\nrepo_deleted=no\nabi_dump_deleted=no\nclang_deleted=no\nsymbols_deleted=no\n' > "$STATUS"
          timeout_du() {
            local name="$1" path="$2" secs="${3:-10}" got rc
            if [ ! -e "$path" ]; then
              printf '%s\t0\tabsent\n' "$name" >> "$SIZES"
              return 0
            fi
            got="$(timeout -k 2s "${secs}s" du -sxB1 -- "$path" 2>/dev/null)"
            rc=$?
            if [[ "$rc" == 0 && "$got" =~ ^[0-9]+ ]]; then
              printf '%s\t%s\tmeasured-du-not-host-physical\n' "$name" "${got%%[[:space:]]*}" >> "$SIZES"
            else
              printf '%s\tunknown\ttimeout-or-error-%s\n' "$name" "$rc" >> "$SIZES"
            fi
          }
          before="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          echo "root_free_before_bytes=$before" >> "$STATUS"
          for path in .repo/project-objects .repo/projects .repo/manifests .repo/local_manifests prebuilts/abi-dumps prebuilts/clang/host/linux-x86 out/target/product/star2lte/symbols; do
            timeout_du "$path" "$path" 13
          done
          # Sample representative .git indirections and Git object availability.
          # Git cat-file is read-only; if it fails, NEVER delete the object store.
          for project in build/soong frameworks/base external/libvpx device/samsung/star2lte prebuilts/clang/host/linux-x86; do
            if [ ! -d "$project" ]; then
              printf '%s\tabsent\tproject-absent\tunknown\n' "$project" >> "$GIT"
              continue
            fi
            dir="$(timeout 8s git -C "$project" rev-parse --absolute-git-dir 2>/dev/null)"; rc=$?
            [ "$rc" -eq 0 ] || dir='unavailable'
            if timeout 8s git -C "$project" cat-file -e 'HEAD^{commit}' 2>/dev/null; then
              head_status=ok
            else
              head_status=failed
            fi
            case "$dir" in
              "$TOP"/.repo/*) linked=yes;;
              *) linked=unknown;;
            esac
            printf '%s\t%s\t%s\t%s\n' "$project" "$dir" "$head_status" "$linked" >> "$GIT"
          done
          if [ -d prebuilts/clang/host/linux-x86 ]; then
            while IFS= read -r -d '' tool; do
              base="${tool##*/}"
              value="$(timeout -k 2s 8s du -sxB1 -- "$tool" 2>/dev/null)"; rc=$?
              if [ "$rc" -eq 0 ]; then bytes="${value%%[[:space:]]*}"; stat=measured; else bytes=unknown; stat=timeout; fi
              case "$base" in
                clang-3289846) reason=RenderScript-legacy-must-keep;;
                clang-r450784d*) reason=Android13-main-compiler-must-keep;;
                clang-stable|llvm-binutils-stable) reason=potential-host-tools-must-keep;;
                *) reason=unverified-do-not-delete;;
              esac
              printf '%s\t%s\t%s\t%s\n' "$tool" "$bytes" "$stat" "$reason" >> "$CLANG"
            done < <(find prebuilts/clang/host/linux-x86 -mindepth 1 -maxdepth 1 -type d -name 'clang-*' -print0)
          fi
          {
            echo '=== ABI SOURCE REFERENCES (not deletion authorization) ==='
            timeout 10s grep -R -n -m 2 -E 'SKIP_ABI_CHECKS|abi-dumps/ndk' build/soong/cc --include='*.go' 2>/dev/null | head -30 || true
            echo '=== CONFIGURED ABI ENV ==='
            echo "SKIP_ABI_CHECKS=${SKIP_ABI_CHECKS:-false}"
            echo '=== CLANG DIRECT REFERENCES (bounded source check) ==='
            timeout 12s grep -R -n -m 1 -E 'clang-3289846|clang-r450784d|clang-stable' build/soong/cc/config device/samsung/star2lte device/samsung/exynos9810-common --include='*.mk' --include='*.go' --include='*.sh' 2>/dev/null | head -35 || true
          } > "$OUT/p92-build-reference-hints.txt"
          after="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          echo "root_free_after_bytes=$after" >> "$STATUS"
          if [ -f /tmp/los20-workspace-btrfs.img ]; then
            stat -c 'backing_allocated_blocks=%b backing_block_bytes=%B' /tmp/los20-workspace-btrfs.img >> "$STATUS"
          fi
          echo 'No worktrees or Git metadata removed. All sizes are observational.' >> "$STATUS"
          cat "$STATUS"
          cat "$GIT"
          cat "$CLANG"
          P92AUDIT
          chmod 0755 /tmp/rbe-test/p92-storage-audit.sh
          # The audit never causes a build failure; keep logs for diagnostics.
          timeout --signal=TERM --kill-after=3s 150s \
            /tmp/rbe-test/p92-storage-audit.sh \
            > /tmp/rbe-test/p92-audit-run.log 2>&1 || true
          tail -n 80 /tmp/rbe-test/p92-audit-run.log 2>/dev/null || true

      # P9: Old Android 13 Soong may hardcode "-g" in commonGlobalCflags.
      # Newer Soong branches honor CLANG_DEFAULT_DEBUG_LEVEL directly.
      # Modify only that ONE Go string literal when required; no global -g0.
      - name: P9 configure and verify native Clang debug level in Soong source
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          python3 - <<'PYDEBUG'
          from pathlib import Path
          import os, re, hashlib
          requested=os.environ['CLANG_DEFAULT_DEBUG_LEVEL']
          flags={'debug_level_1':'-g1','debug_level_g':'-g','debug_level_0':'-g0'}
          if requested not in flags:
              raise SystemExit(f'unsupported debug level: {requested}')
          path=Path('build/soong/cc/config/global.go')
          data=path.read_text()
          intended=flags[requested]
          if re.search(r'Getenv\s*\(\s*[\"\']CLANG_DEFAULT_DEBUG_LEVEL[\"\']', data):
              mode='native-soong-env-support'
          else:
              # The selected cc config list is the only scope to edit.
              m=re.search(r'\bcommonGlobalCflags\s*=\s*\[\]string\s*\{', data)
              if m is None:
                  raise SystemExit('Cannot identify commonGlobalCflags slice; refusing an unsafe patch')
              tail=data[m.end():]
              closing=re.search(r'^\s*\}',tail,re.M)
              if closing is None: raise SystemExit('Malformed commonGlobalCflags slice')
              body=tail[:closing.start()]
              matches=list(re.finditer(r'(?m)^([ \t]*)"-g"\s*,(\s*(?://[^\n]*)?)$',body))
              if len(matches)!=1:
                  raise SystemExit(f'Expected one global -g literal, found {len(matches)}; refusing patch')
              if requested!='debug_level_g':
                  a,b=matches[0].span()
                  body=body[:a]+matches[0].group(0).replace('"-g"',f'"{intended}"',1)+body[b:]
                  data=data[:m.end()]+body+tail[closing.start():]
                  path.write_text(data)
                  mode='patched-commonGlobalCflags'
              else:
                  mode='baseline-hardcoded-g'
          # Record only source hash and configuration, no credential values.
          report=Path('/tmp/rbe-test/p9-debug-soong.txt')
          report.write_text(f'requested={requested}\nexpected_flag={intended}\nmode={mode}\n'
                            f'source_sha256={hashlib.sha256(path.read_bytes()).hexdigest()}\n')
          print(report.read_text())
          PYDEBUG

      - name: Verify star2lte product registration
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -eo pipefail

          echo "=== PRODUCT REGISTRATION ==="

          MATCHES="$(
            grep -R -l \
              --include='AndroidProducts.mk' \
              'lineage_star2lte' \
              device vendor 2>/dev/null | head -20 || true
          )"

          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find lineage_star2lte in any AndroidProducts.mk."
            echo "The local manifest did not sync/register the star2lte product correctly."
            find device vendor -maxdepth 4 -name AndroidProducts.mk -print 2>/dev/null | head -100 || true
            exit 1
          fi

          printf '%s\n' "$MATCHES"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "--- $file"
            sed -n '1,180p' "$file"
          done <<< "$MATCHES"

      # Reclient 0.25 (2021) predates the Remote Execution API fix for
      # working-directory-relative output paths (SDK fix Nov 2021).
      # Pin a coherent prebuilt release rather than mixing rewrapper/reproxy.
      # Ubuntu 24.04 ships ncurses6; legacy RenderScript Clang needs ncurses5.
      # Use the matching Jammy security packages, pinned with checksums from
      # packages.ubuntu.com, instead of making unsafe SONAME symlinks.
      - name: Install and verify legacy ncurses5 for RenderScript
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/legacy-ncurses5-check.log
          exec > >(tee "$LOG") 2>&1

          VERSION=6.3-2ubuntu0.3
          BASE=https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses
          PKG_DIR="$RUNNER_TEMP/ncurses5-jammy"
          mkdir -p "$PKG_DIR"
          # SHA256 hashes published by Ubuntu for the amd64 .deb files.
          NCURSES_SHA=58da01991712c6856af0658dc5e9cb533c1a6854ab950055ade185e35bc9c276
          TINFO_SHA=4df4288404108f1a156d014e8764a064e977e34e6d44931ab60451694c03c90d

          for pkg in libtinfo5 libncurses5; do
            file="${pkg}_${VERSION}_amd64.deb"
            curl --fail --location --show-error --silent \
              --retry 3 --connect-timeout 15 --max-time 90 \
              "$BASE/$file" -o "$PKG_DIR/$file"
            test "$(dpkg-deb -f "$PKG_DIR/$file" Package)" = "$pkg"
            test "$(dpkg-deb -f "$PKG_DIR/$file" Version)" = "$VERSION"
            test "$(dpkg-deb -f "$PKG_DIR/$file" Architecture)" = amd64
          done
          printf '%s  %s\n' \
            "$TINFO_SHA" "$PKG_DIR/libtinfo5_${VERSION}_amd64.deb" \
            "$NCURSES_SHA" "$PKG_DIR/libncurses5_${VERSION}_amd64.deb" \
            | sha256sum --check --status
          echo '=== SHA256 checks passed (Ubuntu Jammy security) ==='

          sudo dpkg -i \
            "$PKG_DIR/libtinfo5_${VERSION}_amd64.deb" \
            "$PKG_DIR/libncurses5_${VERSION}_amd64.deb"
          sudo ldconfig
          ldconfig -p | grep -F 'libtinfo.so.5'
          ldconfig -p | grep -F 'libncurses.so.5'
          echo '=== LEGACY RENDERSCRIPT CLANG DEPENDENCIES ==='
          CLANG=prebuilts/clang/host/linux-x86/clang-3289846/bin/clang.real
          if [ ! -x "$CLANG" ]; then
            echo "::error::Expected legacy RenderScript Clang missing: $CLANG"
            exit 1
          fi
          ldd "$CLANG" | tee /tmp/rbe-test/legacy-clang-ldd.txt
          if grep -q 'not found' /tmp/rbe-test/legacy-clang-ldd.txt; then
            echo '::error::Legacy RenderScript Clang still has unresolved shared libraries.'
            exit 1
          fi
          "$CLANG" --version
          echo '=== LEGACY RENDERSCRIPT CLANG PREFLIGHT PASSED ==='

      - name: Install compatible reclient 0.57.0 (pinned AOSP)
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          PINNED_COMMIT="5148d33653fe6920633e405fd990b525f5bce912"
          PINNED_VERSION="0.57.0.4865132"
          DEST="prebuilts/remoteexecution-client/compat-${PINNED_VERSION}"
          FETCH_DIR="$RUNNER_TEMP/reclient-pinned"

          mkdir -p "$FETCH_DIR" "$DEST" /tmp/rbe-test
          git -C "$FETCH_DIR" init -q
          git -C "$FETCH_DIR" remote add origin \
            https://android.googlesource.com/platform/prebuilts/remoteexecution-client
          git -C "$FETCH_DIR" config core.sparseCheckout true
          printf '%s\n' "/${PINNED_VERSION}/" > "$FETCH_DIR/.git/info/sparse-checkout"
          echo "=== FETCH PINNED RECLIENT ==="
          git -C "$FETCH_DIR" -c protocol.version=2 fetch --depth=1 \
            --filter=blob:none origin "$PINNED_COMMIT"
          git -C "$FETCH_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$FETCH_DIR" rev-parse HEAD)" = "$PINNED_COMMIT"

          # Use one coherent pinned release, without any fallback into a
          # repo-synced "live" tree. Copying the whole pinned directory also
          # keeps dependency scanner libraries and symlinks from this release.
          test -d "$FETCH_DIR/$PINNED_VERSION"
          cp -a "$FETCH_DIR/$PINNED_VERSION/." "$DEST/"
          for bin in rewrapper reproxy bootstrap; do
            test -s "$DEST/$bin"
            test -x "$DEST/$bin" || chmod 0755 "$DEST/$bin"
          done
          # The one-time shallow/sparse clone is no longer needed during build.
          rm -rf "$FETCH_DIR"

          echo '=== P0 PINNED RECLIENT STORAGE ==='
          du -sh "$DEST" prebuilts/remoteexecution-client 2>/dev/null \
            | tee /tmp/rbe-test/p0-reclient-size.txt
          if [ -e prebuilts/remoteexecution-client/live ]; then
            echo '::error::Unexpected repo-synced reclient/live directory; P0 trim was bypassed.'
            exit 1
          fi
          printf '%s\t%s\t%s\t%s\t%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" 'post-pinned-reclient' \
            "$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')" \
            "$(df -B1 --output=used "$PWD" | tail -n1 | tr -d ' ')" \
            "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" \
            >> /tmp/rbe-test/resource-samples.tsv

          printf 'pinned_commit=%s\npinned_version=%s\n' \
            "$PINNED_COMMIT" "$PINNED_VERSION" \
            > /tmp/rbe-test/reclient-version.txt
          echo "RBE_DIR=$DEST" >> "$GITHUB_ENV"
          echo "=== RECLIENT VERSION ==="
          "$DEST/rewrapper" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          "$DEST/reproxy" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          test -x "$DEST/bootstrap"

