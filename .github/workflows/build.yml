name: LineageOS 22.2 - BuildBuddy RBE Real Compile Test

on:
  workflow_dispatch:

concurrency:
  group: los22-star2lte-rbe-real-test
  cancel-in-progress: true

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      BUILDBUDDY_API_KEY: "${{ secrets.BUILDBUDDY_API_KEY }}"
      RBE_SERVICE: "grpcs://remote.buildbuddy.io"
      RBE_DIR: "prebuilts/remoteexecution-client/live"
      RBE_CXX_EXEC_STRATEGY: "remote"
      RBE_use_application_default_credentials: "false"
      RBE_remote_headers: "x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}"
      RBE_log_dir: "/tmp/rbe-test"
      RBE_proxy_log_dir: "/tmp/rbe-test"
      RBE_output_dir: "/tmp/rbe-test"
      NINJA_REMOTE_NUM_JOBS: "1"

    steps:
      - name: Reclaim root disk
        run: |
          set -eux
          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          mkdir -p /home/runner/work/los /tmp/rbe-test
          df -h /
          free -h
          nproc

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        working-directory: /home/runner/work
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             bc bison build-essential ccache curl flex g++-multilib gcc-multilib             git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev             libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2             libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc             zip zlib1g-dev python3 python-is-python3 openjdk-21-jdk-headless             ninja-build
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validate BuildBuddy secret
        run: |
          set -e
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is missing."
            exit 1
          fi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/work/los/.ccache
          key: "ccache-los22-star2lte-rbe-${{ github.run_id }}"
          restore-keys: |
            ccache-los22-star2lte-rbe-
            ccache-los22-star2lte-
          save-always: true

      - name: repo init and local manifest
        working-directory: /home/runner/work
        run: |
          set -eux
          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false
          mkdir -p /home/runner/work/los
          cd /home/runner/work/los
          repo init --depth=1 -u https://github.com/LineageOS/android.git -b lineage-22.2
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml" ".repo/local_manifests/star2lte.xml"
          test -s ".repo/local_manifests/star2lte.xml"
          sed -n '1,220p' .repo/local_manifests/star2lte.xml

      - name: repo sync
        working-directory: /home/runner/work/los
        timeout-minutes: 120
        run: |
          set -e
          (
            while true; do
              df -h / | tail -1
              free -h | head -2
              sleep 30
            done
          ) &
          MONPID=$!
          trap 'kill "$MONPID" 2>/dev/null || true' EXIT
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j"$(nproc)" ||           repo sync -c --no-clone-bundle --no-tags --prune -j4
          df -h / /home/runner/work/los

      - name: Inspect reclient
        working-directory: /home/runner/work/los
        run: |
          set -eux
          ls -lah prebuilts/remoteexecution-client/live
          test -x prebuilts/remoteexecution-client/live/reproxy
          test -x prebuilts/remoteexecution-client/live/rewrapper
          prebuilts/remoteexecution-client/live/reproxy --help >/tmp/rbe-test/reproxy-help.txt 2>&1 || true
          prebuilts/remoteexecution-client/live/rewrapper --help >/tmp/rbe-test/rewrapper-help.txt 2>&1 || true
          sed -n '1,120p' /tmp/rbe-test/rewrapper-help.txt

      - name: BuildBuddy connectivity
        working-directory: /home/runner/work/los
        run: |
          set -eux
          getent hosts remote.buildbuddy.io
          curl -fsSIL --max-time 30 https://remote.buildbuddy.io/ | head -20
          HTTP_CODE="$(curl -sS -o /tmp/rbe-test/buildbuddy-response.txt -w '%{http_code}' --max-time 30 -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}" https://remote.buildbuddy.io/)"
          echo "Authenticated HTTPS status: ${HTTP_CODE}"
          test "${HTTP_CODE}" = "200"

      - name: Configure Lineage build environment for RBE
        working-directory: /home/runner/work/los
        run: |
          set -ex
          source build/envsetup.sh
          export USE_RBE=1
          export RBE_service="$RBE_SERVICE"
          export RBE_DIR="$RBE_DIR"
          export RBE_CXX_EXEC_STRATEGY="$RBE_CXX_EXEC_STRATEGY"
          export RBE_use_application_default_credentials="$RBE_use_application_default_credentials"
          export RBE_remote_headers="$RBE_remote_headers"
          export RBE_log_dir="$RBE_log_dir"
          export RBE_proxy_log_dir="$RBE_proxy_log_dir"
          export RBE_output_dir="$RBE_output_dir"
          export NINJA_REMOTE_NUM_JOBS="$NINJA_REMOTE_NUM_JOBS"

          breakfast star2lte userdebug
          lunch star2lte-lineage-22.2-userdebug

          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-unset}"
          echo "TARGET_RELEASE=${TARGET_RELEASE:-unset}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-unset}"
          echo "TARGET_BUILD_TYPE=${TARGET_BUILD_TYPE:-unset}"
          echo "TOP=${TOP:-unset}"

          test "${TARGET_PRODUCT}" = "star2lte"
          test "${TARGET_RELEASE}" = "lineage-22.2"
          test "${TARGET_BUILD_VARIANT}" = "userdebug"
          test -n "${TOP}"

          mkdir -p /tmp/rbe-test
          env | sort | grep -E '^(USE_RBE|RBE_|NINJA_REMOTE)' |             sed 's/x-buildbuddy-api-key=.*/x-buildbuddy-api-key=<redacted>/'             > /tmp/rbe-test/rbe-env.txt

      - name: Generate Android build graph with RBE enabled
        working-directory: /home/runner/work/los
        timeout-minutes: 45
        run: |
          set -ex
          source build/envsetup.sh
          export USE_RBE=1
          export RBE_service="$RBE_SERVICE"
          export RBE_DIR="$RBE_DIR"
          export RBE_CXX_EXEC_STRATEGY="$RBE_CXX_EXEC_STRATEGY"
          export RBE_use_application_default_credentials="$RBE_use_application_default_credentials"
          export RBE_remote_headers="$RBE_remote_headers"
          export RBE_log_dir="$RBE_log_dir"
          export RBE_proxy_log_dir="$RBE_proxy_log_dir"
          export RBE_output_dir="$RBE_output_dir"
          export NINJA_REMOTE_NUM_JOBS="$NINJA_REMOTE_NUM_JOBS"
          lunch star2lte-lineage-22.2-userdebug

          echo "TARGET_PRODUCT=${TARGET_PRODUCT}"
          echo "TARGET_RELEASE=${TARGET_RELEASE}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT}"
          echo "TOP=${TOP}"

          mkdir -p /tmp/rbe-test
          m nothing 2>&1 | tee /tmp/rbe-test/m-nothing.log

          echo "=== BUILD.NINJA SEARCH ==="
          find "$TOP/out" -type f -name build.ninja -print | tee /tmp/rbe-test/build-ninja-list.txt
          test -s /tmp/rbe-test/build-ninja-list.txt

      - name: Find a real C++ compile target
        working-directory: /home/runner/work/los
        run: |
          set -ex
          source build/envsetup.sh
          export USE_RBE=1
          export RBE_service="$RBE_SERVICE"
          export RBE_DIR="$RBE_DIR"
          export RBE_CXX_EXEC_STRATEGY="$RBE_CXX_EXEC_STRATEGY"
          export RBE_use_application_default_credentials="$RBE_use_application_default_credentials"
          export RBE_remote_headers="$RBE_remote_headers"
          export RBE_log_dir="$RBE_log_dir"
          export RBE_proxy_log_dir="$RBE_proxy_log_dir"
          export RBE_output_dir="$RBE_output_dir"
          export NINJA_REMOTE_NUM_JOBS="$NINJA_REMOTE_NUM_JOBS"
          lunch star2lte-lineage-22.2-userdebug

          BUILD_NINJA="$(find "$TOP/out" -type f -name build.ninja | head -1)"
          test -n "$BUILD_NINJA"
          echo "Using build graph: $BUILD_NINJA"

          ninja -f "$BUILD_NINJA" -t targets all > /tmp/rbe-test/ninja-targets.txt

          CXX_TARGET="$(
            awk '
              /^build / { target=$2; next }
              /command =/ && ($0 ~ /clang\+\+|clang|g\+\+|c\+\+/) {
                print target
                exit
              }
            ' "$BUILD_NINJA"
          )"

          if [ -z "${CXX_TARGET}" ]; then
            echo "::error::Could not identify a C++ compile edge in ${BUILD_NINJA}."
            grep -n -m 20 -E 'command =.*(clang\+\+|clang|g\+\+)' "$BUILD_NINJA" || true
            exit 1
          fi

          echo "Selected C++ target: ${CXX_TARGET}"
          printf '%s\n' "${CXX_TARGET}" > /tmp/rbe-test/cxx-target.txt

      - name: Execute one real C++ compile
        working-directory: /home/runner/work/los
        timeout-minutes: 30
        run: |
          set -ex
          source build/envsetup.sh
          export USE_RBE=1
          export RBE_service="$RBE_SERVICE"
          export RBE_DIR="$RBE_DIR"
          export RBE_CXX_EXEC_STRATEGY="$RBE_CXX_EXEC_STRATEGY"
          export RBE_use_application_default_credentials="$RBE_use_application_default_credentials"
          export RBE_remote_headers="$RBE_remote_headers"
          export RBE_log_dir="$RBE_log_dir"
          export RBE_proxy_log_dir="$RBE_proxy_log_dir"
          export RBE_output_dir="$RBE_output_dir"
          export NINJA_REMOTE_NUM_JOBS="$NINJA_REMOTE_NUM_JOBS"
          lunch star2lte-lineage-22.2-userdebug

          BUILD_NINJA="$(find "$TOP/out" -type f -name build.ninja | head -1)"
          test -n "$BUILD_NINJA"
          TARGET="$(cat /tmp/rbe-test/cxx-target.txt)"
          echo "Executing real C++ compile target: $TARGET"
          ninja -f "$BUILD_NINJA" -v -j1 "$TARGET" 2>&1 | tee /tmp/rbe-test/real-cxx-compile.log

      - name: RBE diagnostics
        if: always()
        working-directory: /home/runner/work/los
        run: |
          set +e
          mkdir -p /tmp/rbe-test
          echo "=== RBE ENV ==="
          cat /tmp/rbe-test/rbe-env.txt 2>/dev/null || true
          echo "=== RBE LOG DIRECTORY ==="
          find /tmp/rbe-test -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
          echo "=== REPROXY PROCESSES ==="
          ps aux | grep -E '[r]eproxy|[r]ewrapper' || true
          echo "=== DISK ==="
          df -h / /home/runner/work/los || true
          echo "=== LAST BUILD LOG LINES ==="
          tail -n 120 /tmp/rbe-test/m-nothing.log 2>/dev/null || true
          tail -n 160 /tmp/rbe-test/real-cxx-compile.log 2>/dev/null || true

      - name: Upload RBE test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbe-test-logs-${{ github.run_id }}
          path: |
            /tmp/rbe-test
            /home/runner/work/los/.repo/repo.log
          if-no-files-found: warn
          retention-days: 7
