name: LineageOS 20.0 - star2lte P7 safe disk headroom + final packaging

on:
  workflow_dispatch:
    inputs:
      workspace_storage:
        description: "Android workspace: Btrfs ZSTD (default), or uncompressed plain"
        type: choice
        required: true
        default: btrfs_zstd
        options:
          - btrfs_zstd
          - plain

permissions:
  contents: read

concurrency:
  group: los20-star2lte-rbe-full-rom-trial
  cancel-in-progress: false

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BUILDBUDDY_API_KEY: "${{ secrets.BUILDBUDDY_API_KEY }}"
      WORKSPACE_STORAGE: "${{ inputs.workspace_storage }}"
      BTRFS_WORKSPACE_IMAGE_GIB: "220"

      # Android / Soong RBE
      USE_RBE: "1"
      RBE_DIR: "prebuilts/remoteexecution-client/live"
      # P4: remote first, then local on remote action failure.
      # Avoid global local/racing mode, preserving the existing 16 remote slots.
      RBE_CXX_EXEC_STRATEGY: "remote_local_fallback"

      # The legacy reclient used by this pipeline cannot attach RBE_remote_headers.
      # Forward plaintext h2c on loopback to a TLS-verified nginx gRPC proxy
      # which attaches BuildBuddy's x-buildbuddy-api-key header.
      RBE_service: "127.0.0.1:19099"
      RBE_service_no_security: "true"
      RBE_service_no_auth: "true"
      RBE_use_application_default_credentials: "false"
      RBE_use_rpc_credentials: "false"

      # P5.1: do not create the deprecated second execution-record stream.
      # Keep large reproxy application and execution logs inside the workspace:
      # Btrfs ZSTD compresses them in the default workflow mode.
      # Metrics remain OUTSIDE the workspace for small artifact uploads.
      RBE_log_dir: "/home/runner/work/los/.ci-rbe-logs/app"
      RBE_proxy_log_dir: "/home/runner/work/los/.ci-rbe-logs/records"
      RBE_output_dir: "/tmp/rbe-test"
      RBE_reproxy_wait_seconds: "30"
      RBE_v: "0"
      # No RBE_log_path, and no forced log_format for legacy reclient 0.57.
      # Diagnostic snapshots run infrequently so they do not slow the build.
      # P6: reduce heavy directory walks from 10 to 30 minutes.
      P5_STORAGE_SAMPLE_INTERVAL_SECONDS: "1800"
      # P6: very cheap bounded-tail Ninja throughput samples every 5 minutes.
      P6_NINJA_SAMPLE_INTERVAL_SECONDS: "300"

      # Android Soong uses remote Ninja concurrency independently of -j2.
      # Keep the 2-job local pool, highmem pool=1; try up to 16 remote actions.
      NINJA_REMOTE_NUM_JOBS: "16"
      NINJA_HIGHMEM_NUM_JOBS: "1"

      # Soong graph generation is local even with BuildBuddy RBE.
      # Go GC is tuned for the standard ~16-GB GitHub runner.
      # P0: lower Go GC target; limit only activates with Go >= 1.19.
      SOONG_GOGC: "25"
      SOONG_GOMEMLIMIT: "6GiB"
      # Limit active Go workers during the memory-heavy graph generation only.
      SOONG_GRAPH_GOMAXPROCS: "2"
      # Hybrid graph memory: compressed RAM swap first, disk swap second.
      # ZRAM is best-effort: GitHub runner kernels may not provide the module.
      SOONG_ZRAM_GIB: "8"
      SOONG_DISK_SWAP_GIB: "12"
      POST_GRAPH_DISK_SWAP_GIB: "4"
      # Keep 12 GiB free after graph swap allocation where possible.
      SOONG_SWAP_DISK_RESERVE_GIB: "12"

      # P1 storage trim: worktree-only, measured with df before/after.
      # Preserve Linux toolchains and Android 13 (API 33) reference ABI dumps.
      STORAGE_TRIM_DARWIN_HOST_TOOLS: "1"
      # Experimental: keep VNDK ABI versions 32, 33 and R; remove 29..31 only.
      # Set to "0" to retain all VNDK reference dumps for stricter validation.
      STORAGE_TRIM_OLD_VNDK_ABI: "1"

      # GiB of available disk space (statvfs/df -B1, not rounded df -h).
      # Experimental 7-GiB floor requested for a deeper build trial.
      # Never let the free space reach zero; packaging may still need more.
      DISK_WARN_GIB: "15"
      DISK_STOP_GIB: "7"
      # Stop the long build early enough to upload logs and a successful ROM.
      # Whole-job limit on GitHub-hosted runners: 360 minutes.
      # P6: reserve 15 minutes under the 360-minute job cap for artifacts.
      # Starts at initial disk reclaim (before repo sync / graph).
      FULL_ROM_SOFT_DEADLINE_MINUTES: "345"

      # P7: conservative early cleanup, measured physically on the host.
      P7_UNUSED_RUNTIME_CLEANUP: "1"
      # Best-effort hole punching through Btrfs -> loop -> host backing file.
      P7_BTRFS_FSTRIM: "1"
      # Swapoff of the populated 4-GiB baseline swap is NEVER unconditional.
      P7_BASE_SWAP_RECLAIM: "1"
      P7_LATE_SWAP_MIN_PERCENT: "99.50"
      P7_LATE_SWAP_MIN_RAM_MARGIN_GIB: "5"

    steps:
      - name: Reclaim root disk
        shell: bash
        run: |
          set -e
          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile || true
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true

          mkdir -p /home/runner/work/los /tmp/rbe-test
          # Start the total-job clock before dependency install and repo sync.
          date +%s > /tmp/rbe-test/job-start-epoch.txt

          echo "=== DISK ==="
          df -h /
          echo "=== MEMORY ==="
          free -h
          echo "=== CPU ==="
          nproc

          # Persist a clean-runner baseline before package installation/sync.
          # No tokens or secrets are written to this log.
          TS=/tmp/rbe-test/resource-samples.tsv
          printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          printf '%s\tpost-reclaim\t%s\t%s\t%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$(df -B1 --output=avail / | tail -n1 | tr -d ' ')" \
            "$(df -B1 --output=used / | tail -n1 | tr -d ' ')" \
            "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" >> "$TS"

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            btrfs-progs \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python-is-python3 \
            openjdk-21-jdk-headless \
            ninja-build \
            nginx \
            ca-certificates \
            openssl \
            unzip

          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # P7: remove only explicitly unused host-side runtimes.  This runs
      # after checkout and apt install but BEFORE sync/mount/build; tooling
      # actually used from PATH is protected.  Do not wipe toolcache blindly.
      - name: P7 reclaim unused hosted runtimes (conservative)
        if: ${{ env.P7_UNUSED_RUNTIME_CLEANUP == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT=/tmp/rbe-test/p7-runtime-cleanup.tsv
          mkdir -p /tmp/rbe-test
          printf 'path\tstatus\tphysical_size_before_bytes\thost_free_delta_bytes\treason\n' > "$REPORT"
          before_all="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"

          # Exact candidates verified against the P6 disk inventory.  The
          # hostedtoolcache list is an allowlist, NOT a recursive wipe.
          candidates=(/opt/az)
          shopt -s nullglob
          candidates+=(/usr/local/julia[0-9]*)
          for group in Ruby PyPy Go go Java_Temurin-Hotspot_jdk Java_Zulu_jdk; do
            candidates+=("/opt/hostedtoolcache/$group")
          done
          shopt -u nullglob
          for path in "${candidates[@]}"; do
            [[ -d "$path" ]] || continue
            if [[ -L "$path" ]]; then
              printf '%s\tskipped\t0\t0\tsymlink\n' "$path" >> "$REPORT"
              continue
            fi
            case "$path" in
              /opt/az|/usr/local/julia[0-9]*|/opt/hostedtoolcache/Ruby|/opt/hostedtoolcache/PyPy|/opt/hostedtoolcache/Go|/opt/hostedtoolcache/go|/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk|/opt/hostedtoolcache/Java_Zulu_jdk) ;;
              *) echo "::warning::Refused unexpected runtime candidate: $path"; continue ;;
            esac
            # Avoid touching any runtime which provides a selected essential
            # executable. This check is independent of which PATH is first.
            protected=0
            protected_reason='not-used-by-build'
            for runtime_home in JAVA_HOME JDK_HOME ANDROID_JAVA_HOME GOROOT; do
              runtime_path="${!runtime_home:-}"
              if [[ -n "$runtime_path" && ( "$runtime_path" == "$path" || "$runtime_path" == "$path/"* ) ]]; then
                protected=1; protected_reason="active-env-$runtime_home"; break
              fi
            done
            for executable in python3 python git java javac node go ninja cmake clang curl; do
              resolved="$(command -v "$executable" 2>/dev/null || true)"
              [[ -n "$resolved" ]] || continue
              actual="$(readlink -f "$resolved" 2>/dev/null || true)"
              if [[ "$actual" == "$path/"* || "$actual" == "$path" ]]; then
                protected=1; protected_reason="active-command-$executable"; break
              fi
            done
            if (( protected )); then
              printf '%s\tskipped\t0\t0\t%s\n' "$path" "$protected_reason" >> "$REPORT"
              continue
            fi
            used="$(sudo du -sxB1 "$path" 2>/dev/null | awk '{print $1}' || true)"
            [[ "$used" =~ ^[0-9]+$ ]] || used=0
            prior="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
            # Use only the exact known path; no shell expansion in rm arguments.
            if sudo rm -rf --one-file-system -- "$path"; then
              after="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
              delta=$((after-prior))
              printf '%s\tremoved\t%s\t%s\tallowlisted-unused-runtime\n' "$path" "$used" "$delta" >> "$REPORT"
            else
              printf '%s\tfailed\t%s\t0\tremove-error\n' "$path" "$used" >> "$REPORT"
              echo "::warning::Could not remove optional runtime: $path"
            fi
          done
          after_all="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
          printf 'root_free_before_bytes=%s\nroot_free_after_bytes=%s\nroot_free_delta_bytes=%s\n' \
            "$before_all" "$after_all" "$((after_all-before_all))" \
            | tee /tmp/rbe-test/p7-runtime-cleanup-summary.txt
          cat "$REPORT"

      - name: Validate BuildBuddy secret
        shell: bash
        run: |
          set -e
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is missing."
            exit 1
          fi

      # A single filesystem for .repo, the entire Android source tree, prebuilts
      # and out/. The sparse image is a LOGICAL cap, NOT extra physical storage.
      # Root df, not inner Btrfs df, is the authoritative disk safety guard.
      - name: Mount compressed Btrfs ZSTD workspace before repo sync
        if: ${{ inputs.workspace_storage == 'btrfs_zstd' }}
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=/home/runner/work/los
          BACKING=/tmp/los20-workspace-btrfs.img
          mkdir -p /tmp/rbe-test "$WORKSPACE"
          if mountpoint -q "$WORKSPACE" || [ -n "$(ls -A "$WORKSPACE")" ]; then
            echo '::error::Android workspace must be empty before Btrfs setup.'
            exit 1
          fi
          # Never fallocate the image: physical blocks must grow on demand.
          truncate -s "${BTRFS_WORKSPACE_IMAGE_GIB}G" "$BACKING"
          sudo mkfs.btrfs -f -m single -d single "$BACKING" \
            > /tmp/rbe-test/btrfs-mkfs.log 2>&1
          sudo mount -t btrfs -o loop,compress=zstd:1,noatime \
            "$BACKING" "$WORKSPACE"
          sudo chown "$(id -u):$(id -g)" "$WORKSPACE"
          test "$(stat -f -c '%T' "$WORKSPACE")" = btrfs
          echo '=== ANDROID 13 FULL WORKSPACE ZSTD ==='
          findmnt -T "$WORKSPACE" -o SOURCE,FSTYPE,OPTIONS
          df -hT / "$WORKSPACE"
          du -h "$BACKING"
          printf 'timestamp\tstage\troot_free_bytes\tbtrfs_free_bytes\timage_allocated_bytes\n' \
            > /tmp/rbe-test/btrfs-storage-samples.tsv
          root_free="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          if (( root_free < DISK_STOP_GIB * 1073741824 )); then
            echo "::error::Host root disk below ${DISK_STOP_GIB} GiB after Btrfs mount."
            exit 70
          fi

      - name: Repo init and install local manifest
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e

          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false
          # Initialize filters BEFORE repo sync; LineageOS WebView uses Git LFS.
          git lfs version
          git lfs install --skip-repo

          mkdir -p /home/runner/work/los
          cd /home/runner/work/los
          if [ "$WORKSPACE_STORAGE" = btrfs_zstd ]; then
            mountpoint -q "$PWD" || { echo '::error::Btrfs mount missing before repo init.'; exit 1; }
            test "$(stat -f -c '%T' "$PWD")" = btrfs
          fi

          repo init \
            --depth=1 \
            --git-lfs \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0

          mkdir -p .repo/local_manifests

          MANIFEST_SRC="$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml"
          MANIFEST_DST=".repo/local_manifests/star2lte.xml"

          if [ ! -s "$MANIFEST_SRC" ]; then
            echo "::error::Local manifest not found or empty: $MANIFEST_SRC"
            exit 1
          fi

          cp "$MANIFEST_SRC" "$MANIFEST_DST"

          # P0: remove the oversized multi-version reclient checkout BEFORE sync.
          # -a is required because no worktree has been checked out yet.
          # The pinned toolchain is fetched separately after sync and must be
          # self-contained. Never remove other Android prebuilts here.
          echo "=== P0 RECLIENT PROJECT BEFORE TRIM ==="
          repo list -a -p > /tmp/rbe-test/manifest-projects-before-trim.txt
          if ! grep -Fxq 'prebuilts/remoteexecution-client' \
            /tmp/rbe-test/manifest-projects-before-trim.txt; then
            echo "::error::Expected remoteexecution-client project is missing from the manifest; review before trimming."
            exit 1
          fi

          cat > .repo/local_manifests/zz-storage-trim.xml <<'EOFTRIM'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
              <remove-project path="prebuilts/remoteexecution-client" optional="true" />
          </manifest>
          EOFTRIM

          repo list -a -p > /tmp/rbe-test/manifest-projects-after-trim.txt
          if grep -Fxq 'prebuilts/remoteexecution-client' \
            /tmp/rbe-test/manifest-projects-after-trim.txt; then
            echo "::error::P0 trim failed: reclient project is still in the effective manifest."
            exit 1
          fi
          repo manifest -o /tmp/rbe-test/effective-manifest-after-trim.xml
          echo 'P0 trim verified: prebuilts/remoteexecution-client will NOT be repo-synced.' \
            | tee /tmp/rbe-test/p0-storage-trim-status.txt

          echo '=== VERIFY STORAGE PROJECT REMOVALS (EFFECTIVE MANIFEST) ==='
          for removed in \
            prebuilts/clang/host/darwin-x86 \
            prebuilts/android-emulator \
            prebuilts/bazel/darwin-x86_64 \
            prebuilts/go/darwin-x86; do
            if grep -Fxq "$removed" /tmp/rbe-test/manifest-projects-after-trim.txt; then
              echo "::error::Expected removed project is still present: $removed"
              exit 1
            fi
            echo "Removed from repo sync: $removed"
          done
          for required in \
            device/samsung/star2lte \
            device/samsung/exynos9810-common \
            device/samsung_slsi/sepolicy \
            kernel/samsung/exynos9810 \
            vendor/samsung/star2lte \
            vendor/samsung/exynos9810-common \
            hardware/samsung; do
            if ! grep -Fxq "$required" /tmp/rbe-test/manifest-projects-after-trim.txt; then
              echo "::error::Missing required device/vendor project: $required"
              exit 1
            fi
          done

          echo "=== LOCAL MANIFEST ==="
          sed -n '1,260p' "$MANIFEST_DST"
          echo "=== P0 STORAGE TRIM MANIFEST ==="
          cat .repo/local_manifests/zz-storage-trim.xml

      - name: Repo sync
        working-directory: /home/runner/work/los
        timeout-minutes: 120
        shell: bash
        run: |
          set -eo pipefail

          (
            while true; do
              echo "=== RESOURCE SNAPSHOT ==="
              df -h / | tail -1
              free -h | head -2
              sleep 30
            done
          ) &
          MONPID=$!
          trap 'kill "$MONPID" 2>/dev/null || true' EXIT

          if ! repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j"$(nproc)"; then
            echo "::warning::Parallel repo sync failed; retrying with -j4."
            repo sync \
              -c \
              --no-clone-bundle \
              --no-tags \
              --prune \
              -j4
          fi

          echo "=== POST-SYNC DISK ==="
          df -h / /home/runner/work/los

      # Collect post-sync storage attribution while the tree is still clean.
      # This is diagnostic-only and does not mutate .repo, source, or out.
      # Prevent a tiny LFS pointer from reaching veridex as an invalid APK.
      # Some Android 13 trees have WebView inside a parent Git project; resolve
      # the repository root before applying the LFS include path.
      - name: Resolve and validate Chromium WebView arm64 Git LFS
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/webview-lfs-check.log
          APK=external/chromium-webview/prebuilt/arm64/webview.apk
          DIR="$(dirname "$APK")"
          {
            echo '=== GIT LFS ==='
            git lfs version
            echo '=== WEBVIEW LFS PROJECTS ==='
            repo list -a -p | grep -E '^external/chromium-webview(/|$)' || true
          } | tee "$LOG"

          # Some manifests don't contain this prebuilt at this exact path.
          # Do not invent/download an APK from another branch in that case.
          if [ ! -e "$APK" ]; then
            if repo list -a -p | grep -Fxq "$DIR"; then
              echo "::error::WebView arm64 project exists, but APK missing: $APK" | tee -a "$LOG"
              exit 1
            fi
            echo "WebView APK absent at $APK; this manifest may use another WebView source." | tee -a "$LOG"
            exit 0
          fi

          REPO_ROOT="$(git -C "$DIR" rev-parse --show-toplevel)"
          REL_APK="$(realpath --relative-to="$REPO_ROOT" "$PWD/$APK")"
          {
            echo "git_root=$REPO_ROOT"
            echo "git_relative_apk=$REL_APK"
            echo "original_size_bytes=$(stat -c %s "$APK")"
            git -C "$REPO_ROOT" lfs ls-files --long | grep -F 'webview.apk' || true
          } | tee -a "$LOG"
          if [[ "$(head -c 96 "$APK")" == 'version https://git-lfs.github.com/spec/v1'* ]]; then
            echo 'Detected Git LFS pointer; fetching the exact checkout revision.' | tee -a "$LOG"
            git -C "$REPO_ROOT" lfs pull --include="$REL_APK" --exclude='' \
              2>&1 | tee /tmp/rbe-test/webview-lfs-pull.log
            git -C "$REPO_ROOT" lfs checkout "$REL_APK" \
              2>&1 | tee -a /tmp/rbe-test/webview-lfs-pull.log
          fi
          python3 - "$APK" <<'PYWEBVIEW'
          import pathlib,sys,zipfile
          file=pathlib.Path(sys.argv[1])
          with file.open('rb') as f: prefix=f.read(256)
          if prefix.startswith(b'version https://git-lfs.github.com/spec/v1'):
              sys.exit('ERROR: WebView APK is still an LFS pointer')
          if file.stat().st_size < 10 * 1024 * 1024 or prefix[:2] != b'PK':
              sys.exit('ERROR: WebView prebuilt is too small or not an APK/ZIP')
          with zipfile.ZipFile(file) as apk:
              if 'AndroidManifest.xml' not in apk.namelist():
                  sys.exit('ERROR: WebView APK missing AndroidManifest.xml')
              print(f'WebView arm64 APK verified; bytes={file.stat().st_size}')
          PYWEBVIEW
          echo '=== WEBVIEW APK ZIP CRC CHECK ===' | tee -a "$LOG"
          unzip -tqq "$APK" | tee /tmp/rbe-test/webview-unzip-test.txt
          sha256sum "$APK" | tee /tmp/rbe-test/webview-sha256.txt
          echo 'WebView LFS preflight passed.' | tee -a "$LOG"

      - name: Record Btrfs workspace use after repo sync
        if: ${{ inputs.workspace_storage == 'btrfs_zstd' }}
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          BACKING=/tmp/los20-workspace-btrfs.img
          mountpoint -q "$PWD"
          test "$(stat -f -c '%T' "$PWD")" = btrfs
          echo '=== WORKSPACE AFTER SYNC ==='
          df -hT / "$PWD"
          stat -c 'image_size_bytes=%s image_allocated_blocks=%b block_bytes=%B' "$BACKING"
          sudo btrfs filesystem usage -b "$PWD" \
            > /tmp/rbe-test/btrfs-post-sync-usage.txt 2>&1 || true
          root_avail="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          inner_avail="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          if (( root_avail < DISK_STOP_GIB * 1073741824 || inner_avail < DISK_STOP_GIB * 1073741824 )); then
            echo '::error::Disk low after repo sync, before Android build.'
            exit 70
          fi

      - name: Profile storage after repo sync
        if: success()
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/disk-analysis.log
          TS=/tmp/rbe-test/resource-samples.tsv
          if [ ! -s "$TS" ]; then
            printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          fi

          sample() {
            local stage="$1" available used mem
            available="$(df -B1 --output=avail "$PWD" | tail -n 1 | tr -d ' ')"
            used="$(df -B1 --output=used "$PWD" | tail -n 1 | tr -d ' ')"
            mem="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$available" "$used" "$mem" >> "$TS"
          }
          sample post-sync

          {
            echo '=== POST-SYNC DISK ANALYSIS ==='
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo '=== MOUNT POINTS ==='
            df -hT / /mnt /home/runner/work/los
            echo '=== BLOCK DEVICES ==='
            lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS
            echo '=== INODES ==='
            df -i /home/runner/work/los
            echo '=== GIT OBJECT STORAGE ==='
            du -sh .repo 2>/dev/null || true
            echo '=== OUTPUT TREE ==='
            du -sh out 2>/dev/null || true
            echo '=== SOURCE TREE - FIRST LEVEL ==='
            du -xhd1 . 2>/dev/null | sort -h | tail -n 50 || true
            echo '=== RUNNER SYSTEM FOOTPRINT ==='
            # Avoid scanning /home/runner/work twice (large Android checkout).
            sudo du -xhd1 /opt /usr/local /var 2>/dev/null | sort -h | tail -n 35 || true
            du -sh /home/runner/.cache /home/runner/.local /home/runner/.cargo \
              2>/dev/null || true
            echo '=== MEMORY ==='
            free -h
            echo '=== AVAILABLE DISK (BYTES) ==='
            df -B1 --output=source,size,used,avail,pcent,target /home/runner/work/los
          } 2>&1 | tee "$LOG"

          # Detail the largest checked-out prebuilts and repo metadata.
          # Diagnostic-only: never delete, prune, or mutate Android sources.
          echo '=== PREBUILTS STORAGE BREAKDOWN ==='
          if [ -d prebuilts ]; then
            du -xhd1 prebuilts 2>/dev/null | sort -h \
              > /tmp/rbe-test/prebuilts-size.log || true
            du -xhd2 prebuilts 2>/dev/null | sort -h \
              > /tmp/rbe-test/prebuilts-detail.log || true
            echo '--- PREBUILTS LEVEL 1 ---'
            tail -n 60 /tmp/rbe-test/prebuilts-size.log || true
            echo '--- PREBUILTS LEVEL 2 (LARGEST 80) ---'
            tail -n 80 /tmp/rbe-test/prebuilts-detail.log || true
          else
            echo '::warning::prebuilts directory was not found.'
          fi

          echo '=== REPO METADATA STORAGE BREAKDOWN ==='
          if [ -d .repo ]; then
            du -xhd2 .repo 2>/dev/null | sort -h \
              > /tmp/rbe-test/repo-size.log || true
            echo '--- REPO METADATA (LARGEST 40) ---'
            tail -n 40 /tmp/rbe-test/repo-size.log || true
          else
            echo '::warning::.repo directory was not found.'
          fi
          # Deep-dive into the largest storage groups from previous runs.
          # Never delete source, prebuilts, .repo objects, or installed tools.
          echo '=== CLANG TOOLCHAIN VERSION BREAKDOWN ==='
          if [ -d prebuilts/clang ]; then
            du -xhd4 prebuilts/clang 2>/dev/null | sort -h \
              > /tmp/rbe-test/clang-detail.log || true
            echo '--- CLANG LARGEST 35 ---'
            tail -n 35 /tmp/rbe-test/clang-detail.log || true
            find prebuilts/clang/host -mindepth 2 -maxdepth 2 \
              -type d -name 'clang-*' -print 2>/dev/null | sort \
              > /tmp/rbe-test/clang-versions.log || true
          else
            echo '::warning::prebuilts/clang missing'
          fi

          echo '=== GRADLE PLUGIN BREAKDOWN ==='
          if [ -d prebuilts/gradle-plugin ]; then
            du -xhd4 prebuilts/gradle-plugin 2>/dev/null | sort -h \
              > /tmp/rbe-test/gradle-detail.log || true
            tail -n 25 /tmp/rbe-test/gradle-detail.log || true
          fi

          echo '=== PLATFORM GIT OBJECT BREAKDOWN ==='
          if [ -d .repo/project-objects/platform ]; then
            du -xhd4 .repo/project-objects/platform 2>/dev/null | sort -h \
              > /tmp/rbe-test/platform-objects-detail.log || true
            tail -n 35 /tmp/rbe-test/platform-objects-detail.log || true
          fi

          echo '=== MANIFEST PREBUILTS PROJECT PATHS ==='
          # A candidate inventory only: NEVER change the synced manifest.
          repo list -p 2> /tmp/rbe-test/prebuilts-projects-errors.log \
            | grep -E '^prebuilts(/|$)' \
            > /tmp/rbe-test/prebuilts-projects.log || true
          echo "Registered prebuilts projects: $(wc -l < /tmp/rbe-test/prebuilts-projects.log)"
          sed -n '1,120p' /tmp/rbe-test/prebuilts-projects.log || true
          sample post-deep-storage-profile

          echo '=== DEEP STORAGE BASELINE COMPLETE ==='

      # P1: remove only unwanted host-platform binaries and historical
      # ABI reference dumps from checked-out worktrees. This DOES NOT reclaim
      # packed objects in .repo/project-objects: they remain for this run.
      - name: P1 reclaim unused Darwin binaries and historical VNDK ABI worktrees
        if: success()
        working-directory: /home/runner/work/los
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          REPORT=/tmp/rbe-test/storage-trim-p1.log
          TABLE=/tmp/rbe-test/storage-trim-p1.tsv
          TS=/tmp/rbe-test/resource-samples.tsv
          mkdir -p /tmp/rbe-test
          printf 'path\tpre_kib\tstatus\n' > "$TABLE"
          exec > >(tee "$REPORT") 2>&1

          echo '=== P1 STORAGE TRIM (WORKTREE ONLY) ==='
          echo "Darwin trimming: ${STORAGE_TRIM_DARWIN_HOST_TOOLS}"
          echo "Historical VNDK ABI trimming: ${STORAGE_TRIM_OLD_VNDK_ABI}"
          before_bytes="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          echo "disk_available_before_bytes=$before_bytes"

          # Whitelist protects source and vendor trees from dynamic path input.
          trim_known_path() {
            local rel="$1" kib=0
            case "$rel" in
              prebuilts/rust/darwin-x86|prebuilts/clang-tools/darwin-x86|prebuilts/build-tools/darwin-x86|\
              prebuilts/jdk/jdk8/darwin-x86|prebuilts/jdk/jdk9/darwin-x86|\
              prebuilts/jdk/jdk11/darwin-x86|prebuilts/jdk/jdk17/darwin-x86|\
              prebuilts/abi-dumps/vndk/29|prebuilts/abi-dumps/vndk/30|prebuilts/abi-dumps/vndk/31)
                ;;
              *) echo "::error::Refusing non-whitelisted removal: $rel"; return 2 ;;
            esac
            if [ -L "$rel" ]; then
              echo "SKIP symlink $rel"
              printf '%s\t0\tskipped-symlink\n' "$rel" >> "$TABLE"
              return 0
            fi
            if [ ! -d "$rel" ]; then
              echo "SKIP absent $rel"
              printf '%s\t0\tabsent\n' "$rel" >> "$TABLE"
              return 0
            fi
            kib="$(du -sk -- "$rel" | awk '{print $1}')"
            echo "TRIM $rel size=$((kib / 1024)) MiB (checked-out files only)"
            rm -rf -- "$rel"
            if [ -e "$rel" ]; then
              echo "::error::Failed to remove $rel"
              return 1
            fi
            printf '%s\t%s\tremoved\n' "$rel" "$kib" >> "$TABLE"
          }

          if [ "${STORAGE_TRIM_DARWIN_HOST_TOOLS}" = 1 ]; then
            # Abort the Linux-host trim if the Rust Linux toolchain is absent.
            if [ -d prebuilts/rust/linux-x86 ] && [ -d prebuilts/clang/host/linux-x86 ]; then
              for rel in \
                prebuilts/rust/darwin-x86 \
                prebuilts/clang-tools/darwin-x86 \
                prebuilts/build-tools/darwin-x86 \
                prebuilts/jdk/jdk8/darwin-x86 \
                prebuilts/jdk/jdk9/darwin-x86 \
                prebuilts/jdk/jdk11/darwin-x86 \
                prebuilts/jdk/jdk17/darwin-x86; do
                trim_known_path "$rel"
              done
            else
              echo '::warning::Linux host toolchains not found; Darwin trim skipped for safety.'
            fi
          fi

          if [ "${STORAGE_TRIM_OLD_VNDK_ABI}" = 1 ]; then
            # Android 13 uses API/VNDK 33 reference dumps; keep 32 as
            # compatibility headroom, plus 33, R, files at repository root.
            # Do not remove the abi-dumps project or disable ABI checks.
            root=prebuilts/abi-dumps/vndk
            if [ ! -L "$root" ] && [ -s "$root/Android.bp" ] \
               && [ -d "$root/32" ] && [ -d "$root/33" ]; then
              echo 'VNDK ABI trim guard passed: versions 32 and 33 and Android.bp exist.'
              for rel in \
                prebuilts/abi-dumps/vndk/29 \
                prebuilts/abi-dumps/vndk/30 \
                prebuilts/abi-dumps/vndk/31; do
                trim_known_path "$rel"
              done
            else
              echo '::warning::VNDK ABI layout differs from Android 13 expectation; skipping ABI trim.'
            fi
          fi

          # Strict post-checks for the host toolchain and current ABI reference.
          test -d prebuilts/rust/linux-x86
          test -d prebuilts/clang/host/linux-x86
          test -d prebuilts/abi-dumps/vndk/33
          test -d prebuilts/abi-dumps/vndk/32
          after_bytes="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          reclaimed_bytes="$((after_bytes - before_bytes))"
          echo '=== P1 STORAGE RESULT ==='
          echo "disk_available_after_bytes=$after_bytes"
          echo "disk_available_delta_bytes=$reclaimed_bytes"
          df -h "$PWD"
          cat "$TABLE"
          if (( reclaimed_bytes < 0 )); then
            echo '::warning::Net free space decreased during trim; check concurrent processes.'
          fi
          if [ -s "$TS" ]; then
            printf '%s\tpost-worktree-trim\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$after_bytes" \
              "$(df -B1 --output=used "$PWD" | tail -n1 | tr -d ' ')" \
              "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" >> "$TS"
          fi
          echo 'P1 trim changes the checkout only, not .repo Git object packs.'

      - name: Verify star2lte product registration
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -eo pipefail

          echo "=== PRODUCT REGISTRATION ==="

          MATCHES="$(
            grep -R -l \
              --include='AndroidProducts.mk' \
              'lineage_star2lte' \
              device vendor 2>/dev/null | head -20 || true
          )"

          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find lineage_star2lte in any AndroidProducts.mk."
            echo "The local manifest did not sync/register the star2lte product correctly."
            find device vendor -maxdepth 4 -name AndroidProducts.mk -print 2>/dev/null | head -100 || true
            exit 1
          fi

          printf '%s\n' "$MATCHES"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "--- $file"
            sed -n '1,180p' "$file"
          done <<< "$MATCHES"

      # Reclient 0.25 (2021) predates the Remote Execution API fix for
      # working-directory-relative output paths (SDK fix Nov 2021).
      # Pin a coherent prebuilt release rather than mixing rewrapper/reproxy.
      # Ubuntu 24.04 ships ncurses6; legacy RenderScript Clang needs ncurses5.
      # Use the matching Jammy security packages, pinned with checksums from
      # packages.ubuntu.com, instead of making unsafe SONAME symlinks.
      - name: Install and verify legacy ncurses5 for RenderScript
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/legacy-ncurses5-check.log
          exec > >(tee "$LOG") 2>&1

          VERSION=6.3-2ubuntu0.3
          BASE=https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses
          PKG_DIR="$RUNNER_TEMP/ncurses5-jammy"
          mkdir -p "$PKG_DIR"
          # SHA256 hashes published by Ubuntu for the amd64 .deb files.
          NCURSES_SHA=58da01991712c6856af0658dc5e9cb533c1a6854ab950055ade185e35bc9c276
          TINFO_SHA=4df4288404108f1a156d014e8764a064e977e34e6d44931ab60451694c03c90d

          for pkg in libtinfo5 libncurses5; do
            file="${pkg}_${VERSION}_amd64.deb"
            curl --fail --location --show-error --silent \
              --retry 3 --connect-timeout 15 --max-time 90 \
              "$BASE/$file" -o "$PKG_DIR/$file"
            test "$(dpkg-deb -f "$PKG_DIR/$file" Package)" = "$pkg"
            test "$(dpkg-deb -f "$PKG_DIR/$file" Version)" = "$VERSION"
            test "$(dpkg-deb -f "$PKG_DIR/$file" Architecture)" = amd64
          done
          printf '%s  %s\n' \
            "$TINFO_SHA" "$PKG_DIR/libtinfo5_${VERSION}_amd64.deb" \
            "$NCURSES_SHA" "$PKG_DIR/libncurses5_${VERSION}_amd64.deb" \
            | sha256sum --check --status
          echo '=== SHA256 checks passed (Ubuntu Jammy security) ==='

          sudo dpkg -i \
            "$PKG_DIR/libtinfo5_${VERSION}_amd64.deb" \
            "$PKG_DIR/libncurses5_${VERSION}_amd64.deb"
          sudo ldconfig
          ldconfig -p | grep -F 'libtinfo.so.5'
          ldconfig -p | grep -F 'libncurses.so.5'
          echo '=== LEGACY RENDERSCRIPT CLANG DEPENDENCIES ==='
          CLANG=prebuilts/clang/host/linux-x86/clang-3289846/bin/clang.real
          if [ ! -x "$CLANG" ]; then
            echo "::error::Expected legacy RenderScript Clang missing: $CLANG"
            exit 1
          fi
          ldd "$CLANG" | tee /tmp/rbe-test/legacy-clang-ldd.txt
          if grep -q 'not found' /tmp/rbe-test/legacy-clang-ldd.txt; then
            echo '::error::Legacy RenderScript Clang still has unresolved shared libraries.'
            exit 1
          fi
          "$CLANG" --version
          echo '=== LEGACY RENDERSCRIPT CLANG PREFLIGHT PASSED ==='

      - name: Install compatible reclient 0.57.0 (pinned AOSP)
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          PINNED_COMMIT="5148d33653fe6920633e405fd990b525f5bce912"
          PINNED_VERSION="0.57.0.4865132"
          DEST="prebuilts/remoteexecution-client/compat-${PINNED_VERSION}"
          FETCH_DIR="$RUNNER_TEMP/reclient-pinned"

          mkdir -p "$FETCH_DIR" "$DEST" /tmp/rbe-test
          git -C "$FETCH_DIR" init -q
          git -C "$FETCH_DIR" remote add origin \
            https://android.googlesource.com/platform/prebuilts/remoteexecution-client
          git -C "$FETCH_DIR" config core.sparseCheckout true
          printf '%s\n' "/${PINNED_VERSION}/" > "$FETCH_DIR/.git/info/sparse-checkout"
          echo "=== FETCH PINNED RECLIENT ==="
          git -C "$FETCH_DIR" -c protocol.version=2 fetch --depth=1 \
            --filter=blob:none origin "$PINNED_COMMIT"
          git -C "$FETCH_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$FETCH_DIR" rev-parse HEAD)" = "$PINNED_COMMIT"

          # Use one coherent pinned release, without any fallback into a
          # repo-synced "live" tree. Copying the whole pinned directory also
          # keeps dependency scanner libraries and symlinks from this release.
          test -d "$FETCH_DIR/$PINNED_VERSION"
          cp -a "$FETCH_DIR/$PINNED_VERSION/." "$DEST/"
          for bin in rewrapper reproxy bootstrap; do
            test -s "$DEST/$bin"
            test -x "$DEST/$bin" || chmod 0755 "$DEST/$bin"
          done
          # The one-time shallow/sparse clone is no longer needed during build.
          rm -rf "$FETCH_DIR"

          echo '=== P0 PINNED RECLIENT STORAGE ==='
          du -sh "$DEST" prebuilts/remoteexecution-client 2>/dev/null \
            | tee /tmp/rbe-test/p0-reclient-size.txt
          if [ -e prebuilts/remoteexecution-client/live ]; then
            echo '::error::Unexpected repo-synced reclient/live directory; P0 trim was bypassed.'
            exit 1
          fi
          printf '%s\t%s\t%s\t%s\t%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" 'post-pinned-reclient' \
            "$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')" \
            "$(df -B1 --output=used "$PWD" | tail -n1 | tr -d ' ')" \
            "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" \
            >> /tmp/rbe-test/resource-samples.tsv

          printf 'pinned_commit=%s\npinned_version=%s\n' \
            "$PINNED_COMMIT" "$PINNED_VERSION" \
            > /tmp/rbe-test/reclient-version.txt
          echo "RBE_DIR=$DEST" >> "$GITHUB_ENV"
          echo "=== RECLIENT VERSION ==="
          "$DEST/rewrapper" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          "$DEST/reproxy" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          test -x "$DEST/bootstrap"

      - name: Inspect Android reclient
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== RECLIENT DIRECTORY ==="
          ls -lah "$RBE_DIR"

          test -x "$RBE_DIR/reproxy"
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/bootstrap"

          echo "=== RBE DEPENDENCY SCANNER ==="
          if [ -f "$RBE_DIR/dependency_scanner_go_plugin.so" ]; then
            echo "dependency_scanner_go_plugin.so found."
          else
            echo "::warning::dependency_scanner_go_plugin.so not found in $RBE_DIR."
          fi
          if [ -x "$RBE_DIR/scandeps_server" ]; then
            echo "scandeps_server found."
          else
            echo "::notice::scandeps_server not found (may be absent in older reclient builds)."
          fi

          echo "=== REPROXY VERSION ==="
          "$RBE_DIR/reproxy" --version || true

          echo "=== REWRAPPER VERSION ==="
          "$RBE_DIR/rewrapper" --version || true

          echo "=== BOOTSTRAP VERSION ==="
          "$RBE_DIR/bootstrap" --version || true

      - name: Check BuildBuddy network connectivity
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== DNS ==="
          getent hosts remote.buildbuddy.io

          echo "=== TCP 443 ==="
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/remote.buildbuddy.io/443'

          echo "BuildBuddy TCP endpoint is reachable."

          echo "=== BUILD BUDDY TLS CHAIN DIAGNOSTIC ==="
          TLS_LOG="/tmp/rbe-test/buildbuddy-tls-check.log"
          mkdir -p /tmp/rbe-test
          if ! timeout 20 openssl s_client \
            -connect remote.buildbuddy.io:443 \
            -servername remote.buildbuddy.io \
            -verify_hostname remote.buildbuddy.io \
            -verify_return_error \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            </dev/null > "$TLS_LOG" 2>&1; then
            echo "::warning::OpenSSL certificate precheck returned an error; see artifact."
          fi
          grep -E 'Verification:|Verify return code:|verify error:|Verification error:|^subject=|^issuer=' "$TLS_LOG" | tail -30 || true

          echo "Authentication will be validated by the real reclient compile below."

      - name: Start authenticated BuildBuddy gRPC bridge
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail

          # This is needed for Android 11's old reclient which cannot attach
          # custom gRPC metadata. The only cleartext hop is loopback.
          BRIDGE_DIR="/tmp/buildbuddy-rbe-bridge"
          install -d -m 700 "$BRIDGE_DIR" /tmp/rbe-test
          umask 077

          # Never write the secret into workflow logs, a command argument,
          # or the uploaded /tmp/rbe-test artifact directory.
          python3 - <<'PYBRIDGE'
          import os
          from pathlib import Path

          secret = os.environ['BUILDBUDDY_API_KEY']
          if not secret or any(ch in secret for ch in ('\n', '\r', '\x00')):
              raise SystemExit('Invalid BuildBuddy API key format')

          # Escape an nginx double-quoted string safely.
          encoded = secret.replace('\\', '\\\\').replace('"', '\\"')
          config = '''worker_processes 1;
          pid /tmp/buildbuddy-rbe-bridge/nginx.pid;
          error_log /tmp/rbe-test/buildbuddy-grpc-errors.log warn;
          events { worker_connections 1024; }
          http {
            access_log off;
            client_max_body_size 0;
            server {
              listen 127.0.0.1:19099 http2;
              server_name localhost;
              location / {
                grpc_pass grpcs://remote.buildbuddy.io:443;
                grpc_ssl_server_name on;
                grpc_ssl_name remote.buildbuddy.io;
                grpc_ssl_verify on;
                # Android 11 bridge: allow intermediate CAs in the TLS chain.
                grpc_ssl_verify_depth 5;
                grpc_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                grpc_connect_timeout 30s;
                grpc_read_timeout 300s;
                grpc_send_timeout 300s;
                grpc_set_header x-buildbuddy-api-key "__BUILDBUDDY_KEY__";
              }
            }
          }
          '''.replace('__BUILDBUDDY_KEY__', encoded)
          Path('/tmp/buildbuddy-rbe-bridge/nginx.conf').write_text(config)
          PYBRIDGE

          nginx -t -c "$BRIDGE_DIR/nginx.conf"
          nginx -c "$BRIDGE_DIR/nginx.conf"
          for _ in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/19099) >/dev/null 2>&1; then
              echo "BuildBuddy local gRPC bridge is listening on 127.0.0.1:19099."
              exit 0
            fi
            sleep 1
          done
          echo "::error::BuildBuddy gRPC bridge failed to start."
          exit 1

      - name: Configure hybrid ZRAM and disk swap for Soong graph
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          umask 077
          ZRAM_STATUS=/tmp/rbe-test/zram-status.txt
          DISK_STATUS=/tmp/rbe-test/swap-status.txt
          ZRAM_DEVICE_FILE=/tmp/rbe-test/zram-device.txt
          BASE_SWAP=/mnt/soong-swap-base
          GRAPH_SWAP=/mnt/soong-swap-graph
          BASE_GIB="${POST_GRAPH_DISK_SWAP_GIB}"
          GIB=1073741824
          : > "$ZRAM_STATUS"
          : > "$DISK_STATUS"
          rm -f "$ZRAM_DEVICE_FILE"

          # A dedicated new device only: do not reset or alter existing swap.
          echo '=== ZRAM CAPABILITY / SETUP ==='
          if ! command -v zramctl >/dev/null 2>&1; then
            printf 'status=unavailable\nreason=zramctl-not-installed\n' > "$ZRAM_STATUS"
          else
            # It may already be built into the kernel; modprobe failure is not fatal.
            sudo modprobe zram num_devices=1 2>>/tmp/rbe-test/zram-setup-errors.log || true
            zram_dev=''
            # lz4 tends to minimize CPU overhead; use kernel default if absent.
            if zram_dev="$(sudo zramctl --find --size "${SOONG_ZRAM_GIB}G" --algorithm lz4 2>>/tmp/rbe-test/zram-setup-errors.log)"; then
              zram_algorithm=lz4
            elif zram_dev="$(sudo zramctl --find --size "${SOONG_ZRAM_GIB}G" 2>>/tmp/rbe-test/zram-setup-errors.log)"; then
              zram_algorithm=kernel-default
            else
              zram_dev=''
              zram_algorithm=unavailable
            fi
            if [ -n "$zram_dev" ] && [ -b "$zram_dev" ] \
               && sudo mkswap -f "$zram_dev" >/dev/null 2>>/tmp/rbe-test/zram-setup-errors.log \
               && sudo swapon --priority 100 "$zram_dev" 2>>/tmp/rbe-test/zram-setup-errors.log; then
              printf '%s\n' "$zram_dev" > "$ZRAM_DEVICE_FILE"
              printf 'status=enabled\ndevice=%s\nsize_gib=%s\nalgorithm=%s\npriority=100\n' \
                "$zram_dev" "$SOONG_ZRAM_GIB" "$zram_algorithm" > "$ZRAM_STATUS"
              echo "ZRAM activated: $zram_dev size=${SOONG_ZRAM_GIB}GiB algorithm=$zram_algorithm priority=100"
            else
              printf 'status=unavailable\nreason=kernel-or-activation-error\n' > "$ZRAM_STATUS"
              if [ -n "$zram_dev" ]; then
                sudo swapoff "$zram_dev" >/dev/null 2>&1 || true
                # Only reset if not registered as active swap.
                if ! swapon --noheadings --show=NAME | grep -Fxq "$zram_dev"; then
                  sudo zramctl --reset "$zram_dev" >/dev/null 2>&1 || true
                fi
              fi
              echo '::warning::ZRAM unavailable; continuing with disk swap fallback.'
            fi
          fi

          # Disk-swap layout: 4-GiB baseline + 8-GiB graph-only extension.
          # Higher priority on baseline ensures graph-only file is used last,
          # improving the chance it is empty after the Soong process exits.
          # Never allocate below the reserved free-space floor.
          echo '=== DISK SWAP SIZING ==='
          disk_free_bytes="$(df -B1 --output=avail /mnt | tail -n1 | tr -d ' ')"
          disk_free_gib=$((disk_free_bytes / GIB))
          reserve_gib="${SOONG_SWAP_DISK_RESERVE_GIB}"
          target_gib="${SOONG_DISK_SWAP_GIB}"
          if (( disk_free_bytes < (target_gib + reserve_gib) * GIB )); then
            # A smaller fallback still respects the same reserve.
            target_gib=$((disk_free_gib - reserve_gib))
            if (( target_gib > SOONG_DISK_SWAP_GIB )); then target_gib="$SOONG_DISK_SWAP_GIB"; fi
          fi
          if (( target_gib < BASE_GIB )); then
            echo "::warning::Not enough disk for even ${BASE_GIB}GiB swap with ${reserve_gib}GiB reserve."
            target_gib=0
          fi
          printf 'status=disabled\ndisk_free_before_gib=%s\nrequested_gib=%s\nallocated_gib=0\nreserve_gib=%s\n' \
            "$disk_free_gib" "$SOONG_DISK_SWAP_GIB" "$reserve_gib" > "$DISK_STATUS"
          allocate_swap() {
            local path="$1" size_gib="$2" priority="$3"
            if ! sudo fallocate -l "${size_gib}G" "$path"; then
              sudo rm -f "$path" || true
              return 1
            fi
            sudo chmod 600 "$path"
            if sudo mkswap "$path" >/dev/null && sudo swapon --priority "$priority" "$path"; then
              echo "SWAP_ON path=$path size_gib=$size_gib priority=$priority"
              return 0
            fi
            sudo swapoff "$path" >/dev/null 2>&1 || true
            sudo rm -f "$path" || true
            return 1
          }
          allocated=0
          if (( target_gib >= BASE_GIB )); then
            if allocate_swap "$BASE_SWAP" "$BASE_GIB" 20; then
              allocated="$BASE_GIB"
              graph_gib=$((target_gib - BASE_GIB))
              if (( graph_gib > 0 )); then
                if allocate_swap "$GRAPH_SWAP" "$graph_gib" 10; then
                  allocated=$((allocated + graph_gib))
                else
                  echo '::warning::Graph-only swap allocation failed, base swap still enabled.'
                fi
              fi
            else
              echo '::warning::Baseline disk swap allocation failed.'
            fi
          fi
          printf 'status=%s\ndisk_free_before_gib=%s\nrequested_gib=%s\nallocated_gib=%s\nreserve_gib=%s\nbase_gib=%s\n' \
            "$( (( allocated > 0 )) && echo enabled || echo disabled)" \
            "$disk_free_gib" "$SOONG_DISK_SWAP_GIB" "$allocated" "$reserve_gib" "$BASE_GIB" \
            > "$DISK_STATUS"
          if (( allocated < SOONG_DISK_SWAP_GIB )); then
            echo "::warning::Disk swap available ${allocated}/${SOONG_DISK_SWAP_GIB} GiB (disk-reserve safeguard)."
          fi
          echo '=== ACTIVE HYBRID SWAP ==='
          cat "$ZRAM_STATUS" "$DISK_STATUS"
          swapon --show=NAME,TYPE,SIZE,USED,PRIO || true
          zramctl || true
          free -h
          df -h /mnt /home/runner/work/los
          # Failing to activate any swap is not a successful 15-GiB trial.
          if ! swapon --noheadings --show=NAME | grep -q .; then
            echo '::error::No active swap device; aborting before the known Soong memory peak.'
            exit 1
          fi

      - name: Prepare compact reproxy logging and storage probe
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test "$RBE_log_dir" "$RBE_proxy_log_dir" "$RBE_output_dir"
          if [ "$WORKSPACE_STORAGE" = btrfs_zstd ]; then
            test "$(stat -f -c %T "$RBE_log_dir")" = btrfs
            test "$(stat -f -c %T "$RBE_proxy_log_dir")" = btrfs
          fi
          # Reclient should not create an extra deprecated text:// record stream.
          if env | grep -q '^RBE_log_path='; then
            echo '::error::Deprecated RBE_log_path must not be configured.'
            exit 1
          fi
          echo "P5 RBE app logs: $RBE_log_dir"
          echo "P5 RBE action records: $RBE_proxy_log_dir"
          echo "P5 RBE metrics: $RBE_output_dir"
          echo "P5 RBE verbose level: $RBE_v"
          # The probe is read-only and time-limited by its caller. It NEVER
          # removes or rewrites build intermediates, records or the Btrfs image.
          cat > /tmp/rbe-test/p5-storage-probe.sh <<'P5PROBE'
          #!/usr/bin/env bash
          set -uo pipefail
          stage="${1:-unknown}"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          root_free="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          inner_free="$(df -B1 --output=avail /home/runner/work/los | tail -n1 | tr -d ' ')"
          allocated=0
          backing=/tmp/los20-workspace-btrfs.img
          if [ -f "$backing" ]; then
            read -r blocks blocksize < <(stat -c '%b %B' "$backing")
            allocated=$((blocks * blocksize))
          fi
          disk_bytes() {
            local directory="$1" value
            if [ -d "$directory" ]; then
              value="$(du -sxB1 "$directory" 2>/dev/null | awk 'NR==1 {print $1}')"
              printf '%s' "${value:-NA}"
            else
              printf '0'
            fi
          }
          app_bytes="$(disk_bytes "${RBE_log_dir:-/nonexistent}")"
          records_bytes="$(disk_bytes "${RBE_proxy_log_dir:-/nonexistent}")"
          soong_bytes="$(disk_bytes /home/runner/work/los/out/soong)"
          target_bytes="$(disk_bytes /home/runner/work/los/out/target)"
          host_bytes="$(disk_bytes /home/runner/work/los/out/host)"
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$stamp" "$stage" "$root_free" "$inner_free" "$allocated" \
            "$app_bytes" "$records_bytes" "$soong_bytes" "$target_bytes" "$host_bytes" \
            >> /tmp/rbe-test/p5-storage-profile.tsv
          printf 'P5_STORAGE stage=%s host_free_gib=%s image_alloc_gib=%s rbe_app_mib=%s rbe_records_mib=%s out_soong_gib=%s out_target_gib=%s\n' \
            "$stage" "$((root_free/1073741824))" "$((allocated/1073741824))" \
            "$(( ${app_bytes//NA/0} /1048576))" "$(( ${records_bytes//NA/0} /1048576))" \
            "$(( ${soong_bytes//NA/0} /1073741824))" "$(( ${target_bytes//NA/0} /1073741824))"
          P5PROBE
          chmod +x /tmp/rbe-test/p5-storage-probe.sh
          printf 'timestamp\tphase\troot_free_bytes\tworkspace_free_bytes\timage_alloc_bytes\trbe_app_du_bytes\trbe_records_du_bytes\tout_soong_du_bytes\tout_target_du_bytes\tout_host_du_bytes\n' \
            > /tmp/rbe-test/p5-storage-profile.tsv
          timeout 30s /tmp/rbe-test/p5-storage-probe.sh before-graph || true

          # P6: parse at most the final 256 KiB of the build log, no 'grep'
          # of multi-GiB logs and no expensive output directory traversal.
          # Called by the existing 10-second supervisor every five minutes.
          cat > /tmp/rbe-test/p6-ninja-sample.py <<'P6NINJA'
          #!/usr/bin/env python3
          import datetime
          import pathlib
          import re
          import sys
          import time

          log = pathlib.Path(sys.argv[1])
          phase_started = int(sys.argv[2])
          out = pathlib.Path('/tmp/rbe-test/p6-ninja-throughput.tsv')
          now = int(time.time())
          try:
              with log.open('rb') as f:
                  f.seek(0, 2)
                  size = f.tell()
                  f.seek(max(0, size - 256 * 1024))
                  tail = f.read()
          except OSError as exc:
              print(f'P6_NINJA_SAMPLE unavailable: {exc}', flush=True)
              sys.exit(0)

          # AOSP Ninja progress: '[ 98% 144293/145862] ...'. The action
          # counter is not weighted by time; this measures throughput only.
          matches = list(re.finditer(rb'\[\s*\d{1,3}%\s+(\d+)/(\d+)\]', tail))
          if not matches:
              print('P6_NINJA_SAMPLE no progress marker in bounded log tail', flush=True)
              sys.exit(0)
          completed, total = map(int, matches[-1].groups())
          if total <= 0 or completed > total:
              print('P6_NINJA_SAMPLE invalid Ninja progress data', flush=True)
              sys.exit(0)

          prior_count, prior_epoch = 0, phase_started
          if out.is_file():
              for line in out.read_text(encoding='utf-8').splitlines()[1:]:
                  fields = line.split('\t')
                  if len(fields) >= 4:
                      try:
                          prior_epoch, prior_count = int(fields[1]), int(fields[2])
                      except ValueError:
                          continue
          if completed < prior_count:
              print('P6_NINJA_SAMPLE counter moved backward; skipping', flush=True)
              sys.exit(0)
          window_seconds = max(1, now - prior_epoch)
          delta = completed - prior_count
          rate = 60.0 * delta / window_seconds
          elapsed = max(0, now - phase_started)
          stamp = datetime.datetime.fromtimestamp(now, datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          if not out.is_file():
              out.write_text('timestamp_utc\tepoch\tcompleted\ttotal\tpercent\tdelta_actions\twindow_seconds\tactions_per_min\tbuild_elapsed_minutes\tremaining_actions\n', encoding='utf-8')
          with out.open('a', encoding='utf-8') as f:
              f.write(f'{stamp}\t{now}\t{completed}\t{total}\t{completed*100/total:.2f}\t{delta}\t{window_seconds}\t{rate:.2f}\t{elapsed/60:.1f}\t{total-completed}\n')
          print(f'P6_NINJA_SAMPLE {stamp} completed={completed}/{total} percent={completed*100/total:.2f} delta={delta} window_s={window_seconds} actions_per_min={rate:.2f} remaining={total-completed}', flush=True)
          P6NINJA
          chmod +x /tmp/rbe-test/p6-ninja-sample.py

          # P7: measure actual physical reclaim, never the reported FITRIM
          # "bytes trimmed" counter. No secrets or build output content.
          cat > /tmp/rbe-test/p7-btrfs-trim.sh <<'P7TRIM'
          #!/usr/bin/env bash
          set -u
          workspace=/home/runner/work/los
          backing=/tmp/los20-workspace-btrfs.img
          log=/tmp/rbe-test/p7-btrfs-trim.tsv
          mkdir -p /tmp/rbe-test
          exec 9>/tmp/rbe-test/p7-trim.lock
          flock -n 9 || exit 0
          stamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          label="${1:-unspecified}"
          root_before="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
          blocks_before=0; blocks_after=0; status='skipped'; rc=0
          if [[ "${P7_BTRFS_FSTRIM:-0}" != 1 || "${WORKSPACE_STORAGE:-plain}" != btrfs_zstd ]]; then
            status='disabled'
          elif [[ ! -f "$backing" ]] || ! mountpoint -q "$workspace" || \
               [[ "$(stat -f -c %T "$workspace" 2>/dev/null)" != btrfs ]]; then
            status='mount-not-ready'
          else
            read -r b sz < <(stat -c '%b %B' "$backing")
            blocks_before=$((b*sz))
            # Bounded best-effort attempt. Unsupported discard is not an error
            # for the ROM build. The loop device may not punch host holes.
            if sudo timeout --signal=TERM --kill-after=5s 45s \
                  fstrim -v "$workspace" > /tmp/rbe-test/p7-fstrim-last.txt 2>&1; then
              status='completed'
            else
              rc=$?
              status="unsupported-failed-or-timeout-$rc"
            fi
            read -r b sz < <(stat -c '%b %B' "$backing")
            blocks_after=$((b*sz))
          fi
          root_after="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
          printf '%s\t%s\t%s\t%d\t%d\t%d\t%d\n' \
            "$stamp" "$label" "$status" "$root_before" "$root_after" "$blocks_before" "$blocks_after" >> "$log"
          echo "P7_FSTRIM $label $status root_delta_bytes=$((root_after-root_before)) image_delta_bytes=$((blocks_before-blocks_after))"
          exit 0
          P7TRIM
          chmod +x /tmp/rbe-test/p7-btrfs-trim.sh
          printf 'utc\tstage\tstatus\troot_free_before\troot_free_after\timage_alloc_before\timage_alloc_after\n' \
            > /tmp/rbe-test/p7-btrfs-trim.tsv

          # P7: only release the 4-GiB BASE swap if swapping it back into RAM
          # leaves a substantial reserve. In P6 the 4 GiB was essentially
          # FULL during the final active build; in that state it MUST remain.
          cat > /tmp/rbe-test/p7-base-swap-reclaim.sh <<'P7SWAP'
          #!/usr/bin/env bash
          set -u
          swapfile=/mnt/soong-swap-base
          logfile=/tmp/rbe-test/p7-base-swap-reclaim.log
          stage="${1:-unknown}"
          exec 9>/tmp/rbe-test/p7-swap-reclaim.lock
          flock -n 9 || exit 0
          stamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          state='skipped'; reason='not-active'; used=0
          mem_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
          mem_bytes=$(( ${mem_kib:-0} * 1024 ))
          used="$(swapon --bytes --noheadings --show=NAME,USED 2>/dev/null | awk -v p="$swapfile" '$1==p {print $2; found=1; exit} END {if (!found) print "na"}')"
          before="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
          if [[ "${P7_BASE_SWAP_RECLAIM:-0}" != 1 ]]; then
            reason='disabled'
          elif [[ ! -f "$swapfile" || ! "$used" =~ ^[0-9]+$ ]]; then
            reason='swap-not-active'
          elif [[ "$stage" == early ]]; then
            # Never discard the safety net before bacon even when unused.
            reason='preserve-base-swap-during-bacon'
          elif [[ "$stage" == late && "$used" -gt $((4*1073741824)) ]]; then
            reason='invalid-used-size'
          elif (( mem_bytes < used + ${P7_LATE_SWAP_MIN_RAM_MARGIN_GIB:-5}*1073741824 )); then
            reason='ram-margin-insufficient'
          elif [[ -f /tmp/rbe-test/p7-base-swap-reclaimed.txt ]]; then
            reason='already-reclaimed'
          else
            # 60s cap; if it times out/fails, do NOT delete an active swapfile.
            if sudo timeout --signal=TERM --kill-after=10s 60s swapoff "$swapfile"; then
              rc=0
            else
              rc=$?
            fi
            if (( rc == 0 )) && ! swapon --noheadings --show=NAME | grep -Fxq "$swapfile"; then
              if sudo rm -f -- "$swapfile"; then
                state='reclaimed'; reason='swapoff-ok-file-unlinked'
                printf '%s\n' "$stamp" > /tmp/rbe-test/p7-base-swap-reclaimed.txt
              else
                state='deactivated'; reason='file-unlink-failed'
              fi
            else
              reason="swapoff-failed-or-timeout-$rc"
            fi
          fi
          after="$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
          printf '%s stage=%s status=%s reason=%s used_bytes=%s ram_available_bytes=%s host_free_before_bytes=%s host_free_after_bytes=%s host_free_delta_bytes=%s\n' \
            "$stamp" "$stage" "$state" "$reason" "$used" "$mem_bytes" "$before" "$after" "$((after-before))" >> "$logfile"
          echo "P7_SWAP $stage status=$state reason=$reason reclaimed_delta_bytes=$((after-before))"
          exit 0
          P7SWAP
          chmod +x /tmp/rbe-test/p7-base-swap-reclaim.sh

      - name: Configure Lineage and build full star2lte ROM via BuildBuddy
        working-directory: /home/runner/work/los
        # P6: step timeout is secondary to the whole-job 345-minute guard.
        # 350 minutes is the maximum step duration, not an additional budget.
        timeout-minutes: 350
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p /tmp/rbe-test

          # P0.1: capture early setup output, even when envsetup or lunch fails
          # before m-nothing.log / rbe-env.txt can be created.
          # Preserve Actions stdout/stderr to avoid duplicating long build logs.
          exec 3>&1 4>&2
          exec > >(tee -a /tmp/rbe-test/configure-setup.log) 2>&1
          CURRENT_STAGE=configure-start
          LAST_FAILURE_LINE=''
          LAST_FAILURE_COMMAND=''
          BUILD_PID=''
          mark_stage() {
            CURRENT_STAGE="$1"
            printf '[%s] STAGE: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$CURRENT_STAGE" \
              | tee -a /tmp/rbe-test/configure-stages.log
          }
          on_error() {
            LAST_FAILURE_LINE="$1"
            LAST_FAILURE_COMMAND="$2"
            # Never enable set -x: BuildBuddy credentials are in the environment.
            printf 'Failure observed at line=%s in stage=%s\n' "$LAST_FAILURE_LINE" "$CURRENT_STAGE" >&2
          }
          on_exit() {
            local rc=$?
            trap - EXIT
            # Best-effort footprint sample even when the disk guard stops ROM.
            if [ -x /tmp/rbe-test/p5-storage-probe.sh ]; then
              timeout 40s /tmp/rbe-test/p5-storage-probe.sh "exit-${CURRENT_STAGE}" \
                >> /tmp/rbe-test/p5-storage-probe.log 2>&1 || true
            fi
            # Retain the original process-tree cleanup if build is interrupted.
            if [ -n "${BUILD_PID:-}" ] && kill -0 "$BUILD_PID" 2>/dev/null; then
              if declare -F stop_process_tree >/dev/null; then
                stop_process_tree "$BUILD_PID" || true
              fi
            fi
            if [ "$rc" -ne 0 ]; then
              {
                printf 'exit_code=%s\n' "$rc"
                printf 'stage=%s\n' "$CURRENT_STAGE"
                printf 'error_line=%s\n' "${LAST_FAILURE_LINE:-unavailable}"
                printf 'error_command=%s\n' "${LAST_FAILURE_COMMAND:-unavailable}"
                printf 'timestamp=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              } > /tmp/rbe-test/configure-failure.txt
              echo "::error::Configure failed: stage=$CURRENT_STAGE exit=$rc line=${LAST_FAILURE_LINE:-unknown}"
              echo '=== FAILURE DISK / MEMORY SNAPSHOT ==='
              df -h /home/runner/work/los || true
              free -h || true
              # P6: avoid a deep uncapped walk while stopping near deadline.
              timeout 10s du -sh out 2>/dev/null || true
            else
              printf 'exit_code=0\nstage=%s\n' "$CURRENT_STAGE" \
                > /tmp/rbe-test/configure-success.txt
            fi
          }
          on_signal() {
            local signal="$1" rc="$2"
            trap - TERM INT
            printf 'signal=%s\nstage=%s\ntimestamp=%s\nrun_id=%s\nattempt=%s\n' \
              "$signal" "$CURRENT_STAGE" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              "${GITHUB_RUN_ID:-unknown}" "${GITHUB_RUN_ATTEMPT:-unknown}" \
              > /tmp/rbe-test/termination-signal.txt
            {
              echo '=== SIGNAL MEMORY SNAPSHOT ==='
              free -h
              swapon --show || true
              ps -eo pid,ppid,rss,stat,comm --sort=-rss | head -n 18 || true
              if [ -r /sys/fs/cgroup/memory.events ]; then
                echo '=== MEMORY CGROUP EVENTS ==='
                cat /sys/fs/cgroup/memory.events
              fi
              grep -E '^(oom_kill|pswpin|pswpout) ' /proc/vmstat || true
              if declare -F record_memory_pressure >/dev/null; then
                record_memory_pressure "signal-$signal" || true
              fi
            } >> /tmp/rbe-test/memory-pressure.log 2>&1
            echo "::error::Received $signal during $CURRENT_STAGE; SIGTERM alone cannot distinguish cancellation from resource pressure." >&2
            exit "$rc"
          }
          trap 'on_error "$LINENO" "$BASH_COMMAND"' ERR
          trap 'on_signal TERM 143' TERM
          trap 'on_signal INT 130' INT
          trap on_exit EXIT
          mark_stage configure-start

          echo "=== DATE / OS / SHELL ==="
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          pwd -P
          bash --version | head -1
          echo "=== JAVA CANDIDATES (NO OVERRIDE YET) ==="
          command -v java || true
          java -version 2>&1 || true
          ls -ld prebuilts/jdk/jdk11/linux-x86 prebuilts/jdk/jdk17/linux-x86 \
            2>/dev/null || true

          # LineageOS 20.0 uses PRODUCT-VARIANT format.
          # TARGET_RELEASE and aosp_target_release are for newer build trees.
          if [ ! -f build/envsetup.sh ]; then
            echo "::error::Missing build/envsetup.sh; check repo sync and working-directory."
            exit 1
          fi
          # Android envsetup/lunch are designed to run in an interactive-like
          # shell. Avoid inherited ERR traps changing command-substitution output
          # (previously visible as the bogus ".../Failure observed" filename).
          trap - ERR
          set +e
          mark_stage envsetup
          source build/envsetup.sh
          ENVSETUP_RC=$?
          if [ "$ENVSETUP_RC" -ne 0 ]; then
            echo "::error::envsetup.sh returned $ENVSETUP_RC" >&2
            exit "$ENVSETUP_RC"
          fi
          echo '=== ENVSETUP PASSED ==='
          mark_stage lunch
          lunch lineage_star2lte-userdebug
          LUNCH_RC=$?
          # Restore strict error checking only after the Lineage shell setup.
          set -e
          trap 'on_error "$LINENO" "$BASH_COMMAND"' ERR
          if [ "$LUNCH_RC" -ne 0 ]; then
            echo "::error::lunch returned $LUNCH_RC" >&2
            exit "$LUNCH_RC"
          fi
          echo '=== LUNCH PASSED ==='
          mark_stage java-selection

          # Prefer the checked-out JDK 11 if this tree selects it.
          # RBE and Android Soong toolchain remain otherwise unchanged.
          if [ -x "$PWD/prebuilts/jdk/jdk11/linux-x86/bin/java" ]; then
            export JAVA_HOME="$PWD/prebuilts/jdk/jdk11/linux-x86"
            export PATH="$JAVA_HOME/bin:$PATH"
          else
            echo "::warning::Bundled JDK 11 is not present at expected path; build system will select its default JDK."
          fi
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          # The Android 13 prebuilt Go toolchain may be older than Go 1.19.
          # GOMEMLIMIT does not exist on Go 1.18; never claim it worked there.
          export GOGC="$SOONG_GOGC"
          unset GOMEMLIMIT || true
          GO_BIN="$PWD/prebuilts/go/linux-x86/bin/go"
          GO_VERSION='unavailable'
          GO_LIMIT_MODE='unsupported-or-unverified'
          if [ -x "$GO_BIN" ]; then
            GO_VERSION="$("$GO_BIN" version 2>&1 || true)"
            if [[ "$GO_VERSION" =~ go([0-9]+)\.([0-9]+) ]]; then
              GO_MAJOR="${BASH_REMATCH[1]}"
              GO_MINOR="${BASH_REMATCH[2]}"
              if (( GO_MAJOR > 1 || (GO_MAJOR == 1 && GO_MINOR >= 19) )); then
                export GOMEMLIMIT="$SOONG_GOMEMLIMIT"
                GO_LIMIT_MODE='enabled-soft-limit'
              fi
            fi
          fi
          printf 'go_tool=%s\ngo_version=%s\ngogc=%s\ngomemlimit_mode=%s\ngomemlimit_value=%s\n' \
            "$GO_BIN" "$GO_VERSION" "$GOGC" "$GO_LIMIT_MODE" \
            "${GOMEMLIMIT:-disabled}" > /tmp/rbe-test/soong-go-runtime.txt
          cat /tmp/rbe-test/soong-go-runtime.txt
          if [ "$GO_LIMIT_MODE" != 'enabled-soft-limit' ]; then
            echo '::warning::Prebuilt Go is older than 1.19 or unverified: GOMEMLIMIT=6GiB cannot be guaranteed. GOGC=25 is still applied.'
          fi
          echo '=== SWAP ==='
          free -h
          swapon --show || true
          echo "=== JAVA VERSION ==="
          java -version 2>&1 || true

          echo "=== LINEAGE BUILD SELECTION ==="
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-unset}"
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-unset}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-unset}"
          echo "TARGET_BUILD_TYPE=${TARGET_BUILD_TYPE:-unset}"

          if [ -z "${ANDROID_BUILD_TOP:-}" ] || \
             [ "${TARGET_PRODUCT:-}" != "lineage_star2lte" ] || \
             [ "${TARGET_BUILD_VARIANT:-}" != "userdebug" ]; then
            echo "::error::Invalid LineageOS build configuration."
            exit 1
          fi

          if [ "$(cd "$ANDROID_BUILD_TOP" && pwd -P)" != "$(pwd -P)" ]; then
            echo "::error::ANDROID_BUILD_TOP does not point at the current source tree."
            exit 1
          fi

          # Keep working_directory non-empty ("los") for BuildBuddy, while
          # upgraded reclient handles output_files relative to that directory.
          export RBE_exec_root="$(dirname "$(pwd -P)")"
          RBE_REL_WORKDIR="$(realpath --relative-to="$RBE_exec_root" "$(pwd -P)")"

          mark_stage rbe-configuration
          echo "=== RBE WORKING DIRECTORY COMPATIBILITY ==="
          echo "RBE_exec_root=$RBE_exec_root"
          echo "RBE_REL_WORKDIR=$RBE_REL_WORKDIR"
          if [ "$RBE_REL_WORKDIR" != "los" ]; then
            echo "::error::Unexpected RBE working directory: $RBE_REL_WORKDIR"
            exit 1
          fi
          if [ ! -d "$RBE_exec_root/$RBE_REL_WORKDIR/bionic" ]; then
            echo "::error::Android source tree is missing under RBE_exec_root."
            exit 1
          fi
          printf 'RBE_exec_root=%s\nRBE_relative_working_dir=%s\n' \
            "$RBE_exec_root" "$RBE_REL_WORKDIR" \
            > /tmp/rbe-test/rbe-working-directory.txt

          echo "=== EFFECTIVE RBE CONFIG ==="
          {
            echo "USE_RBE=${USE_RBE}"
            echo "RBE_service=${RBE_service}"
            echo "RBE_service_no_security=${RBE_service_no_security}"
            echo "RBE_DIR=${RBE_DIR}"
            echo "RBE_exec_root=${RBE_exec_root}"
            echo "RBE_relative_working_dir=${RBE_REL_WORKDIR}"
            echo "RBE_CXX_EXEC_STRATEGY=${RBE_CXX_EXEC_STRATEGY}"
            echo "RBE_use_application_default_credentials=${RBE_use_application_default_credentials}"
            echo "RBE_use_rpc_credentials=${RBE_use_rpc_credentials}"
            echo "RBE_service_no_auth=${RBE_service_no_auth}"
            echo "BuildBuddy auth=loopback nginx gRPC bridge (TLS upstream)"
            echo "RBE_log_dir=${RBE_log_dir}"
            echo "RBE_log_path=DISABLED (deprecated duplicate records)"
            echo "RBE_proxy_log_dir=${RBE_proxy_log_dir}"
            echo "RBE_v=${RBE_v}"
            echo "RBE_output_dir=${RBE_output_dir}"
            echo "NINJA_REMOTE_NUM_JOBS=${NINJA_REMOTE_NUM_JOBS}"
            echo "NINJA_HIGHMEM_NUM_JOBS=${NINJA_HIGHMEM_NUM_JOBS}"
            echo "NINJA_LOCAL_PARALLEL=2"
            echo "WORKSPACE_STORAGE=${WORKSPACE_STORAGE}"
          } | tee /tmp/rbe-test/rbe-env.txt

          # Write stage-specific samples for easy comparison, using bytes
          # instead of the rounded df -h values.
          DISK_SAMPLES=/tmp/rbe-test/resource-samples.tsv
          if [ ! -f "$DISK_SAMPLES" ]; then
            printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$DISK_SAMPLES"
          fi
          # Btrfs loop-image logical capacity is NOT host free space.
          # Both root and inner Btrfs are checked, and the smaller governs.
          BTRFS_ACTIVE=0
          BTRFS_BACKING=/tmp/los20-workspace-btrfs.img
          if [ "$WORKSPACE_STORAGE" = btrfs_zstd ]; then
            mountpoint -q "$PWD" || { echo '::error::Btrfs mount lost'; exit 70; }
            test "$(stat -f -c '%T' "$PWD")" = btrfs
            test -f "$BTRFS_BACKING"
            BTRFS_ACTIVE=1
          fi
          disk_sample() {
            local stage="$1" root_avail root_used inner_avail available mem alloc blocks bsize
            root_avail="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
            root_used="$(df -B1 --output=used / | tail -n 1 | tr -d ' ')"
            inner_avail="$(df -B1 --output=avail "$PWD" | tail -n 1 | tr -d ' ')"
            available="$root_avail"
            if (( inner_avail < available )); then available="$inner_avail"; fi
            mem="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$available" "$root_used" "$mem" >> "$DISK_SAMPLES"
            if (( BTRFS_ACTIVE == 1 )); then
              read -r blocks bsize < <(stat -c '%b %B' "$BTRFS_BACKING")
              alloc=$((blocks*bsize))
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$root_avail" "$inner_avail" "$alloc" \
                >> /tmp/rbe-test/btrfs-storage-samples.tsv
            fi
            printf '%s\n' "$available"
          }
          enforce_initial_disk_guard() {
            local stage="$1" available threshold
            available="$(disk_sample "$stage")"
            threshold=$((DISK_STOP_GIB * 1024 * 1024 * 1024))
            if (( available < threshold )); then
              echo "::error::Root/Btrfs available below ${DISK_STOP_GIB} GiB at ${stage}."
              df -h / "$PWD"
              exit 70
            fi
            echo "=== DISK AT ${stage}: $((available / 1073741824)) GiB physical-safe free ==="
          }
          # The 345-minute deadline is measured from post-reclaim, not from
          # the start of bacon. Supervise Soong graph generation as well.
          if [ -s /tmp/rbe-test/job-start-epoch.txt ]; then
            JOB_START_EPOCH="$(cat /tmp/rbe-test/job-start-epoch.txt)"
          else
            JOB_START_EPOCH="$(date +%s)"
          fi
          SOFT_DEADLINE_EPOCH=$(( JOB_START_EPOCH + FULL_ROM_SOFT_DEADLINE_MINUTES * 60 ))
          echo "=== WHOLE-JOB SOFT DEADLINE (UTC) ==="
          date -u -d "@$SOFT_DEADLINE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ'
          if (( $(date +%s) >= SOFT_DEADLINE_EPOCH )); then
            echo '::error::Whole-job soft deadline already reached before Soong graph generation.'
            exit 71
          fi

          stop_process_tree() {
            local pid="$1" child
            while IFS= read -r child; do
              [ -n "$child" ] || continue
              stop_process_tree "$child"
            done < <(pgrep -P "$pid" 2>/dev/null || true)
            kill -TERM "$pid" 2>/dev/null || true
          }
          # Identify the current cgroup (GitHub-hosted Ubuntu usually uses v2).
          # Always prefer the process's own cgroup, not host-wide counters.
          CGROUP_MEMORY_DIR=''
          if [ -e /sys/fs/cgroup/cgroup.controllers ]; then
            CGROUP_REL="$(awk -F: '$1=="0" {print $3; exit}' /proc/self/cgroup)"
            if [ -d "/sys/fs/cgroup${CGROUP_REL}" ]; then
              CGROUP_MEMORY_DIR="/sys/fs/cgroup${CGROUP_REL}"
            elif [ -d /sys/fs/cgroup ]; then
              CGROUP_MEMORY_DIR=/sys/fs/cgroup
            fi
          fi
          cgroup_read() {
            local name="$1" file
            file="${CGROUP_MEMORY_DIR}/${name}"
            if [ -n "$CGROUP_MEMORY_DIR" ] && [ -r "$file" ]; then
              cat "$file" 2>/dev/null || printf 'na'
            else
              printf 'na'
            fi
          }
          cgroup_event_value() {
            local name="$1" file
            file="${CGROUP_MEMORY_DIR}/memory.events"
            if [ -n "$CGROUP_MEMORY_DIR" ] && [ -r "$file" ]; then
              awk -v key="$name" '$1==key {print $2; found=1; exit} END {if (!found) print "na"}' "$file"
            else
              printf 'na'
            fi
          }
          # Top RSS processes and Soong's VmRSS/VmHWM/VmSwap identify whether
          # Go/Soong or another host process is consuming the RAM.
          record_memory_pressure() {
            local label="$1" pid
            {
              echo "=== $label $(date -u +'%Y-%m-%dT%H:%M:%SZ') ==="
              free -h
              swapon --show || true
              zramctl 2>/dev/null || true
              if [ -r /tmp/rbe-test/zram-device.txt ]; then
                zram_dev="$(cat /tmp/rbe-test/zram-device.txt)"
                zram_node="${zram_dev##*/}"
                if [ -r "/sys/block/${zram_node}/mm_stat" ]; then
                  echo "--- ZRAM ${zram_node} MM_STAT (orig/compressed/mem_used in bytes) ---"
                  cat "/sys/block/${zram_node}/mm_stat"
                fi
              fi
              echo '--- TOP RSS (KiB; command names only; no args or secrets) ---'
              ps -eo pid,ppid,rss,stat,comm --sort=-rss | head -n 18 || true
              echo '--- SOONG BUILD PROCESS DETAILS ---'
              while IFS= read -r pid; do
                [ -n "$pid" ] || continue
                echo "pid=$pid"
                grep -E '^(Name|State|VmRSS|VmHWM|VmSwap|VmSize|Threads):' \
                  "/proc/$pid/status" 2>/dev/null || true
                if [ -r "/proc/$pid/smaps_rollup" ]; then
                  grep -E '^(Rss|Pss|Swap|Private_Dirty):' \
                    "/proc/$pid/smaps_rollup" 2>/dev/null || true
                fi
              done < <(pgrep -x soong_build 2>/dev/null || true)
              echo '--- CGROUP V2 MEMORY ---'
              echo "cgroup_memory_dir=${CGROUP_MEMORY_DIR:-not-available}"
              for metric in memory.current memory.peak memory.max memory.swap.current \
                            memory.swap.peak memory.swap.max memory.events memory.events.local; do
                printf '%s: ' "$metric"
                if [[ "$metric" == *events* ]]; then printf '\n'; fi
                cgroup_read "$metric"
                printf '\n'
              done
              echo '--- PSI / HOST VMSTAT ---'
              [ ! -r /proc/pressure/memory ] || cat /proc/pressure/memory
              grep -E '^(oom_kill|pswpin|pswpout) ' /proc/vmstat || true
            } >> /tmp/rbe-test/memory-pressure.log 2>&1
          }
          # Machine-readable samples preserve last-second state on cancellation.
          SOONG_MEMORY_TSV=/tmp/rbe-test/soong-memory-samples.tsv
          printf 'timestamp\tphase\tmem_available_kib\tswap_free_kib\tsoong_rss_kib\tsoong_hwm_kib\tsoong_swap_kib\tsoong_pids\tcgroup_memory_current_bytes\tcgroup_memory_peak_bytes\tcgroup_swap_current_bytes\tcgroup_swap_peak_bytes\tcgroup_oom\tcgroup_oom_kill\n' \
            > "$SOONG_MEMORY_TSV"
          sample_soong_memory() {
            local phase="$1" pid rss=0 hwm=0 swap=0 pids=0 value
            local mem_avail swap_free
            mem_avail="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            swap_free="$(awk '/^SwapFree:/ {print $2}' /proc/meminfo)"
            while IFS= read -r pid; do
              [ -n "$pid" ] || continue
              [ -r "/proc/$pid/status" ] || continue
              pids=$((pids + 1))
              value="$(awk '/^VmRSS:/ {print $2}' "/proc/$pid/status" 2>/dev/null)"
              rss=$((rss + ${value:-0}))
              value="$(awk '/^VmHWM:/ {print $2}' "/proc/$pid/status" 2>/dev/null)"
              hwm=$((hwm + ${value:-0}))
              value="$(awk '/^VmSwap:/ {print $2}' "/proc/$pid/status" 2>/dev/null)"
              swap=$((swap + ${value:-0}))
            done < <(pgrep -x soong_build 2>/dev/null || true)
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$phase" "$mem_avail" "$swap_free" \
              "$rss" "$hwm" "$swap" "$pids" \
              "$(cgroup_read memory.current)" "$(cgroup_read memory.peak)" \
              "$(cgroup_read memory.swap.current)" "$(cgroup_read memory.swap.peak)" \
              "$(cgroup_event_value oom)" "$(cgroup_event_value oom_kill)" \
              >> "$SOONG_MEMORY_TSV"
          }
          : > /tmp/rbe-test/memory-pressure.log
          if [ -n "$CGROUP_MEMORY_DIR" ] && [ -r "$CGROUP_MEMORY_DIR/memory.events" ]; then
            cp "$CGROUP_MEMORY_DIR/memory.events" \
              /tmp/rbe-test/cgroup-memory-events-before-graph.txt || true
          fi
          record_memory_pressure pre-graph
          sample_soong_memory pre-graph

          # Shared supervisor for both 'nothing' and 'bacon'. It records an
          # explicit phase exit code and distinguishes disk/time stops from
          # compiler errors; an external SIGTERM is separately captured above.
          run_monitored_m() {
            local phase="$1" target="$2" log_file="$3" status_file="$4"
            local disk_trip="$5" time_trip="$6"
            local available now free_gib mem_kib seconds_left last_write idle_secs
            local line wait_rc warned=0 idle_warned=0 tick sample_counter=0
            local p5_probe_pid='' p5_probe_ticks=0
            local p7_trim_started=0 p7_swap_last_try=0
            local p7_ninja_pct=0 p7_swap_status=''
            local p6_ninja_last_epoch p6_ninja_started_epoch
            p6_ninja_started_epoch="$(date +%s)"
            p6_ninja_last_epoch="$p6_ninja_started_epoch"
            rm -f "$status_file" "$disk_trip" "$time_trip"
            (
              # Avoid trap messages being written into Soong's stdout.
              trap - ERR TERM INT
              set +e
              set -o pipefail
              if [ "$phase" = build-graph ]; then
                export GOMAXPROCS="$SOONG_GRAPH_GOMAXPROCS"
                echo "=== SOONG GRAPH GO RUNTIME: GOGC=$GOGC GOMAXPROCS=$GOMAXPROCS GOMEMLIMIT=${GOMEMLIMIT:-not-supported} ==="
              else
                # Only graph generation uses the reduced Go CPU parallelism.
                unset GOMAXPROCS || true
              fi
              m -j2 --skip-soong-tests "$target" 2>&1 | tee "$log_file"
              rc=${PIPESTATUS[0]}
              printf '%s\n' "$rc" > "$status_file"
              exit "$rc"
            ) &
            BUILD_PID=$!
            echo "=== $phase PID=$BUILD_PID; 10s DISK / RAM / TIME SUPERVISOR ==="
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              available="$(disk_sample "$phase-sample")"
              now="$(date +%s)"
              free_gib=$((available / 1073741824))
              mem_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
              seconds_left=$((SOFT_DEADLINE_EPOCH - now))
              last_write="$(stat -c '%Y' "$log_file" 2>/dev/null || printf '%s\n' "$now")"
              idle_secs=$((now - last_write))
              if (( idle_secs < 0 )); then idle_secs=0; fi
              swap_free_kib="$(awk '/^SwapFree:/ {print $2}' /proc/meminfo)"
              line="$(date -u +'%Y-%m-%dT%H:%M:%SZ') phase=$phase pid=$BUILD_PID disk_safe_free=${free_gib}GiB mem_available=${mem_kib}KiB swap_free=${swap_free_kib}KiB log_idle=${idle_secs}s soft_deadline_remaining=${seconds_left}s"
              if (( BTRFS_ACTIVE == 1 )); then
                root_now="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
                inner_now="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
                line="$line host_free_gib=$((root_now / 1073741824)) btrfs_free_gib=$((inner_now / 1073741824))"
              fi
              echo "$line" | tee -a /tmp/rbe-test/resource-monitor.log
              sample_soong_memory "$phase"
              # Live Actions log survives more cancellation scenarios than
              # artifact upload. No arguments/credentials are printed.
              if [ "$phase" = build-graph ]; then
                soong_rss=0; soong_vmswap=0
                while IFS= read -r spid; do
                  [ -r "/proc/$spid/status" ] || continue
                  sr="$(awk '/^VmRSS:/ {print $2}' "/proc/$spid/status" 2>/dev/null)"
                  ss="$(awk '/^VmSwap:/ {print $2}' "/proc/$spid/status" 2>/dev/null)"
                  soong_rss=$((soong_rss + ${sr:-0}))
                  soong_vmswap=$((soong_vmswap + ${ss:-0}))
                done < <(pgrep -x soong_build 2>/dev/null || true)
                zram_used_kib=0; zram_physical_kib=0
                if [ -s /tmp/rbe-test/zram-device.txt ]; then
                  zram_dev="$(cat /tmp/rbe-test/zram-device.txt)"
                  zram_node="${zram_dev##*/}"
                  if [ -r "/sys/block/$zram_node/mm_stat" ]; then
                    read -r z_orig z_compressed z_physical _ < "/sys/block/$zram_node/mm_stat" || true
                    zram_used_kib=$(( ${z_orig:-0} / 1024 ))
                    zram_physical_kib=$(( ${z_physical:-0} / 1024 ))
                  fi
                fi
                echo "SOONG_MEMORY rss_kib=$soong_rss vm_swap_kib=$soong_vmswap zram_logical_kib=$zram_used_kib zram_physical_kib=$zram_physical_kib cgroup_oom_kill=$(cgroup_event_value oom_kill)"
              fi
              # Capture the compiled binary's own Go version once it exists.
              # A runtime compiled with Go 1.18 cannot enforce GOMEMLIMIT.
              if [ "$phase" = build-graph ] && [ ! -s /tmp/rbe-test/soong-build-binary-go-version.txt ] \
                 && [ -x "$ANDROID_BUILD_TOP/out/host/linux-x86/bin/soong_build" ]; then
                if [ -x "$GO_BIN" ]; then
                  "$GO_BIN" version -m "$ANDROID_BUILD_TOP/out/host/linux-x86/bin/soong_build" \
                    > /tmp/rbe-test/soong-build-binary-go-version.txt 2>&1 || true
                fi
              fi
              # Deep samples every 30s or every 10s when RAM is under 4GiB.
              if (( sample_counter % 3 == 0 || mem_kib < 4194304 )); then
                record_memory_pressure "$phase"
              fi
              sample_counter=$((sample_counter + 1))
              # P6: root/image data is sampled every 10 seconds; deep 'du'
              # scans happen only every 30 minutes with a 40-second cap.
              # Disk/time guards never wait for a directory scan.
              p5_probe_ticks=$((p5_probe_ticks + 1))
              if (( p5_probe_ticks * 10 >= P5_STORAGE_SAMPLE_INTERVAL_SECONDS )); then
                p5_probe_ticks=0
                if [ -z "$p5_probe_pid" ] || ! kill -0 "$p5_probe_pid" 2>/dev/null; then
                  (timeout 40s /tmp/rbe-test/p5-storage-probe.sh "$phase" || true) \
                    >> /tmp/rbe-test/p5-storage-probe.log 2>&1 &
                  p5_probe_pid=$!
                fi
              fi

              # P6: Ninja throughput from the last 256 KiB of the local log.
              # Does not scan source/out or read the entire build log.
              if [ "$phase" = full-rom-build ] && \
                 (( now - p6_ninja_last_epoch >= P6_NINJA_SAMPLE_INTERVAL_SECONDS )); then
                p6_ninja_last_epoch="$now"
                if [ -x /tmp/rbe-test/p6-ninja-sample.py ]; then
                  python3 /tmp/rbe-test/p6-ninja-sample.py "$log_file" "$p6_ninja_started_epoch" \
                    | tee -a /tmp/rbe-test/p6-ninja-sample.log || true
                fi
              fi

              # P7: late disk-space recovery.  This is intentionally
              # before the 7-GiB stop, with no change to the stop threshold.
              # Both helpers are bounded, best-effort, and write real df/stat
              # measurements. Never wait for slow trim/swapoff in this loop.
              if [ "$phase" = full-rom-build ]; then
                if (( p7_trim_started == 0 && available < 14*1073741824 && seconds_left > 600 )) \
                   && [[ "${WORKSPACE_STORAGE:-plain}" == btrfs_zstd ]] \
                   && [[ "${P7_BTRFS_FSTRIM:-0}" == 1 ]]; then
                  p7_trim_started=1
                  (/tmp/rbe-test/p7-btrfs-trim.sh low-disk \
                    >> /tmp/rbe-test/p7-recovery-monitor.log 2>&1 || true) &
                  echo 'P7: started one bounded background Btrfs trim.'
                fi
                if (( available < 15*1073741824 && seconds_left > 300 \
                      && now-p7_swap_last_try >= 90 )) \
                   && [[ "${P7_BASE_SWAP_RECLAIM:-0}" == 1 ]] \
                   && [[ ! -f /tmp/rbe-test/p7-base-swap-reclaimed.txt ]]; then
                  p7_ninja_pct="$(awk -F '\t' 'NF >= 5 && $5 ~ /^[0-9]+([.][0-9]+)?$/ {v=$5} END {print v+0}' \
                    /tmp/rbe-test/p6-ninja-throughput.tsv 2>/dev/null || printf 0)"
                  if awk -v current="$p7_ninja_pct" -v threshold="${P7_LATE_SWAP_MIN_PERCENT:-99.50}" \
                      'BEGIN {exit !(current>=threshold)}'; then
                    p7_swap_last_try=$now
                    # Running in the background avoids blocking disk guards.
                    (/tmp/rbe-test/p7-base-swap-reclaim.sh late \
                      >> /tmp/rbe-test/p7-recovery-monitor.log 2>&1 || true) &
                  fi
                fi
              fi

              if (( available < DISK_STOP_GIB * 1073741824 )); then
                echo "Disk safety stop in $phase: available below ${DISK_STOP_GIB} GiB" | tee "$disk_trip"
                echo "::error::Insufficient disk in $phase; terminating children."
                stop_process_tree "$BUILD_PID"
                break
              fi
              if (( now >= SOFT_DEADLINE_EPOCH )); then
                echo "Time safety stop in $phase: passed ${FULL_ROM_SOFT_DEADLINE_MINUTES}-minute whole-job deadline" | tee "$time_trip"
                echo "::error::Stopping $phase before GitHub job timeout to preserve diagnostics."
                stop_process_tree "$BUILD_PID"
                break
              fi
              if (( available < DISK_WARN_GIB * 1073741824 && warned == 0 )); then
                echo "::warning::Less than ${DISK_WARN_GIB} GiB available in $phase."
                warned=1
              fi
              if (( idle_secs >= 900 && idle_warned == 0 )); then
                echo "::warning::$phase has produced no new log output for 15 minutes; inspect CPU/process state."
                ps -o pid,ppid,stat,etime,%cpu,%mem,args -p "$BUILD_PID" || true
                idle_warned=1
              fi
              for ((tick=0; tick<2; tick++)); do
                kill -0 "$BUILD_PID" 2>/dev/null || break
                sleep 5
              done
            done
            set +e
            wait "$BUILD_PID"
            wait_rc=$?
            set -e
            BUILD_PID=''
            MONITORED_RC="$wait_rc"
            # P6 final checkpoint: record end progress even on time/disk stop.
            if [ "$phase" = full-rom-build ] && [ -x /tmp/rbe-test/p6-ninja-sample.py ]; then
              python3 /tmp/rbe-test/p6-ninja-sample.py "$log_file" "$p6_ninja_started_epoch" \
                | tee -a /tmp/rbe-test/p6-ninja-sample.log || true
            fi
            if [ -s "$status_file" ]; then MONITORED_RC="$(cat "$status_file")"; fi
            if [ -s "$disk_trip" ]; then MONITORED_RC=70; fi
            if [ -s "$time_trip" ]; then MONITORED_RC=71; fi
            disk_sample "post-$phase" >/dev/null
            sample_soong_memory "post-$phase exit=$MONITORED_RC"
            record_memory_pressure "post-$phase exit=$MONITORED_RC"
            echo "=== $phase EXIT: $MONITORED_RC ==="
          }

          enforce_initial_disk_guard pre-graph
          mark_stage build-graph
          # From here m-nothing.log and full-rom-build.log capture build output.
          # Do not mirror compiler output into configure-setup.log.
          exec 1>&3 2>&4
          exec 3>&- 4>&-
          : > /tmp/rbe-test/resource-monitor.log
          echo '=== GENERATE BUILD GRAPH (SKIP SOONG UNIT TESTS) ==='
          run_monitored_m build-graph nothing \
            /tmp/rbe-test/m-nothing.log \
            /tmp/rbe-test/graph-exit-code.txt \
            /tmp/rbe-test/graph-disk-stop-triggered.txt \
            /tmp/rbe-test/graph-time-stop-triggered.txt
          if [ "$MONITORED_RC" -ne 0 ]; then
            echo '=== BUILD GRAPH LOG TAIL ==='
            tail -n 180 /tmp/rbe-test/m-nothing.log 2>/dev/null || true
            echo "::error::Soong build graph failed or was stopped (exit $MONITORED_RC)."
            exit "$MONITORED_RC"
          fi
          # Soong's memory-heavy graph is complete. The prior run left only
          # ~19 MiB used inside the 8-GiB graph-only swap file, but did not
          # reclaim it because usage was nonzero. Evict tiny amounts safely.
          # Never swapoff large/populated swap or unlink an active swap file.
          mark_stage post-graph-swap-reclaim
          GRAPH_SWAP=/mnt/soong-swap-graph
          BASE_SWAP=/mnt/soong-swap-base
          RECLAIM_STATUS=/tmp/rbe-test/graph-swap-reclaim.txt
          MAX_RECLAIM_USED_BYTES=$((256 * 1024 * 1024))
          MIN_RAM_MARGIN_BYTES=$((2 * 1024 * 1024 * 1024))
          free_disk_before="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          graph_swap_used='na'
          reclaim_reason='not-present'
          reclaim_result='retained'
          if [ -f "$GRAPH_SWAP" ]; then
            graph_swap_used="$(swapon --bytes --noheadings --show=NAME,USED \
              | awk -v path="$GRAPH_SWAP" '$1==path {print $2; found=1; exit} END {if (!found) print "na"}')"
            mem_available_bytes="$(awk '/^MemAvailable:/ {printf "%.0f", $2 * 1024}' /proc/meminfo)"
            echo "=== GRAPH SWAP RECLAIM PRECHECK: used=${graph_swap_used}B mem_available=${mem_available_bytes}B ==="
            swapon --show=NAME,TYPE,SIZE,USED,PRIO || true
            if [[ ! "$graph_swap_used" =~ ^[0-9]+$ ]]; then
              reclaim_reason='swap-not-active-or-usage-unknown'
            elif ! swapon --noheadings --show=NAME | grep -Fxq "$BASE_SWAP"; then
              reclaim_reason='baseline-swap-not-active'
            elif pgrep -x soong_build >/dev/null 2>&1; then
              reclaim_reason='soong-still-running'
            elif (( graph_swap_used > MAX_RECLAIM_USED_BYTES )); then
              reclaim_reason='more-than-256MiB-swapped'
            elif (( mem_available_bytes < graph_swap_used + MIN_RAM_MARGIN_BYTES )); then
              reclaim_reason='insufficient-RAM-margin'
            else
              # 90-second cap avoids unbounded stalls; swapoff remains best effort.
              # If interrupted or unsuccessful, the file is preserved.
              if sudo timeout --signal=TERM --kill-after=10s 90s swapoff "$GRAPH_SWAP"; then
                reclaim_rc=0
              else
                reclaim_rc=$?
              fi
              if (( reclaim_rc == 0 )) \
                 && ! swapon --noheadings --show=NAME | grep -Fxq "$GRAPH_SWAP"; then
                sudo rm -f -- "$GRAPH_SWAP"
                reclaim_result='reclaimed'
                reclaim_reason='swapoff-success'
                echo 'Graph-only swap deactivated and unlinked after safety checks.'
              else
                reclaim_reason="swapoff-failed-or-timeout-rc-${reclaim_rc}"
                echo "::warning::Swapoff did not safely complete (rc=$reclaim_rc); retained graph swap file."
              fi
            fi
          fi
          free_disk_after="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          freed_disk_bytes=$((free_disk_after - free_disk_before))
          {
            printf 'status=%s\nreason=%s\nused_bytes=%s\n' \
              "$reclaim_result" "$reclaim_reason" "$graph_swap_used"
            printf 'disk_free_before_bytes=%s\ndisk_free_after_bytes=%s\nreclaimed_disk_bytes=%s\n' \
              "$free_disk_before" "$free_disk_after" "$freed_disk_bytes"
          } | tee "$RECLAIM_STATUS"
          if [ "$reclaim_result" != reclaimed ]; then
            echo "::warning::Graph-only swap retained: $reclaim_reason. The 8-GiB file may constrain the ROM build."
          fi
          swapon --show=NAME,TYPE,SIZE,USED,PRIO || true
          df -h /home/runner/work/los
          # P7 early status only: do not disable safety-net swap before bacon.
          /tmp/rbe-test/p7-base-swap-reclaim.sh early || true
          # Attempt hole punching once while Ninja is not compiling.
          /tmp/rbe-test/p7-btrfs-trim.sh post-graph || true
          timeout 40s /tmp/rbe-test/p5-storage-probe.sh after-graph \
            >> /tmp/rbe-test/p5-storage-probe.log 2>&1 || true
          enforce_initial_disk_guard post-graph

          BUILD_NINJA="$ANDROID_BUILD_TOP/out/combined-${TARGET_PRODUCT}.ninja"

          if [ ! -s "$BUILD_NINJA" ]; then
            echo "::warning::Expected combined ninja was not found at: $BUILD_NINJA"
            BUILD_NINJA="$(
              find "$ANDROID_BUILD_TOP/out" \
                -maxdepth 1 \
                -type f \
                -name 'combined*.ninja' \
                -print | head -1
            )"
          fi

          if [ -z "${BUILD_NINJA:-}" ] || [ ! -s "$BUILD_NINJA" ]; then
            echo "::error::Could not locate the generated combined Ninja graph."
            find "$ANDROID_BUILD_TOP/out" -maxdepth 2 -type f -name '*.ninja' -print | head -100 || true
            exit 1
          fi

          echo "BUILD_NINJA=$BUILD_NINJA" | tee /tmp/rbe-test/build-ninja.txt

          mark_stage verify-rbe-graph
          echo "=== VERIFY REWRAPPER IS PRESENT IN GENERATED GRAPH ==="
          : > /tmp/rbe-test/rewrapper-ninja-matches.txt
          FOUND_REWRAPPER=0

          for ninja_file in \
            "$ANDROID_BUILD_TOP/out/soong/build.ninja" \
            "$BUILD_NINJA"; do
            if [ -s "$ninja_file" ]; then
              if grep -n -m 20 -E 'remoteexecution-client/.*/rewrapper|(^|[ /])rewrapper([ "]|$)' \
                "$ninja_file" \
                | tee -a /tmp/rbe-test/rewrapper-ninja-matches.txt; then
                FOUND_REWRAPPER=1
              fi
            fi
          done

          if [ "$FOUND_REWRAPPER" -ne 1 ]; then
            echo "::error::RBE is enabled, but no rewrapper command was found in the generated Ninja graph."
            echo "This means the C/C++ actions are not actually being routed through reclient."
            exit 1
          fi

          # Reclient 0.57+ understands working-directory-relative outputs.
          # No rewrapper output-directory shim is installed: the Remote
          # Execution API requires output paths relative to working_directory.
          echo "=== PINNED RECLIENT OUTPUT PATH CHECK ==="
          cat /tmp/rbe-test/reclient-version.txt
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/reproxy"

          # P4: Verify the actual generated Ninja command uses fallback. The
          # workflow env alone is not proof: Soong may override the strategy.
          mark_stage verify-rbe-fallback
          FALLBACK_LOG=/tmp/rbe-test/rbe-fallback-preflight.log
          {
            echo '=== P4 GENERATED RBE CXX STRATEGY ==='
            echo "requested=$RBE_CXX_EXEC_STRATEGY"
            if [ -s "$ANDROID_BUILD_TOP/out/soong/build.ninja" ]; then
              grep -a -m 2 -E 'g\.android\.soong\.cc\.config\.CcWrapper|--exec_strategy=remote_local_fallback' \
                "$ANDROID_BUILD_TOP/out/soong/build.ninja" | cut -c 1-1200 || true
            fi
          } | tee "$FALLBACK_LOG"
          if ! grep -aFq -- '--exec_strategy=remote_local_fallback' \
                "$ANDROID_BUILD_TOP/out/soong/build.ninja"; then
            echo '::error::Generated Soong Ninja graph is NOT using remote_local_fallback.' | tee -a "$FALLBACK_LOG"
            echo '::error::Check whether Soong overwrote RBE_CXX_EXEC_STRATEGY.'
            exit 1
          fi
          echo 'P4 generated rewrapper strategy verified.' | tee -a "$FALLBACK_LOG"

          # P4.1: The P4 preflight incorrectly expected libvpx/libvpx/vpx_dsp/arm
          # even though the generated arm-neon sources are under config/arm-neon.
          # Extract the ACTUAL Clang commands from the already-generated Ninja
          # graph and execute them LOCALLY with isolated outputs. This checks
          # the same flags/includes as bacon, without invoking rewrapper or
          # writing any object into out/soong.
          # Missing Ninja targets/tool introspection are logged as SKIPPED (not
          # a missing-source failure); only an actual failing local Clang action
          # blocks the ROM build.
          mark_stage preflight-libvpx-asm
          LIBVPX_LOG=/tmp/rbe-test/libvpx-asm-preflight.log
          LIBVPX_OUT=/tmp/rbe-test/libvpx-asm-preflight
          mkdir -p "$LIBVPX_OUT"
          {
            python3 - "$BUILD_NINJA" "$LIBVPX_OUT" <<'PYLIBVPXP41'
          import os
          import re
          import shlex
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          graph = Path(sys.argv[1])
          output_dir = Path(sys.argv[2]).resolve()
          output_dir.mkdir(parents=True, exist_ok=True)
          ninja = shutil.which('ninja')
          names = ('idct4x4_add_neon.asm', 'idct_neon.asm')
          prefix = 'out/soong/.intermediates/external/libvpx/libvpx/'
          path_marker = '/obj/external/libvpx/config/arm-neon/vpx_dsp/arm/'
          source_dir = Path('external/libvpx/config/arm-neon/vpx_dsp/arm')
          config_asm = Path('external/libvpx/config/arm-neon/vpx_config.asm')

          print('=== P4.1 LIBVPX PRE-FLIGHT FROM ACTUAL NINJA COMMANDS ===', flush=True)
          print(f'graph={graph}', flush=True)
          print(f'ninja={ninja or "unavailable"}', flush=True)
          print(f'output_dir={output_dir}', flush=True)
          if not graph.is_file() or not ninja:
              print('::warning::SKIPPED: Ninja graph/tool unavailable; bacon will perform the compile.', flush=True)
              sys.exit(0)

          # Stream target discovery so this large Android graph is not loaded
          # into Python memory. Prefer the vendor ARM variant seen in P3.
          found = {}
          try:
              with subprocess.Popen(
                  ['timeout', '100', ninja, '-f', str(graph), '-t', 'targets', 'all'],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                  text=True, errors='replace') as proc:
                  for line in proc.stdout:
                      target = line.split(': ', 1)[0]
                      if not target.startswith(prefix) or path_marker not in target:
                          continue
                      variant = target.split(path_marker, 1)[0]
                      bucket = found.setdefault(variant, {})
                      for name in names:
                          if target.endswith('/' + name + '.o'):
                              bucket[name] = target
                  status = proc.wait()
          except (OSError, subprocess.SubprocessError) as exc:
              print(f'::warning::SKIPPED: Ninja target discovery unavailable: {exc}', flush=True)
              sys.exit(0)
          if status != 0:
              print(f'::warning::SKIPPED: Ninja target discovery exited {status}', flush=True)
              sys.exit(0)

          viable = [(v, group) for v, group in found.items() if len(group) == len(names)]
          if not viable:
              print('::warning::SKIPPED: No matching pair of libvpx arm-neon Ninja outputs; not assuming a source path.', flush=True)
              sys.exit(0)
          # Deterministic choice: prefer android_vendor ARM build; otherwise
          # choose any matching pair from the generated graph.
          viable.sort(key=lambda item: (0 if '/android_vendor.' in item[0] else 1, item[0]))
          variant, targets = viable[0]
          print(f'ninja_variant={variant}', flush=True)
          print(f'matching_variants={len(viable)}', flush=True)
          for name in names:
              path = source_dir / (name + '.S')
              if not path.is_file() or path.stat().st_size == 0:
                  sys.exit(f'ERROR: source referenced by Ninja is missing or empty: {path}')
              print(f'source={path} size={path.stat().st_size}', flush=True)
          if not config_asm.is_file() or config_asm.stat().st_size == 0:
              sys.exit(f'ERROR: ARM configuration include is missing: {config_asm}')
          print(f'config_include={config_asm}', flush=True)

          for name in names:
              target = targets[name]
              source = (source_dir / (name + '.S')).as_posix()
              print(f'=== EXTRACT LOCAL ACTION: {target} ===', flush=True)
              try:
                  result = subprocess.run(
                      ['timeout', '100', ninja, '-f', str(graph), '-t', 'commands', target],
                      capture_output=True, text=True, errors='replace', timeout=110)
              except (OSError, subprocess.SubprocessError) as exc:
                  print(f'::warning::SKIPPED source={source}: Ninja command lookup error: {exc}', flush=True)
                  continue
              if result.returncode != 0:
                  print(f'::warning::SKIPPED source={source}: Ninja commands returned {result.returncode}: {result.stderr[-800:]}', flush=True)
                  continue
              selected = None
              for raw in result.stdout.splitlines():
                  if source not in raw or 'rewrapper' not in raw:
                      continue
                  try:
                      tokens = shlex.split(raw)
                  except ValueError:
                      continue
                  idx = next((i for i, x in enumerate(tokens) if re.search(r'/bin/clang(?:\.real)?$', x)), None)
                  if idx is None:
                      continue
                  cmd = tokens[idx:]
                  if source in cmd and '-c' in cmd and '-o' in cmd:
                      selected = cmd
              if selected is None:
                  print(f'::warning::SKIPPED source={source}: no parseable Clang action; bacon will use Ninja.', flush=True)
                  continue
              executable = Path(selected[0])
              if not executable.is_file():
                  sys.exit(f'ERROR: Ninja Clang executable missing: {executable}')
              dest = output_dir / (name + '.o')
              depfile = output_dir / (name + '.d')
              cmd = list(selected)
              cmd[cmd.index('-o') + 1] = str(dest)
              if '-MF' in cmd:
                  cmd[cmd.index('-MF') + 1] = str(depfile)
              # The command is retrieved from Ninja, not guessed by this script;
              # local execution intentionally bypasses rewrapper.
              print('local_command=' + shlex.join(cmd), flush=True)
              try:
                  run = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                       text=True, errors='replace', timeout=120)
              except subprocess.TimeoutExpired:
                  sys.exit(f'ERROR: local Clang preflight timed out: {source}')
              print(run.stdout[-12000:], flush=True)
              if run.returncode != 0:
                  sys.exit(f'ERROR: local Clang failed rc={run.returncode} source={source}')
              if not dest.is_file() or dest.stat().st_size == 0:
                  sys.exit(f'ERROR: Clang returned success without object: {dest}')
              print(f'PASS: {source} -> {dest} ({dest.stat().st_size} bytes)', flush=True)
          print('P4.1 preflight finished; full ROM build may proceed.', flush=True)
          PYLIBVPXP41
          } 2>&1 | tee "$LIBVPX_LOG"
          # All preflight output stays under /tmp; no generated Ninja target
          # is modified. pipefail propagates genuine local Clang failures.

          mark_stage pre-build
          echo "=== FULL ROM BUILD: star2lte / bacon ==="
          echo "RBE remote_local_fallback enabled; local jobs=2, remote jobs=${NINJA_REMOTE_NUM_JOBS}, highmem=1."
          echo "The previous libbase test passed; this run compiles and packages the full ROM."
          enforce_initial_disk_guard pre-build

          if (( $(date +%s) >= SOFT_DEADLINE_EPOCH )); then
            echo '::error::Not enough whole-job time remains to begin full ROM build.'
            exit 71
          fi
          BUILD_LOG=/tmp/rbe-test/full-rom-build.log
          mark_stage full-rom-build
          run_monitored_m full-rom-build bacon "$BUILD_LOG" \
            /tmp/rbe-test/build-exit-code.txt \
            /tmp/rbe-test/disk-stop-triggered.txt \
            /tmp/rbe-test/time-stop-triggered.txt
          BUILD_RC="$MONITORED_RC"

          if [ "$BUILD_RC" -ne 0 ]; then
            echo '=== BUILD ERROR LINES (LAST 120 MATCHES) ==='
            grep -anE '(^FAILED:|(^|[[:space:]])error:|No space left on device|Killed|ninja failed|out of memory|missing depfile)' "$BUILD_LOG" 2>/dev/null | tail -n 120 || true
            echo '=== FULL ROM BUILD LOG TAIL ==='
            tail -n 200 "$BUILD_LOG" 2>/dev/null || true
            echo '=== REPROXY STDERR TAIL ==='
            tail -n 100 /tmp/rbe-test/reproxy_outerr.log 2>/dev/null || true
            echo "::error::Full ROM build did not complete (exit $BUILD_RC). See attached diagnostics."
            exit "$BUILD_RC"
          fi

          mark_stage verify-rom-zip
          # A successful Ninja exit alone is not enough: verify flashable ZIP.
          ROM_DIR="$ANDROID_BUILD_TOP/out/target/product/star2lte"
          echo "=== ROM OUTPUT DIRECTORY ==="
          ls -lah "$ROM_DIR" | tail -n 45
          mapfile -d '' -t ROM_ZIPS < <(find "$ROM_DIR" -maxdepth 1 -type f -name 'lineage-*.zip' -print0)
          if (( ${#ROM_ZIPS[@]} == 0 )); then
            echo "::error::bacon succeeded but no lineage-*.zip found in $ROM_DIR"
            exit 1
          fi
          ROM_ZIP="${ROM_ZIPS[0]}"
          if (( ${#ROM_ZIPS[@]} > 1 )); then
            ROM_ZIP="$(find "$ROM_DIR" -maxdepth 1 -type f -name 'lineage-*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi
          test -s "$ROM_ZIP"
          echo "ROM_ZIP=$ROM_ZIP"
          ls -lh "$ROM_ZIP"
          echo "=== CHECK ROM ZIP INTEGRITY ==="
          unzip -tq "$ROM_ZIP" | tail -n 8
          sha256sum "$ROM_ZIP" | tee /tmp/rbe-test/rom-sha256.txt
          basename "$ROM_ZIP" > /tmp/rbe-test/rom-filename.txt
          echo "=== FULL ROM BUILD PASSED ==="
          echo "Lineage product: ${TARGET_PRODUCT}-${TARGET_BUILD_VARIANT}"
          echo 'Full bacon target completed with remote C++ compilation enabled.'
          mark_stage complete

      - name: Upload completed LineageOS ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20.0-star2lte-${{ github.run_id }}
          path: /home/runner/work/los/out/target/product/star2lte/lineage-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summarize storage measurements
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/rbe-test
          FILE=/tmp/rbe-test/resource-samples.tsv
          {
            echo '## LineageOS 20.0 full ROM trial — disk and RAM'
            echo ''
            echo '| Stage (UTC) | Free GiB | Used GiB | RAM available GiB |'
            echo '|---|---:|---:|---:|'
            if [ -s "$FILE" ]; then
              # Show first/last rows and build low-watermark; no expensive du.
              awk -F '\t' 'NR>1 && NF>=5 {
                free=$3/1073741824; used=$4/1073741824; ram=$5/1048576;
                if (!seen || free<min) {min=free; low=$2 " " $1};
                if ($2!="build-sample" && $2!="full-rom-sample") printf "| %s: %s | %.1f | %.1f | %.1f |\n",$2,$1,free,used,ram;
                seen=1
              } END {
                if(seen) printf "\nLowest observed free disk: **%.1f GiB** at %s.\n",min,low;
                else print "No storage samples recorded."
              }' "$FILE"
            else
              echo '| No measurements | — | — | — |'
            fi
            echo ''
            echo "Disk guard: warning under ${DISK_WARN_GIB} GiB; safe stop under ${DISK_STOP_GIB} GiB."
            echo "Workspace: **${WORKSPACE_STORAGE}**; Ninja remote=${NINJA_REMOTE_NUM_JOBS}, local=2, highmem=${NINJA_HIGHMEM_NUM_JOBS}."
            echo 'P5: legacy RBE_log_path removed; verbose=0; app/records under workspace compression (when Btrfs is selected).'
            echo "P6: whole-job guard=${FULL_ROM_SOFT_DEADLINE_MINUTES}m / 360m; deep storage=${P5_STORAGE_SAMPLE_INTERVAL_SECONDS}s; Ninja throughput=${P6_NINJA_SAMPLE_INTERVAL_SECONDS}s."
            echo ''
            echo '### P7 early runtime, base swap and Btrfs trim — physical disk deltas'
            for p7file in /tmp/rbe-test/p7-runtime-cleanup-summary.txt                           /tmp/rbe-test/p7-runtime-cleanup.tsv                           /tmp/rbe-test/p7-base-swap-reclaim.log                           /tmp/rbe-test/p7-btrfs-trim.tsv; do
              if [ -s "$p7file" ]; then
                echo "**$(basename "$p7file")**"
                echo '```text'
                tail -n 20 "$p7file"
                echo '```'
              fi
            done

            if [ -s /tmp/rbe-test/p5-storage-profile.tsv ]; then
              echo ''
              echo '### P5 storage footprint (most recent samples; bytes)'
              echo '```text'
              tail -n 6 /tmp/rbe-test/p5-storage-profile.tsv
              echo '```'
            fi
            if [ -s /tmp/rbe-test/btrfs-storage-samples.tsv ]; then
              echo '### Btrfs ZSTD host/root accounting'
              echo '```text'
              tail -n 8 /tmp/rbe-test/btrfs-storage-samples.tsv
              echo '```'
            fi
            if [ -s /tmp/rbe-test/p6-ninja-throughput.tsv ]; then
              echo ''
              echo '### P6 Ninja throughput (last 8 checkpoints)'
              echo 'Actions per minute are raw Ninja action counts, not time-weighted progress.'
              echo '```text'
              tail -n 9 /tmp/rbe-test/p6-ninja-throughput.tsv
              echo '```'
            fi
            if [ -s /tmp/rbe-test/webview-lfs-check.log ]; then
              echo '### WebView LFS validation'

              echo '```text'
              tail -n 15 /tmp/rbe-test/webview-lfs-check.log
              echo '```'
            fi
            echo "Soong: GOGC=${SOONG_GOGC}; GOMEMLIMIT=${SOONG_GOMEMLIMIT} (Go >=1.19 only); graph GOMAXPROCS=${SOONG_GRAPH_GOMAXPROCS}."
            echo "Hybrid swap requested: ZRAM=${SOONG_ZRAM_GIB}GiB logical; disk=${SOONG_DISK_SWAP_GIB}GiB (post-graph base ${POST_GRAPH_DISK_SWAP_GIB}GiB)."
            echo '### Soong Go/runtime verification'
            if [ -s /tmp/rbe-test/soong-go-runtime.txt ]; then
              echo '```text'
              cat /tmp/rbe-test/soong-go-runtime.txt
              echo '```'
            fi
            if [ -s /tmp/rbe-test/soong-build-binary-go-version.txt ]; then
              echo '```text'
              cat /tmp/rbe-test/soong-build-binary-go-version.txt
              echo '```'
            fi
            if [ -s /tmp/rbe-test/soong-memory-samples.tsv ]; then
              awk -F '\t' 'NR > 1 && NF >= 14 {
                if($5 > maxrss) maxrss=$5;
                if($7 > maxswap) maxswap=$7;
                if($3 > 0 && (minram == 0 || $3 < minram)) minram=$3;
                if($14 != "na" && $14 != "" && $14+0 > maxkill) maxkill=$14+0
              } END {
                printf "Peak sampled soong_build RSS: **%.2f GiB**; VmSwap: **%.2f GiB**; lowest available RAM: **%.2f GiB**.\n", maxrss/1048576, maxswap/1048576, minram/1048576;
                printf "Maximum sampled cgroup oom_kill counter: **%d** (check baseline for changes).\n", maxkill
              }' /tmp/rbe-test/soong-memory-samples.tsv
            fi
            for status in /tmp/rbe-test/zram-status.txt /tmp/rbe-test/swap-status.txt /tmp/rbe-test/graph-swap-reclaim.txt; do
              if [ -s "$status" ]; then
                echo '```text'
                echo "$(basename "$status")"
                cat "$status"
                echo '```'
              fi
            done
            if [ -s /tmp/rbe-test/disk-stop-triggered.txt ]; then
              echo '**Guard triggered: build terminated due to low disk.**'
            fi
            echo ''
            echo '### Prebuilts: largest directories (post-sync)'
            if [ -s /tmp/rbe-test/prebuilts-size.log ]; then
              echo '```text'
              tail -n 16 /tmp/rbe-test/prebuilts-size.log
              echo '```'
            else
              echo 'No prebuilts breakdown was captured.'
            fi
            echo ''
            echo '### Git repo metadata: largest directories (post-sync)'
            if [ -s /tmp/rbe-test/repo-size.log ]; then
              echo '```text'
              tail -n 12 /tmp/rbe-test/repo-size.log
              echo '```'
            else
              echo 'No .repo breakdown was captured.'
            fi
            echo ''
            echo '### Clang toolchains: largest paths'
            if [ -s /tmp/rbe-test/clang-detail.log ]; then
              echo '```text'
              tail -n 18 /tmp/rbe-test/clang-detail.log
              echo '```'
            else
              echo 'No Clang deep profile was captured.'
            fi
            echo ''
            echo '### Gradle plugin: largest paths'
            if [ -s /tmp/rbe-test/gradle-detail.log ]; then
              echo '```text'
              tail -n 10 /tmp/rbe-test/gradle-detail.log
              echo '```'
            else
              echo 'No Gradle deep profile was captured.'
            fi
            echo ''
            echo '### Platform Git objects: largest paths'
            if [ -s /tmp/rbe-test/platform-objects-detail.log ]; then
              echo '```text'
              tail -n 16 /tmp/rbe-test/platform-objects-detail.log
              echo '```'
            else
              echo 'No platform Git-object deep profile was captured.'
            fi
            echo ''
            if [ -s /tmp/rbe-test/prebuilts-projects.log ]; then
              echo "Prebuilts projects listed in manifest: **$(wc -l < /tmp/rbe-test/prebuilts-projects.log)**."
            else
              echo 'No prebuilts manifest project list was captured.'
            fi
            echo 'Storage profiling did not modify source or Git objects.'
            echo ''
            echo '### P1 host-binary / historical ABI worktree trim'
            if [ -s /tmp/rbe-test/storage-trim-p1.log ]; then
              echo '```text'
              grep -E '^(TRIM |SKIP |disk_available_(before|after|delta)_bytes=|P1 trim changes)' \
                /tmp/rbe-test/storage-trim-p1.log | tail -n 30 || true
              echo '```'
            else
              echo 'P1 trim did not execute.'
            fi
            echo ''
            echo '### P0 reclient trim'
            if [ -s /tmp/rbe-test/p0-storage-trim-status.txt ]; then
              cat /tmp/rbe-test/p0-storage-trim-status.txt
            else
              echo 'P0 trim did not finish; see diagnostic artifact.'
            fi
            if [ -s /tmp/rbe-test/p0-reclient-size.txt ]; then
              echo '```text'
              cat /tmp/rbe-test/p0-reclient-size.txt
              echo '```'
            fi
            echo ''
            echo '### Configure stage (P0.1 diagnostics)'
            if [ -s /tmp/rbe-test/configure-failure.txt ]; then
              echo '**The configure/build step exited with an error:**'
              echo '```text'
              cat /tmp/rbe-test/configure-failure.txt
              echo '```'
            elif [ -s /tmp/rbe-test/configure-success.txt ]; then
              echo 'Configure/build step completed successfully.'
            else
              echo 'Configure/build step did not record a final exit status.'
            fi
            if [ -s /tmp/rbe-test/configure-stages.log ]; then
              echo '```text'
              tail -n 20 /tmp/rbe-test/configure-stages.log
              echo '```'
            fi
            echo ''
            echo '### ROM output'
            if [ -s /tmp/rbe-test/rom-filename.txt ]; then
              echo "ROM ZIP: **$(cat /tmp/rbe-test/rom-filename.txt)**"
              echo ''
              echo '```text'
              cat /tmp/rbe-test/rom-sha256.txt 2>/dev/null || true
              echo '```'
            else
              echo 'No verified ROM ZIP created in this run.'
            fi
            if [ -s /tmp/rbe-test/time-stop-triggered.txt ] || [ -s /tmp/rbe-test/graph-time-stop-triggered.txt ]; then
              echo '**Soft job deadline triggered during graph generation or ROM build.**'
            fi
            if [ -s /tmp/rbe-test/graph-disk-stop-triggered.txt ]; then
              echo '**Build graph stopped for low disk space.**'
            fi
            if [ -s /tmp/rbe-test/termination-signal.txt ]; then
              echo '**External termination signal observed:**'
              echo '```text'
              cat /tmp/rbe-test/termination-signal.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo '=== FINAL DISK AND MEMORY ==='
          df -h / /home/runner/work/los || true
          free -h || true

          echo '=== POST-BUILD OUTPUT STORAGE ==='
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            du -sh /home/runner/work/los/.repo /home/runner/work/los/out \
              2>/dev/null || true
            du -xhd1 /home/runner/work/los/out 2>/dev/null \
              | sort -h | tail -n 35 || true
          } 2>&1 | tee /tmp/rbe-test/disk-analysis-post-build.log

      - name: RBE diagnostics
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e

          mkdir -p /tmp/rbe-test

          echo "=== SAFE RBE ENV ==="
          cat /tmp/rbe-test/rbe-env.txt 2>/dev/null || true

          echo '=== CONFIGURE / LUNCH FAILURE SUMMARY ==='
          cat /tmp/rbe-test/configure-failure.txt 2>/dev/null || true
          echo '=== CONFIGURE STAGES ==='
          cat /tmp/rbe-test/configure-stages.log 2>/dev/null || true
          echo '=== CONFIGURE LOG TAIL (LAST 180 LINES) ==='
          tail -n 180 /tmp/rbe-test/configure-setup.log 2>/dev/null || true

          echo "=== RBE LOG DIRECTORY ==="
          find /tmp/rbe-test \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort || true

          echo "=== REPROXY PROCESSES ==="
          ps aux | grep -E '[r]eproxy|[r]ewrapper|[s]candeps' || true

          echo "=== DISK ==="
          df -h / /home/runner/work/los || true
          echo "=== STORAGE PROFILE SAMPLING ==="
          tail -n 30 /tmp/rbe-test/resource-samples.tsv 2>/dev/null || true
          echo "=== RESOURCE MONITOR ==="
          tail -n 60 /tmp/rbe-test/resource-monitor.log 2>/dev/null || true

          echo '=== PREBUILTS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/prebuilts-detail.log 2>/dev/null || true
          echo '=== REPO METADATA LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/repo-size.log 2>/dev/null || true
          echo '=== CLANG TOOLCHAINS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/clang-detail.log 2>/dev/null || true
          echo '=== GRADLE PLUGIN LARGEST DIRECTORIES ==='
          tail -n 15 /tmp/rbe-test/gradle-detail.log 2>/dev/null || true
          echo '=== PLATFORM GIT OBJECTS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/platform-objects-detail.log 2>/dev/null || true
          echo '=== PREBUILTS MANIFEST PROJECT COUNT ==='
          wc -l /tmp/rbe-test/prebuilts-projects.log 2>/dev/null || true

          echo "=== P5 RBE WARNING/ERROR TAIL (CAPPED) ==="
          tail -n 150 /tmp/rbe-test/p5-rbe-warning-tail.txt 2>/dev/null || true
          echo '=== P5 RBE LOG FOOTPRINT ==='
          cat /tmp/rbe-test/p5-rbe-log-footprint.txt 2>/dev/null || true
          echo '=== P5 STORAGE PROFILE LAST 12 ROWS ==='
          tail -n 12 /tmp/rbe-test/p5-storage-profile.tsv 2>/dev/null || true

          echo "=== ALL AVAILABLE RECLIENT LOGS ==="
          find /tmp/rbe-test -maxdepth 3 -type f \
            \( -iname '*log*' -o -name '*.rpl' -o -iname '*metrics*' \) \
            -printf '%p %s bytes\n' | sort || true

          echo "=== RBE ERROR SUMMARY ==="
          grep -aRinE \
            'UNAUTHENTICATED|PERMISSION_DENIED|PermissionDenied|Unauthenticated|Unavailable|DeadlineExceeded|InvalidArgument|working_directory|input root|ResourceExhausted|ERROR|FATAL|failed|connection refused|no such file|exec format error' \
            /tmp/rbe-test \
            --exclude=full-rom-build.log \
            --exclude=m-nothing.log \
            2>/dev/null | head -100 || true

          echo "=== RBE METRICS ==="
          cat /tmp/rbe-test/rbe_metrics.txt 2>/dev/null || true

          echo "=== BUILD GRAPH LOG TAIL ==="
          tail -n 160 /tmp/rbe-test/m-nothing.log 2>/dev/null || true

          echo "=== FULL ROM BUILD LOG TAIL ==="
          tail -n 260 /tmp/rbe-test/full-rom-build.log 2>/dev/null || true
          echo "=== BUILD STOP REASONS ==="
          cat /tmp/rbe-test/*-stop-triggered.txt 2>/dev/null || true
          echo '=== EXTERNAL TERMINATION SIGNAL ==='
          cat /tmp/rbe-test/termination-signal.txt 2>/dev/null || true
          echo '=== HYBRID SWAP STATUS ==='
          cat /tmp/rbe-test/zram-status.txt /tmp/rbe-test/swap-status.txt \
            /tmp/rbe-test/graph-swap-reclaim.txt 2>/dev/null || true
          swapon --show=NAME,TYPE,SIZE,USED,PRIO || true
          zramctl || true
          echo '=== MEMORY PRESSURE TAIL ==='
          tail -n 160 /tmp/rbe-test/memory-pressure.log 2>/dev/null || true
          echo '=== SOONG GO VERSION AND ACTIVE GC LIMIT ==='
          cat /tmp/rbe-test/soong-go-runtime.txt 2>/dev/null || true
          cat /tmp/rbe-test/soong-build-binary-go-version.txt 2>/dev/null || true
          echo '=== SOONG MEMORY SAMPLES TAIL ==='
          tail -n 30 /tmp/rbe-test/soong-memory-samples.tsv 2>/dev/null || true
          echo '=== CGROUP OOM EVENT BASELINE ==='
          cat /tmp/rbe-test/cgroup-memory-events-before-graph.txt 2>/dev/null || true
          echo '=== P1 STORAGE TRIM SUMMARY ==='
          tail -n 50 /tmp/rbe-test/storage-trim-p1.log 2>/dev/null || true
          echo '=== SOONG GRAPH EXIT CODE ==='
          cat /tmp/rbe-test/graph-exit-code.txt 2>/dev/null || true
          echo "=== ROM ZIP FILES IF PRESENT ==="
          find /home/runner/work/los/out/target/product/star2lte -maxdepth 1 \
            -type f -name 'lineage-*.zip' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Snapshot P5 RBE log footprint and largest build outputs
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/rbe-test
          if [ -x /tmp/rbe-test/p5-storage-probe.sh ]; then
            timeout 45s /tmp/rbe-test/p5-storage-probe.sh final \
              >> /tmp/rbe-test/p5-storage-probe.log 2>&1 || true
          fi
          {
            echo '=== P5 LOG FILE INVENTORY (FILE SIZES ONLY; NO CONTENT) ==='
            # Do not scan all of .repo or copy multi-GiB action records.
            for dir in "$RBE_log_dir" "$RBE_proxy_log_dir"; do
              if [ -d "$dir" ]; then
                echo "directory=$dir"
                find "$dir" -maxdepth 1 -type f -printf '%s bytes %f\n' \
                  2>/dev/null | sort -nr | head -30
                find "$dir" -maxdepth 1 -type l -printf 'symlink %f\n' \
                  2>/dev/null | head -20
              fi
            done
            echo '=== BTRFS IMAGE PHYSICAL SPACE ==='
            stat -c 'image_blocks=%b block_bytes=%B logical_bytes=%s' \
              /tmp/los20-workspace-btrfs.img 2>/dev/null || true
            df -hT / /home/runner/work/los
          } > /tmp/rbe-test/p5-rbe-log-footprint.txt 2>&1
          # Keep only a small error/warning tail in diagnostics. The original
          # multi-GiB INFO/RPL/rrpl files stay OUT of the uploaded artifact.
          : > /tmp/rbe-test/p5-rbe-warning-tail.txt
          if [ -d "$RBE_log_dir" ]; then
            while IFS= read -r -d '' file; do
              echo "=== $(basename "$file") ===" >> /tmp/rbe-test/p5-rbe-warning-tail.txt
              tail -n 150 -- "$file" >> /tmp/rbe-test/p5-rbe-warning-tail.txt 2>&1
            done < <(find "$RBE_log_dir" -maxdepth 1 -type f \
              \( -name '*.WARNING*' -o -name '*.ERROR*' \) -print0 2>/dev/null)
          fi
          echo '=== LARGEST OUT/SOONG CHILDREN (READ ONLY; 45s CAP) ===' \
            > /tmp/rbe-test/p5-out-soong-top.txt
          timeout 45s du -xB1 -d 1 /home/runner/work/los/out/soong \
            >> /tmp/rbe-test/p5-out-soong-top.txt 2>&1 || true
          echo '=== LARGE OUTPUT FILES >= 512 MiB (READ ONLY; 45s CAP) ===' \
            > /tmp/rbe-test/p5-large-output-files.txt
          timeout 45s find /home/runner/work/los/out -xdev -type f \
            -size +512M -printf '%s bytes %p\n' \
            >> /tmp/rbe-test/p5-large-output-files.txt 2>&1 || true
          echo '=== P7 RUNTIME / SWAP / BTRFS RECLAIM ==='
          for file in /tmp/rbe-test/p7-runtime-cleanup-summary.txt \
                      /tmp/rbe-test/p7-runtime-cleanup.tsv \
                      /tmp/rbe-test/p7-base-swap-reclaim.log \
                      /tmp/rbe-test/p7-btrfs-trim.tsv; do
            if [ -s "$file" ]; then echo "--- $file"; tail -n 50 "$file"; fi
          done
          echo 'P5/P7 diagnostics: do not delete live RBE logs or build outputs.'

      - name: Release hybrid swap at job end (best effort)
        if: always()
        shell: bash
        run: |
          set +e
          # On a canceled/low-memory runner, swapoff can allocate several GiB
          # and trigger another OOM. Do not swapoff non-empty swap devices.
          # Runner is ephemeral; leave in-use devices until VM teardown.
          for SWAPFILE in /mnt/soong-swap-graph /mnt/soong-swap-base; do
            if [ ! -f "$SWAPFILE" ]; then continue; fi
            USED="$(swapon --bytes --noheadings --show=NAME,USED | awk -v path="$SWAPFILE" '$1==path {print $2; found=1; exit} END {if (!found) print "na"}')"
            if [ "$USED" = 0 ] && sudo swapoff "$SWAPFILE"; then
              sudo rm -f "$SWAPFILE"
              echo "Released unused swap $SWAPFILE"
            else
              echo "Retained swap $SWAPFILE used_bytes=$USED (na = unknown; not unlinking)"
            fi
          done
          if [ -s /tmp/rbe-test/zram-device.txt ]; then
            ZRAM_DEV="$(cat /tmp/rbe-test/zram-device.txt)"
            USED="$(swapon --bytes --noheadings --show=NAME,USED | awk -v path="$ZRAM_DEV" '$1==path {print $2; found=1; exit} END {if (!found) print "na"}')"
            if [ "$USED" = 0 ] && sudo swapoff "$ZRAM_DEV"; then
              sudo zramctl --reset "$ZRAM_DEV" || true
              echo "Released unused zram $ZRAM_DEV"
            else
              echo "Retained zram $ZRAM_DEV used_bytes=$USED"
            fi
          fi
          echo '=== SWAP AFTER SAFE CLEANUP ==='
          swapon --show || true
          df -h /

      - name: Stop BuildBuddy gRPC bridge and remove credentials
        if: always()
        shell: bash
        run: |
          set +e
          CFG="/tmp/buildbuddy-rbe-bridge/nginx.conf"
          if [ -f "$CFG" ]; then
            nginx -s quit -c "$CFG" >/dev/null 2>&1 || true
          fi
          rm -rf /tmp/buildbuddy-rbe-bridge
          echo "BuildBuddy bridge configuration removed."

      - name: Redact BuildBuddy API key from RBE artifacts
        if: always()
        shell: bash
        run: |
          set -e
          python3 - <<'PYREDACT'
          import os
          from pathlib import Path

          key = os.environ.get("BUILDBUDDY_API_KEY", "").encode()
          root = Path("/tmp/rbe-test")
          if key and root.is_dir():
              for file in root.rglob("*"):
                  if not file.is_file() or file.is_symlink():
                      continue
                  data = file.read_bytes()
                  if key in data:
                      # Preserve file length for binary diagnostic formats.
                      file.write_bytes(data.replace(key, b"*" * len(key)))
                      print(f"Redacted secret from: {file.relative_to(root)}")
          PYREDACT

      - name: Upload full ROM trial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbe-test-logs-${{ github.run_id }}
          path: |
            /tmp/rbe-test
            /home/runner/work/los/.repo/repo.log
          if-no-files-found: warn
          retention-days: 7

      # Always run AFTER ROM and diagnostic uploads; keep mount live for upload.
      - name: Unmount compressed workspace (best effort)
        if: ${{ always() && inputs.workspace_storage == 'btrfs_zstd' }}
        shell: bash
        run: |
          set +e
          WORKSPACE=/home/runner/work/los
          BACKING=/tmp/los20-workspace-btrfs.img
          echo '=== BTRFS FINAL PHYSICAL USAGE ==='
          df -hT / "$WORKSPACE"
          du -h "$BACKING" 2>/dev/null || true
          sync
          if mountpoint -q "$WORKSPACE"; then
            sudo umount "$WORKSPACE"
          fi
          if ! mountpoint -q "$WORKSPACE"; then
            rm -f -- "$BACKING"
            echo 'Btrfs workspace detached; backing image removed.'
          else
            echo '::warning::Btrfs mount busy; leaving image to runner teardown.'
          fi
