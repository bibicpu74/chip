      - name: Snapshot P5 RBE log footprint and largest build outputs
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/rbe-test
          if [ -x /tmp/rbe-test/p5-storage-probe.sh ]; then
            timeout 45s /tmp/rbe-test/p5-storage-probe.sh final \
              >> /tmp/rbe-test/p5-storage-probe.log 2>&1 || true
          fi
          {
            echo '=== P5 LOG FILE INVENTORY (FILE SIZES ONLY; NO CONTENT) ==='
            # Do not scan all of .repo or copy multi-GiB action records.
            for dir in "$RBE_log_dir" "$RBE_proxy_log_dir"; do
              if [ -d "$dir" ]; then
                echo "directory=$dir"
                find "$dir" -maxdepth 1 -type f -printf '%s bytes %f\n' \
                  2>/dev/null | sort -nr | head -30
                find "$dir" -maxdepth 1 -type l -printf 'symlink %f\n' \
                  2>/dev/null | head -20
              fi
            done
            echo '=== BTRFS IMAGE PHYSICAL SPACE ==='
            stat -c 'image_blocks=%b block_bytes=%B logical_bytes=%s' \
              /tmp/los20-workspace-btrfs.img 2>/dev/null || true
            df -hT / /home/runner/work/los
          } > /tmp/rbe-test/p5-rbe-log-footprint.txt 2>&1
          # Keep only a small error/warning tail in diagnostics. The original
          # multi-GiB INFO/RPL/rrpl files stay OUT of the uploaded artifact.
          : > /tmp/rbe-test/p5-rbe-warning-tail.txt
          if [ -d "$RBE_log_dir" ]; then
            while IFS= read -r -d '' file; do
              echo "=== $(basename "$file") ===" >> /tmp/rbe-test/p5-rbe-warning-tail.txt
              tail -n 150 -- "$file" >> /tmp/rbe-test/p5-rbe-warning-tail.txt 2>&1
            done < <(find "$RBE_log_dir" -maxdepth 1 -type f \
              \( -name '*.WARNING*' -o -name '*.ERROR*' \) -print0 2>/dev/null)
          fi
          echo '=== LARGEST OUT/SOONG CHILDREN (READ ONLY; 45s CAP) ===' \
            > /tmp/rbe-test/p5-out-soong-top.txt
          timeout 45s du -xB1 -d 1 /home/runner/work/los/out/soong \
            >> /tmp/rbe-test/p5-out-soong-top.txt 2>&1 || true
          echo '=== LARGE OUTPUT FILES >= 512 MiB (READ ONLY; 45s CAP) ===' \
            > /tmp/rbe-test/p5-large-output-files.txt
          timeout 45s find /home/runner/work/los/out -xdev -type f \
            -size +512M -printf '%s bytes %p\n' \
            >> /tmp/rbe-test/p5-large-output-files.txt 2>&1 || true
          echo '=== P7 RUNTIME / SWAP / BTRFS RECLAIM ==='
          for file in /tmp/rbe-test/p7-runtime-cleanup-summary.txt \
                      /tmp/rbe-test/p7-runtime-cleanup.tsv \
                      /tmp/rbe-test/p7-base-swap-reclaim.log \
                      /tmp/rbe-test/p7-btrfs-trim.tsv; do
