- name: Test BuildBuddy RBE
        working-directory: /home/runner/work/los
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          RBE_SERVICE: grpcs://remote.buildbuddy.io
        run: |
          set -euo pipefail

          echo "========================================"
          echo " BuildBuddy RBE REAL TEST"
          echo "========================================"

          # --------------------------------------------------
          # 1. Check credentials
          # --------------------------------------------------

          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY is missing"
            exit 1
          fi

          echo "[OK] BuildBuddy API key is configured"

          # --------------------------------------------------
          # 2. Check AOSP reclient
          # --------------------------------------------------

          RBE_DIR="$PWD/prebuilts/remoteexecution-client/live"

          echo
          echo "RBE_DIR=$RBE_DIR"

          if [ ! -d "$RBE_DIR" ]; then
            echo "::error::AOSP reclient directory does not exist"
            echo "Expected:"
            echo "$RBE_DIR"
            exit 1
          fi

          if [ ! -x "$RBE_DIR/reproxy" ]; then
            echo "::error::reproxy missing or not executable"
            ls -lah "$RBE_DIR"
            exit 1
          fi

          if [ ! -x "$RBE_DIR/rewrapper" ]; then
            echo "::error::rewrapper missing or not executable"
            ls -lah "$RBE_DIR"
            exit 1
          fi

          echo "[OK] reproxy exists"
          echo "[OK] rewrapper exists"

          # --------------------------------------------------
          # 3. Network
          # --------------------------------------------------

          echo
          echo "=== DNS ==="

          getent hosts remote.buildbuddy.io

          echo "[OK] DNS resolution"

          echo
          echo "=== HTTPS ==="

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/buildbuddy-response \
              --write-out '%{http_code}' \
              --max-time 20 \
              -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}" \
              https://app.buildbuddy.io/
          )"

          echo "HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "::error::BuildBuddy HTTPS returned ${HTTP_CODE}"
            cat /tmp/buildbuddy-response || true
            exit 1
          fi

          echo "[OK] BuildBuddy HTTPS reachable"

          # --------------------------------------------------
          # 4. Create reclient config
          # --------------------------------------------------

          mkdir -p /tmp/rbe-test

          cat > /tmp/rbe-test/reproxy.cfg <<EOF
service=${RBE_SERVICE}
EOF

          echo
          echo "=== reproxy version/help ==="

          "$RBE_DIR/reproxy" --help | head -60 || true

          echo
          echo "=== rewrapper version/help ==="

          "$RBE_DIR/rewrapper" --help | head -60 || true

          # --------------------------------------------------
          # 5. Start reproxy
          # --------------------------------------------------

          echo
          echo "========================================"
          echo " Starting reproxy"
          echo "========================================"

          "$RBE_DIR/reproxy" \
            --cfg="$RBE_DIR/reproxy.cfg" \
            > /tmp/rbe-test/reproxy.log 2>&1 &

          REPROXY_PID=$!

          cleanup() {
            echo
            echo "=== reproxy log ==="
            cat /tmp/rbe-test/reproxy.log || true

            kill "$REPROXY_PID" 2>/dev/null || true
            wait "$REPROXY_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          sleep 5

          if ! kill -0 "$REPROXY_PID" 2>/dev/null; then
            echo "::error::reproxy exited during startup"
            cat /tmp/rbe-test/reproxy.log || true
            exit 1
          fi

          echo "[OK] reproxy is running"

          # --------------------------------------------------
          # 6. Locate compiler
          # --------------------------------------------------

          echo
          echo "========================================"
          echo " Finding compiler"
          echo "========================================"

          CLANG="$(find prebuilts/clang -type f -name clang -perm -111 2>/dev/null | head -1 || true)"

          if [ -z "$CLANG" ]; then
            echo "::error::Could not find AOSP clang"
            exit 1
          fi

          echo "Compiler:"
          echo "$CLANG"

          # --------------------------------------------------
          # 7. Prepare tiny source
          # --------------------------------------------------

          mkdir -p /tmp/rbe-test/src
          mkdir -p /tmp/rbe-test/out

          cat > /tmp/rbe-test/src/test.cc <<'EOF'
          int main() {
            return 0;
          }
          EOF

          # --------------------------------------------------
          # 8. REAL REMOTE EXECUTION
          # --------------------------------------------------

          echo
          echo "========================================"
          echo " Running REAL REMOTE COMPILER ACTION"
          echo "========================================"

          "$RBE_DIR/rewrapper" \
            --cfg="$RBE_DIR/rewrapper.cfg" \
            "$CLANG" \
            -c /tmp/rbe-test/src/test.cc \
            -o /tmp/rbe-test/out/test.o

          # --------------------------------------------------
          # 9. Verify output
          # --------------------------------------------------

          if [ ! -f /tmp/rbe-test/out/test.o ]; then
            echo "::error::Compiler action did not produce output"
            exit 1
          fi

          echo
          echo "========================================"
          echo " RBE TEST PASSED"
          echo "========================================"
          echo
          echo "Remote compiler action completed."
          echo "Output:"
          ls -lh /tmp/rbe-test/out/test.o
