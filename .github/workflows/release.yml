name: LineageOS 22.2 - BuildBuddy RBE Real Compile Test

on:
  workflow_dispatch:

concurrency:
  group: los22-star2lte-rbe-real-test
  cancel-in-progress: true

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      RBE_SERVICE: grpcs://remote.buildbuddy.io
      RBE_DIR: prebuilts/remoteexecution-client/live
      RBE_CXX_EXEC_STRATEGY: remote
      RBE_use_application_default_credentials: "false"
      RBE_remote_headers: x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
      RBE_log_dir: /tmp/rbe-test
      RBE_proxy_log_dir: /tmp/rbe-test
      RBE_output_dir: /tmp/rbe-test
      NINJA_REMOTE_NUM_JOBS: "1"

    steps:
      - name: Reclaim root disk
        run: |
          set -eux
          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true

          # Do not create an 8G swapfile: repo sync can leave only a few GB free.
          mkdir -p /home/runner/work/los /tmp/rbe-test

          echo "=== DISK ==="
          df -h /
          echo "=== MEMORY ==="
          free -h
          echo "=== CPU ==="
          nproc

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 openjdk-21-jdk-headless \
            ninja-build

          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validate BuildBuddy secret
        run: |
          set -eu
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is missing."
            exit 1
          fi
          echo "BuildBuddy API key is present (value hidden)."

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/work/los/.ccache
          key: ccache-los22-star2lte-rbe-${{ github.run_id }}
          restore-keys: |
            ccache-los22-star2lte-rbe-
            ccache-los22-star2lte-
          save-always: true

      - name: repo init + local manifest
        working-directory: /home/runner/work/los
        run: |
          set -eux
          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false

          repo init --depth=1 \
            -u https://github.com/LineageOS/android.git \
            -b lineage-22.2

          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml" \
             ".repo/local_manifests/star2lte.xml"
          test -s ".repo/local_manifests/star2lte.xml"

          echo "=== LOCAL MANIFEST ==="
          sed -n '1,220p' .repo/local_manifests/star2lte.xml

      - name: repo sync
        working-directory: /home/runner/work/los
        timeout-minutes: 120
        run: |
          set -u
          (
            while true; do
              echo "[$(date -u +%H:%M:%S)] sync disk:"
              df -h / | tail -1
              echo "memory:"
              free -h | head -2
              sleep 30
            done
          ) &
          MONPID=$!

          set -e
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch \
            --prune -j"$(nproc)" || \
          repo sync -c --no-clone-bundle --no-tags --prune -j4

          kill "$MONPID" 2>/dev/null || true
          echo "=== REPO SYNC COMPLETE ==="
          df -h / /home/runner/work/los

      - name: Inspect reclient
        working-directory: /home/runner/work/los
        run: |
          set -eux
          ls -lah prebuilts/remoteexecution-client/live
          test -x prebuilts/remoteexecution-client/live/reproxy
          test -x prebuilts/remoteexecution-client/live/rewrapper

          echo "=== reproxy ==="
          prebuilts/remoteexecution-client/live/reproxy --help 2>&1 | head -120 || true
          echo "=== rewrapper ==="
          prebuilts/remoteexecution-client/live/rewrapper --help 2>&1 | head -160 || true

      - name: BuildBuddy connectivity
        working-directory: /home/runner/work/los
        run: |
          set -eux
          getent hosts remote.buildbuddy.io
          curl -fsSIL --max-time 30 https://app.buildbuddy.io/ | head

          HTTP_CODE="$(
            curl -sS -o /tmp/buildbuddy-response.txt \
              -w '%{http_code}' --max-time 30 \
              -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}" \
              https://app.buildbuddy.io/
          )"
          echo "HTTP status: ${HTTP_CODE}"
          case "$HTTP_CODE" in
            2??|3??) ;;
            *) echo "::error::BuildBuddy HTTPS/API-key check failed"; exit 1 ;;
          esac

      - name: Configure Lineage build environment for RBE
        working-directory: /home/runner/work/los
        run: |
          set -ex
          mkdir -p /tmp/rbe-test
          rm -f /tmp/rbe-test/*

          # AOSP/Lineage envsetup and breakfast are not nounset-safe.
          source build/envsetup.sh

          export USE_RBE=1
          export RBE_service="$RBE_SERVICE"
          export RBE_DIR="$RBE_DIR"
          export RBE_CXX_EXEC_STRATEGY="$RBE_CXX_EXEC_STRATEGY"
          export RBE_use_application_default_credentials=false
          export RBE_remote_headers="$RBE_remote_headers"
          export RBE_log_dir="$RBE_log_dir"
          export RBE_proxy_log_dir="$RBE_proxy_log_dir"
          export RBE_output_dir="$RBE_output_dir"
          export NINJA_REMOTE_NUM_JOBS="$NINJA_REMOTE_NUM_JOBS"

          echo "=== RBE VARIABLES ==="
          env | grep '^USE_RBE=' || true
          env | grep '^RBE_' | sed \
            -e 's/^RBE_remote_headers=.*/RBE_remote_headers=<hidden>/' \
            -e 's/^RBE_.*API.*=.*/<redacted>/' || true

          echo "=== breakfast ==="
          breakfast star2lte userdebug

          echo "=== RBE config after breakfast ==="
          env | grep '^RBE_' | sed \
            -e 's/^RBE_remote_headers=.*/RBE_remote_headers=<hidden>/' \
            -e 's/^RBE_.*API.*=.*/<redacted>/' || true

      - name: Generate Android build graph with RBE enabled
        working-directory: /home/runner/work/los
        timeout-minutes: 45
        run: |
          set -ex
          source build/envsetup.sh

          export USE_RBE=1
          export RBE_service="$RBE_SERVICE"
          export RBE_DIR="$RBE_DIR"
          export RBE_CXX_EXEC_STRATEGY="$RBE_CXX_EXEC_STRATEGY"
          export RBE_use_application_default_credentials=false
          export RBE_remote_headers="$RBE_remote_headers"
          export RBE_log_dir="$RBE_log_dir"
          export RBE_proxy_log_dir="$RBE_proxy_log_dir"
          export RBE_output_dir="$RBE_output_dir"
          export NINJA_REMOTE_NUM_JOBS="$NINJA_REMOTE_NUM_JOBS"

          echo "Generating build graph only; NO ROM build."
          m nothing 2>&1 | tee /tmp/rbe-test/m-nothing.log

          echo "=== BUILD OUTPUT ==="
          ls -lah out | head -100 || true
          echo "=== NINJA FILES ==="
          find out -maxdepth 3 -type f \( -name 'build.ninja' -o -name '*.ninja' \) -print | head -100
          echo "=== RBE LOG FILES ==="
          find /tmp/rbe-test -maxdepth 2 -type f -printf '%p\n' 2>/dev/null || true

      - name: Find a real C++ compile target
        shell: bash
        run: |
          set -ex

          source build/envsetup.sh

          export USE_RBE=1
          export RBE_SERVICE="grpcs://remote.buildbuddy.io"
          export RBE_DIR="prebuilts/remoteexecution-client/live"
          export RBE_CXX_EXEC_STRATEGY="remote"
          export RBE_use_application_default_credentials="false"
          export RBE_remote_headers="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
          export RBE_log_dir="/tmp/rbe-test"
          export RBE_proxy_log_dir="/tmp/rbe-test"
          export RBE_output_dir="/tmp/rbe-test"
          export NINJA_REMOTE_NUM_JOBS="1"

          echo "=== TOP ==="
          echo "$TOP"

          echo "=== OUT_DIR ==="
          echo "${OUT_DIR:-unset}"

          echo "=== PRODUCT_OUT ==="
          echo "${PRODUCT_OUT:-unset}"

          echo "=== SOONG_OUT ==="
          echo "${SOONG_OUT:-unset}"

          echo "=== Checking Ninja files ==="

          for f in \
            "${OUT_DIR:-}/soong/build.ninja" \
            "${TOP}/out/soong/build.ninja"
          do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
              BUILD_NINJA="$f"
              break
            fi
          done

          if [ -z "${BUILD_NINJA:-}" ]; then
            echo "::error::Soong build.ninja was not generated."
            echo "=== out/ ==="
            find "$TOP/out" -maxdepth 4 -type f -name 'build.ninja' -print 2>/dev/null || true
            exit 1
          fi

          echo "=== Using build.ninja ==="
          echo "$BUILD_NINJA"

          NINJA_BIN="$TOP/prebuilts/build-tools/linux-x86/bin/ninja"

          echo "=== Ninja version ==="
          "$NINJA_BIN" --version

          NINJA_DIR="$(dirname "$BUILD_NINJA")"

          echo "=== Ninja directory ==="
          echo "$NINJA_DIR"

          cd "$NINJA_DIR"

          echo "=== Ninja targets ==="
          "$NINJA_BIN" -t targets all 2>&1 \
            | head -100 \
            | tee /tmp/rbe-test/ninja-targets.txt

          echo "=== Searching Ninja files for C/C++ compile edges ==="

          grep -R -n -m 50 \
            -E 'command = .*(/clang\+\+|/clang|/gcc|/g\+\+)( |$)' \
            "$NINJA_DIR" \
            --include='*.ninja' \
            2>/dev/null \
            | tee /tmp/rbe-test/cxx-edges.txt || true

          if [ ! -s /tmp/rbe-test/cxx-edges.txt ]; then
            echo "::error::No C/C++ compile rules were found in Soong Ninja files."
            exit 1
          fi

          echo "=== C/C++ compile edges found ==="
          head -20 /tmp/rbe-test/cxx-edges.txt

          echo "=== Extracting first C++ object target ==="

          CXX_OUTPUT="$(
            head -1 /tmp/rbe-test/cxx-edges.txt |
              sed -nE 's/.*build[[:space:]]+([^:]+):.*/\1/p'
          )"

          if [ -z "$CXX_OUTPUT" ]; then
            echo "::error::Could not extract a C++ object target."
            exit 1
          fi

          echo "CXX_OUTPUT=$CXX_OUTPUT"

          echo "$CXX_OUTPUT" > /tmp/rbe-test/cxx-target.txt

          echo "=== Selected target ==="
          cat /tmp/rbe-test/cxx-target.txt

      - name: Execute one real C++ compile
        shell: bash
        run: |
          set -ex

          source build/envsetup.sh

          export USE_RBE=1
          export RBE_SERVICE="grpcs://remote.buildbuddy.io"
          export RBE_DIR="prebuilts/remoteexecution-client/live"
          export RBE_CXX_EXEC_STRATEGY="remote"
          export RBE_use_application_default_credentials="false"
          export RBE_remote_headers="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
          export RBE_log_dir="/tmp/rbe-test"
          export RBE_proxy_log_dir="/tmp/rbe-test"
          export RBE_output_dir="/tmp/rbe-test"
          export NINJA_REMOTE_NUM_JOBS="1"

          TARGET="$(cat /tmp/rbe-test/cxx-target.txt)"

          echo "=== Target ==="
          echo "$TARGET"

          if [ -z "$TARGET" ]; then
            echo "::error::Empty C++ target."
            exit 1
          fi

          if [ -n "${OUT_DIR:-}" ] && [ -f "$OUT_DIR/soong/build.ninja" ]; then
            BUILD_NINJA="$OUT_DIR/soong/build.ninja"
          else
            BUILD_NINJA="$TOP/out/soong/build.ninja"
          fi

          if [ ! -f "$BUILD_NINJA" ]; then
            echo "::error::build.ninja not found: $BUILD_NINJA"
            exit 1
          fi

          NINJA_DIR="$(dirname "$BUILD_NINJA")"
          NINJA_BIN="$TOP/prebuilts/build-tools/linux-x86/bin/ninja"

          cd "$NINJA_DIR"

          echo "=== Running real C++ compile ==="

          "$NINJA_BIN" -v -j1 "$TARGET" \
            2>&1 | tee /tmp/rbe-test/real-cxx-compile.log

          echo "=== Compile finished ==="

          echo "=== RBE logs ==="
          find /tmp/rbe-test -maxdepth 2 -type f -print | sort || true

      - name: Verify RBE activity
        if: always()
        working-directory: /home/runner/work/los
        run: |
          set +e
          echo "=== RBE LOG DIRECTORY ==="
          find /tmp/rbe-test -maxdepth 3 -type f \
            -printf '%p (%s bytes)\n' 2>/dev/null | sort

          echo "=== LOG CONTENT SUMMARY ==="
          for f in /tmp/rbe-test/*; do
            [ -f "$f" ] || continue
            echo
            echo "----- $f -----"
            grep -Ei 'remote|reproxy|rewrapper|execute|upload|download|cache|error|status' \
              "$f" | tail -80 || true
          done

          echo
          echo "=== REAL COMPILE LOG ==="
          tail -200 /tmp/rbe-test/real-compile.log 2>/dev/null || true

      - name: Final disk and RBE diagnostics
        if: always()
        run: |
          set +e
          echo "=== DISK ==="
          df -h / /home/runner/work/los 2>/dev/null || true
          echo "=== MEMORY ==="
          free -h || true
          echo "=== RBE PROCESSES ==="
          ps aux | grep -E 'reproxy|rewrapper' | grep -v grep || true
          echo "=== RBE FILES ==="
          find /tmp/rbe-test -maxdepth 3 -type f -ls 2>/dev/null || true

      - name: Upload RBE diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildbuddy-rbe-diagnostics-${{ github.run_number }}
          path: |
            /tmp/rbe-test/**
          if-no-files-found: warn
          retention-days: 7
